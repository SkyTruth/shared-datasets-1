name: Dataset breaking change alert

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

env:
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  SHARED_DATASETS_BUCKET: skytruth-shared-datasets-1
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12"

jobs:
  route:
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.repo.full_name == github.repository &&
        github.event.pull_request.draft == false
      }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      potential_mutation: ${{ steps.classify.outputs.potential_mutation }}
    steps:
      - name: Classify potential mutation intent
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const expected = context.payload.pull_request;
            const repository = context.payload.repository;
            const request = { ...context.repo, pull_number: expected.number };
            const sameRepo = repo => repo?.id === repository.id && repo?.full_name === repository.full_name;
            const validate = pr => {
              if (!Number.isSafeInteger(expected.number) || expected.number <= 0 ||
                  pr.number !== expected.number || pr.state !== 'open' || pr.draft !== false ||
                  !sameRepo(pr.head?.repo) || !sameRepo(pr.base?.repo) ||
                  pr.head?.sha !== expected.head.sha || !/^[a-f0-9]{40}$/.test(pr.head.sha) ||
                  pr.base?.ref !== 'main' || pr.base?.sha !== expected.base.sha ||
                  !/^[a-f0-9]{40}$/.test(pr.base.sha) ||
                  (pr.body !== null && typeof pr.body !== 'string')) {
                throw new Error('PR identity/state changed or is invalid; rerun against the current PR.');
              }
            };
            const { data: pr } = await github.rest.pulls.get(request);
            validate(pr);
            const files = await github.paginate(github.rest.pulls.listFiles, { ...request, per_page: 100 });
            if (!Number.isSafeInteger(pr.changed_files) || pr.changed_files < 0 || pr.changed_files >= 3000 ||
                !Array.isArray(files) || files.length !== pr.changed_files ||
                files.some(file => !file || typeof file.filename !== 'string' || !file.filename ||
                  (file.previous_filename !== undefined &&
                    (typeof file.previous_filename !== 'string' || !file.previous_filename))) ||
                new Set(files.map(file => file.filename)).size !== files.length) {
              throw new Error('PR file enumeration is invalid or incomplete; mutation intent is unknown.');
            }
            const { data: current } = await github.rest.pulls.get(request);
            validate(current);
            if (current.body !== pr.body || current.changed_files !== pr.changed_files) {
              throw new Error('PR changed during mutation routing; rerun against the current PR.');
            }
            const planPath = path => typeof path === 'string' &&
              path.startsWith('.github/dataset-plans/') && path.endsWith('.json');
            const planFile = files.some(file => planPath(file.filename) || planPath(file.previous_filename));
            const planFence = /```\s*(?:json\s+)?shared-datasets-(?:publish|delete)-plan\b/i.test(pr.body || '');
            core.setOutput('potential_mutation', planFile || planFence);

  alert:
    needs: route
    if: ${{ needs.route.result == 'success' && needs.route.outputs.potential_mutation == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install schema inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin

      - name: Validate checked-in proposed mutation plan
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_mutation_authorization.py preview

      - name: Collect proposed catalog row from PR
        if: ${{ steps.detect.outputs.has_publish_plan == 'true' || steps.detect.outputs.has_delete_plan == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/publish_workflow.py collect-proposed-catalog-row --head-sha "${HEAD_SHA}"

      - name: Detect planned schema compatibility targets
        id: schema_targets
        if: ${{ steps.detect.outputs.has_publish_plan == 'true' }}
        run: |
          set -euo pipefail
          python scripts/publish_workflow.py detect-schema-targets \
            --plan-json publish-plan.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate read-only GCP auth configuration
        if: ${{ steps.detect.outputs.has_publish_plan == 'true' && steps.schema_targets.outputs.has_schema_targets == 'true' }}
        env:
          GCP_READONLY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_READONLY_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_READONLY_SERVICE_ACCOUNT: ${{ vars.GCP_READONLY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [[ -z "${GCP_READONLY_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            echo "Missing repository variable: GCP_READONLY_WORKLOAD_IDENTITY_PROVIDER" >&2
            exit 1
          fi
          if [[ -z "${GCP_READONLY_SERVICE_ACCOUNT}" ]]; then
            echo "Missing repository variable: GCP_READONLY_SERVICE_ACCOUNT" >&2
            exit 1
          fi

      - name: Authenticate read-only to Google Cloud
        if: ${{ steps.detect.outputs.has_publish_plan == 'true' && steps.schema_targets.outputs.has_schema_targets == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_READONLY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_READONLY_SERVICE_ACCOUNT }}

      - name: Collect planned schema compatibility results
        if: ${{ steps.detect.outputs.has_publish_plan == 'true' && steps.schema_targets.outputs.has_schema_targets == 'true' }}
        run: |
          set -euo pipefail
          python scripts/publish_workflow.py check-schema-compatibility --plan-json publish-plan.json --phase planned

      - name: Summarize planned publish breaking alert
        if: ${{ steps.detect.outputs.has_publish_plan == 'true' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          python scripts/publish_workflow.py planned-breaking-alert \
            --plan-type publish \
            --plan-json publish-plan.json \
            --summary-json publish-breaking-alert.json

      - name: Summarize planned delete breaking alert
        if: ${{ steps.detect.outputs.has_delete_plan == 'true' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          python scripts/publish_workflow.py planned-breaking-alert \
            --plan-type delete \
            --plan-json delete-plan.json \
            --summary-json delete-breaking-alert.json

      - name: Send planned breaking alerts
        if: ${{ steps.detect.outputs.has_publish_plan == 'true' || steps.detect.outputs.has_delete_plan == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SHARED_DATASETS_SLACK_WEBHOOK_URL: ${{ secrets.SHARED_DATASETS_SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python scripts/publish_workflow.py send-planned-breaking-alerts
