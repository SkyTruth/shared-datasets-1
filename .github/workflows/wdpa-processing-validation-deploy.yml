name: WDPA isolated processing validation deploy

on:
  workflow_dispatch:
    inputs:
      run_validation:
        description: Build and retain the frozen October artifact bundle
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  REGION: us-central1
  JOB_NAME: wdpa-processing-validation
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/wdpa-processing-validation-deploy.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - run: uv sync --locked --all-groups
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Refuse to replace an active validation execution
        run: |
          set -euo pipefail
          existing="$(gcloud run jobs list --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" \
            --filter="metadata.name=$JOB_NAME" --format='value(metadata.name)')"
          if [[ -z "$existing" ]]; then exit 0; fi
          gcloud run jobs executions list --job="$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" \
            --format=json > "$RUNNER_TEMP/active-validation-executions.json"
          python - "$RUNNER_TEMP/active-validation-executions.json" <<'PY'
          import json, sys
          if any(not execution.get('status', {}).get('completionTime') for execution in json.load(open(sys.argv[1]))):
              raise SystemExit('A validation execution is pending or running; wait before replacing its image or command')
          PY
      - name: Resolve the reviewed staged image artifact
        id: staged-image
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          evidence = json.loads(Path('catalog/wdpa-staged-validation.json').read_text())
          small, sample = evidence['small_fixture'], evidence['compatibility_sample']
          if small['workflow_run_url'] != sample['workflow_run_url'] or small['head_sha'] != sample['head_sha']:
              raise SystemExit('Staged checks must use one reviewed image build')
          match = re.fullmatch(r'https://github.com/SkyTruth/shared-datasets-1/actions/runs/([0-9]+)', sample['workflow_run_url'])
          if not match:
              raise SystemExit('Unexpected staged image artifact origin')
          print('run_id=' + match[1])
          print('config_digest=' + sample['image_digest'])
          print('source_digest=' + evidence['source_tree_sha256'])
          PY
      - name: Download the tested deployment image
        uses: actions/download-artifact@v4
        with:
          name: wdpa-benchmark-image
          run-id: ${{ steps.staged-image.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wdpa-tested-image
      - name: Require small and sampled checks plus disk quota
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/wdpa-tested-image/image.tar.gz" | docker load
          config="$(docker image inspect wdpa-processing-benchmark:local --format '{{.Id}}')"
          [[ "$config" == '${{ steps.staged-image.outputs.config_digest }}' ]]
          actual_source="$(docker run --rm wdpa-processing-benchmark:local python scripts/wdpa_processing_gate.py --print-source-digest)"
          expected_source='${{ steps.staged-image.outputs.source_digest }}'
          [[ "$actual_source" == "$expected_source" ]]
          docker run --rm --volume "$PWD/catalog/wdpa-staged-validation.json:/app/catalog/wdpa-staged-validation.json:ro" \
            wdpa-processing-benchmark:local python scripts/wdpa_processing_gate.py --pre-cloud
      - name: Publish the tested immutable validation image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          tag="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/shared-datasets-jobs/wdpa-validation:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker tag wdpa-processing-benchmark:local "$tag"
          docker run --rm --platform linux/amd64 "$tag" python -c 'import scripts.cloud_wdpa_validation; from osgeo import gdal; assert gdal.VersionInfo("RELEASE_NAME") == "3.6.2"'
          docker push "$tag"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "VALIDATION_IMAGE=${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/shared-datasets-jobs/wdpa-validation@${digest}" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false
      - name: Plan only isolated validation resources
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/prod init -input=false
          bash scripts/terraform_retry.sh -chdir=terraform/envs/prod plan -input=false -refresh=true \
            -out="$RUNNER_TEMP/wdpa-validation.tfplan" \
            -target=module.wdpa_validation_service_account.google_service_account.this \
            -target=google_service_account_iam_member.wdpa_validation_deployer \
            -target=module.wdpa_processing_validation_job.google_cloud_run_v2_job.this \
            -target=google_project_iam_custom_role.wdpa_build_stager \
            -target=google_project_iam_custom_role.wdpa_build_reader \
            -target=google_storage_bucket_iam_member.wdpa_build_stager \
            -target=google_storage_bucket_iam_member.wdpa_build_folder_stager \
            -target=google_storage_bucket_iam_member.wdpa_build_reader \
            -var="wdpa_validation_image=${VALIDATION_IMAGE}" \
            -var="wdpa_validation_image_config_digest=${{ steps.staged-image.outputs.config_digest }}" \
            -var="wdpa_monthly_image=unused-by-isolated-validation" \
            -var="sea_ice_daily_image=unused-by-isolated-validation" \
            -var="eamlis_monthly_image=unused-by-isolated-validation"
          terraform -chdir=terraform/envs/prod show -json "$RUNNER_TEMP/wdpa-validation.tfplan" > "$RUNNER_TEMP/wdpa-validation-plan.json"
      - name: Enforce isolated resource and permission allowlist
        env:
          allowed_exact: |
            module.wdpa_validation_service_account.google_service_account.this
            google_service_account_iam_member.wdpa_validation_deployer
            module.wdpa_processing_validation_job.google_cloud_run_v2_job.this
            google_project_iam_custom_role.wdpa_build_stager
            google_project_iam_custom_role.wdpa_build_reader
            google_storage_bucket_iam_member.wdpa_build_stager
            google_storage_bucket_iam_member.wdpa_build_folder_stager
            google_storage_bucket_iam_member.wdpa_build_reader
        run: |
          uv run --no-sync python scripts/terraform_plan_allowlist.py "$RUNNER_TEMP/wdpa-validation-plan.json" \
            --allowed-exact="$allowed_exact" --block-deletes --refusal-prefix="Refusing isolated WDPA validation deploy"
          uv run --no-sync python scripts/check_wdpa_validation_plan.py \
            "$RUNNER_TEMP/wdpa-validation-plan.json" --image "$VALIDATION_IMAGE" \
            --deployer "$TERRAFORM_SERVICE_ACCOUNT"
      - name: Apply the saved protected plan
        run: bash scripts/terraform_retry.sh -chdir=terraform/envs/prod apply -input=false "$RUNNER_TEMP/wdpa-validation.tfplan"
      - name: Confirm deployed digest
        run: |
          set -euo pipefail
          actual="$(gcloud run jobs describe "$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          [[ "$actual" == "$VALIDATION_IMAGE" ]]
      - name: Plan the scratch upload probe with unchanged image and resources
        if: inputs.run_validation
        run: |
          set -euo pipefail
          bash scripts/terraform_retry.sh -chdir=terraform/envs/prod plan -input=false -refresh=true \
            -out="$RUNNER_TEMP/staging-probe.tfplan" \
            -target=module.wdpa_processing_validation_job.google_cloud_run_v2_job.this \
            -var="wdpa_validation_image=$VALIDATION_IMAGE" \
            -var="wdpa_validation_image_config_digest=${{ steps.staged-image.outputs.config_digest }}" \
            -var=wdpa_validation_staging_probe=true \
            -var=wdpa_monthly_image=unused-by-staging-probe \
            -var=sea_ice_daily_image=unused-by-staging-probe \
            -var=eamlis_monthly_image=unused-by-staging-probe
          terraform -chdir=terraform/envs/prod show -json "$RUNNER_TEMP/staging-probe.tfplan" > "$RUNNER_TEMP/staging-probe-plan.json"
          uv run --no-sync python scripts/terraform_plan_allowlist.py "$RUNNER_TEMP/staging-probe-plan.json" \
            --allowed-exact=module.wdpa_processing_validation_job.google_cloud_run_v2_job.this \
            --block-deletes --refusal-prefix='Refusing WDPA scratch upload probe'
          uv run --no-sync python scripts/check_wdpa_validation_plan.py "$RUNNER_TEMP/staging-probe-plan.json" \
            --image "$VALIDATION_IMAGE" --deployer "$TERRAFORM_SERVICE_ACCOUNT" --staging-probe
      - name: Apply the saved scratch probe command
        if: inputs.run_validation
        run: |
          set -euo pipefail
          bash scripts/terraform_retry.sh -chdir=terraform/envs/prod apply -input=false "$RUNNER_TEMP/staging-probe.tfplan"
          echo STAGING_PROBE_DEPLOYED=true >> "$GITHUB_ENV"
      - name: Verify a real upload before processing
        if: inputs.run_validation
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" \
            --update-env-vars="SHARED_DATASETS_GITHUB_ACTIONS_RUN_URL=${GITHUB_SERVER_URL:?}/${GITHUB_REPOSITORY:?}/actions/runs/${GITHUB_RUN_ID:?}" \
            --wait --format=json > "$RUNNER_TEMP/staging-probe-execution.json"
          python - "$RUNNER_TEMP/staging-probe-execution.json" <<'PYPROBE'
          import json, sys
          execution = json.load(open(sys.argv[1]))
          status = execution['status']
          if not status.get('completionTime') or status.get('succeededCount') != 1 or status.get('failedCount', 0):
              raise SystemExit('The scratch upload probe did not succeed; no full build may start')
          print('Scratch upload probe succeeded: ' + execution['metadata']['name'])
          PYPROBE
      - name: Restore the processing command after the terminal probe
        if: always() && env.STAGING_PROBE_DEPLOYED == 'true'
        run: |
          set -euo pipefail
          gcloud run jobs executions list --job="$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" \
            --format=json > "$RUNNER_TEMP/probe-active-executions.json"
          python - "$RUNNER_TEMP/probe-active-executions.json" <<'PYPROBE'
          import json, sys
          if any(not execution.get('status', {}).get('completionTime') for execution in json.load(open(sys.argv[1]))):
              raise SystemExit('The probe is still active; do not replace its command')
          PYPROBE
          bash scripts/terraform_retry.sh -chdir=terraform/envs/prod plan -input=false -refresh=true \
            -out="$RUNNER_TEMP/restore-processing.tfplan" \
            -target=module.wdpa_processing_validation_job.google_cloud_run_v2_job.this \
            -var="wdpa_validation_image=$VALIDATION_IMAGE" \
            -var="wdpa_validation_image_config_digest=${{ steps.staged-image.outputs.config_digest }}" \
            -var=wdpa_monthly_image=unused-by-restore-processing \
            -var=sea_ice_daily_image=unused-by-restore-processing \
            -var=eamlis_monthly_image=unused-by-restore-processing
          terraform -chdir=terraform/envs/prod show -json "$RUNNER_TEMP/restore-processing.tfplan" > "$RUNNER_TEMP/restore-processing-plan.json"
          uv run --no-sync python scripts/terraform_plan_allowlist.py "$RUNNER_TEMP/restore-processing-plan.json" \
            --allowed-exact=module.wdpa_processing_validation_job.google_cloud_run_v2_job.this \
            --block-deletes --refusal-prefix='Refusing WDPA processing command restoration'
          uv run --no-sync python scripts/check_wdpa_validation_plan.py "$RUNNER_TEMP/restore-processing-plan.json" \
            --image "$VALIDATION_IMAGE" --deployer "$TERRAFORM_SERVICE_ACCOUNT"
          bash scripts/terraform_retry.sh -chdir=terraform/envs/prod apply -input=false "$RUNNER_TEMP/restore-processing.tfplan"
      - name: Start the unattended validation execution
        if: inputs.run_validation
        run: |
          set -euo pipefail
          gcloud run jobs executions list --job="$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" \
            --format=json > "$RUNNER_TEMP/wdpa-validation-executions.json"
          python - "$RUNNER_TEMP/wdpa-validation-executions.json" <<'PY'
          import json, sys
          for execution in json.load(open(sys.argv[1])):
              if not execution.get('status', {}).get('completionTime'):
                  raise SystemExit('A validation execution is already pending or running; wait for terminal status')
          PY
          execution="$(gcloud run jobs execute "$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" \
            --async --format='value(metadata.name)')"
          echo "Frozen processing validation: ${execution}; follow it to terminal status and collect wdpa_cloud_validation_report from Cloud Logging."
