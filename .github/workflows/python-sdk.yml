name: SDK / Python releases

on:
  pull_request:
    paths:
      - api/python/**
      - scripts/python_sdk_*.py
      - .github/workflows/python-sdk.yml
  workflow_run:
    workflows: [CI / Validate and deliver]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' ||
      (github.repository == 'SkyTruth/shared-datasets-1' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.workflow_sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_needed: ${{ steps.release.outputs.release_needed }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - &python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.12"
      - &uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.8"
          enable-cache: false
      - &dependencies
        run: uv sync --locked --only-group ci-plan
      - name: Find unpublished SDK version on accepted passing main
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/python_sdk_publish.py plan
      - name: Require a reviewed version increase
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: uv run --no-sync python scripts/python_sdk_release.py check --base "$PR_BASE" --head HEAD
      - name: Build and test installed wheel and source archive
        if: github.event_name == 'pull_request' || steps.release.outputs.release_needed == 'true'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha || github.sha }}
        run: |
          uv run --no-sync python scripts/python_sdk_release.py build --output "$RUNNER_TEMP/python-sdk-candidate" --python 3.10.20 --python 3.12.12 --source-sha "$SOURCE_SHA"
      - id: candidate
        if: github.event_name == 'pull_request' || steps.release.outputs.release_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sdk-candidate-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-sdk-candidate
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: github.event_name == 'workflow_run' && needs.validate.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: shared-datasets-production
    concurrency:
      group: python-sdk-release
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - *checkout
      - *python
      - *uv
      - *dependencies
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/python-sdk-candidate
      - name: Publish immutable Python SDK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/python_sdk_publish.py publish --directory "$RUNNER_TEMP/python-sdk-candidate"
