name: CI / Refresh owner acceptance
on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types: [ready_for_review]
  workflow_run:
    workflows: [CI / Validate and deliver]
    types: [completed]
permissions:
  actions: write
  pull-requests: read
concurrency:
  group: owner-acceptance-refresh-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const event = context.payload;
            const number = event.pull_request?.number || event.workflow_run?.pull_requests?.[0]?.number;
            if (!number || (event.workflow_run && event.workflow_run.event !== 'pull_request')) return;
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: number});
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== `${repo.owner}/${repo.repo}`) return;
            if ((event.workflow_run && event.workflow_run.head_sha !== pr.head.sha) ||
                (event.review && event.review.commit_id !== pr.head.sha)) return;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {...repo, pull_number: number});
            const decisive = reviews.filter(r => r.user?.login === 'jonaraphael' &&
              ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state))
              .sort((a, b) => a.submitted_at.localeCompare(b.submitted_at) || a.id - b.id).at(-1);
            if (pr.user.login !== 'jonaraphael' &&
                (decisive?.state !== 'APPROVED' || decisive.commit_id !== pr.head.sha)) return;
            const {data} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'ci.yml',
              event: 'pull_request', head_sha: pr.head.sha, per_page: 1});
            const run = data.workflow_runs[0];
            if (!run || run.head_sha !== pr.head.sha || run.status !== 'completed' ||
                !run.pull_requests.some(p => p.number === number)) return;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
              {...repo, run_id: run.id, filter: 'latest'});
            const acceptance = jobs.find(j => j.name === 'owner-acceptance');
            if (acceptance?.conclusion !== 'failure') return;
            if (event.workflow_run && run.run_attempt > 1 &&
                (!decisive || decisive.submitted_at <= acceptance.started_at)) return;
            // Re-running this job includes ci-ready, never its sibling suites.
            await github.rest.actions.reRunJobForWorkflowRun({...repo, job_id: acceptance.id});
