name: Data / Usage collector deploy
permissions:
  actions: read
  pull-requests: read
  deployments: write
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: deployment-dataset-usage
  queue: max
  cancel-in-progress: false
jobs:
  bootstrap:
    name: Apply dataset usage deploy IAM bootstrap
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || inputs.sync_iam) }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: dataset-usage-deploy.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      sync_name: Dataset usage deploy IAM bootstrap
  deploy:
    needs: bootstrap
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && ((github.event_name == 'push' && !inputs.sync_iam) || needs.bootstrap.result == 'success') }}
    uses: ./.github/workflows/ingestion-deploy.yml
    with:
      target: dataset-usage
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
'on':
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
  workflow_call:
    inputs:
      sync_iam:
        required: true
        type: boolean
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
