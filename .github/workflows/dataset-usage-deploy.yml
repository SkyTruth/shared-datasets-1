name: Dataset usage deploy
permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write
env:
  EXECUTOR_SHA: ${{ inputs.executor_sha }}
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  REGION: us-central1
  ARTIFACT_REGISTRY_REPOSITORY: shared-datasets-jobs
  IMAGE_NAME: dataset-usage
  JOB_NAME: dataset-usage
  BUCKET: skytruth-shared-datasets-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TERRAFORM_VERSION: 1.8.5
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
  UV_VERSION: 0.11.8
  PYTHON_VERSION: '3.12'
jobs:
  bootstrap:
    name: Apply dataset usage deploy IAM bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: dataset-usage-deploy.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Dataset usage deploy IAM bootstrap
      refusal_prefix: Refusing dataset usage deploy IAM bootstrap
      block_deletes: true
      post_apply_wait_seconds: 30
      targets: |
        google_project_iam_custom_role.dataset_usage_deployer
        google_project_iam_member.github_actions_dataset_usage_deployer
      allowed_exact: |
        google_project_iam_custom_role.dataset_usage_deployer
        google_project_iam_member.github_actions_dataset_usage_deployer
      tf_vars: |
        wdpa_monthly_image=unused-by-dataset-usage-bootstrap
        sea_ice_daily_image=unused-by-dataset-usage-bootstrap
        eamlis_monthly_image=unused-by-dataset-usage-bootstrap
  deploy:
    name: Deploy tested dataset usage image and private telemetry resources
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    steps:
    - name: Validate main ref
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" != "refs/heads/main" ||
              ("${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/dataset-usage-deploy.yml@refs/heads/main" &&
               "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main") ]]; then
          echo "Execution must use this workflow or CI from main." >&2
          exit 1
        fi
    - name: Check out trusted verifier
      uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Install pinned durable receipt verifier
      run: python scripts/install_deployment_verifier.py
    - name: Verify executor before candidate checkout
      env:
        GH_TOKEN: ${{ github.token }}
        BOOTSTRAP_WORKFLOW_SHA: ${{ github.workflow_sha }}
        EXECUTOR_SHA: ${{ inputs.executor_sha }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      run: |
        python scripts/deployment_revision.py verify --bootstrap --workflow dataset-usage-deploy.yml \
          --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.executor_sha }}
        fetch-depth: 0
    - name: Verify tested main revision
      env:
        GH_TOKEN: ${{ github.token }}
        EXECUTOR_SHA: ${{ inputs.executor_sha }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      run: |
        python scripts/deployment_revision.py verify --workflow dataset-usage-deploy.yml \
          --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"
    - name: Validate Terraform auth configuration
      run: |
        set -euo pipefail

        if [[ -z "${TERRAFORM_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
          echo "Missing repository variable: GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER" >&2
          exit 1
        fi
        if [[ -z "${TERRAFORM_SERVICE_ACCOUNT}" ]]; then
          echo "Missing repository variable: GCP_TERRAFORM_SERVICE_ACCOUNT" >&2
          exit 1
        fi
    - name: Check prior deployment before rebuilding
      id: replay
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      run: |
        python scripts/deployment_revision.py check --target dataset-usage --workflow dataset-usage-deploy.yml \
          --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"
    - name: Authenticate to Google Cloud
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}
    - name: Set up gcloud
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: google-github-actions/setup-gcloud@v2
    - name: Set up Python
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Set up uv
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
    - name: Sync Python dependencies
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: uv sync --locked --all-groups
    - name: Verify live deployment permissions
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: python scripts/deployment_permissions.py --target dataset-usage
    - name: Verify Artifact Registry image permissions
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: python scripts/deployment_permissions.py --target artifact-registry-images
    - name: Configure Docker for Artifact Registry
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
    - name: Build dataset-usage image
      id: tested-image
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      run: |
        set -euo pipefail
        python scripts/tested_image_authorization.py --workflow dataset-usage-deploy.yml --target dataset-usage \
          --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
          --output "$RUNNER_TEMP/tested-dataset-usage"
    - name: Tag the exact tested dataset-usage image
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      env:
        TESTED_IMAGE_ID: ${{ steps.tested-image.outputs.image_id }}
      run: |
        set -euo pipefail
        image_tag="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${EXECUTOR_SHA}-${GITHUB_RUN_ID}"
        docker tag "$TESTED_IMAGE_ID" "$image_tag"
        echo "DATASET_USAGE_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
    - name: Verify run-bound signing capability without mutation
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: ./.github/actions/deployment-receipt
      with:
        mode: rehearsal
        signer-workflow: dataset-usage-deploy.yml
    - name: Push dataset-usage image
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      env:
        TESTED_IMAGE_CONFIG: ${{ steps.tested-image.outputs.config_digest }}
      run: |
        set -euo pipefail

        docker push "${DATASET_USAGE_IMAGE_TAG}"
        docker buildx imagetools inspect --raw "${DATASET_USAGE_IMAGE_TAG}" > "$RUNNER_TEMP/dataset-usage-manifest.json"
        python -c 'import json, os, sys; manifest=json.load(open(sys.argv[1])); expected=os.environ["TESTED_IMAGE_CONFIG"]; actual=manifest.get("config", {}).get("digest"); assert actual == expected, f"Registry image config {actual!r} differs from tested image {expected!r}"' "$RUNNER_TEMP/dataset-usage-manifest.json"
        image_digest="$(docker buildx imagetools inspect "${DATASET_USAGE_IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
        if [[ -z "${image_digest}" || "${image_digest}" == "<no value>" ]]; then
          image_digest="$(docker buildx imagetools inspect "${DATASET_USAGE_IMAGE_TAG}" | awk '/^Digest:/ {print $2; exit}')"
        fi
        if [[ -z "${image_digest}" || "${image_digest}" != sha256:* ]]; then
          echo "Could not resolve immutable image digest for ${DATASET_USAGE_IMAGE_TAG}" >&2
          exit 1
        fi
        image_ref="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}@${image_digest}"
        echo "DATASET_USAGE_IMAGE=${image_ref}" >> "${GITHUB_ENV}"
    - name: Set up Terraform
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    - name: Terraform init
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: terraform -chdir=terraform/envs/prod init -input=false
    - name: Terraform plan
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: |
        set -euo pipefail
        plan_args=(-input=false -out="$RUNNER_TEMP/dataset-usage.tfplan"
          -var="wdpa_monthly_image=unused-by-dataset-usage-deploy"
          -var="eamlis_monthly_image=unused-by-dataset-usage-deploy"
          -var="sea_ice_daily_image=unused-by-dataset-usage-deploy"
          -var="dataset_usage_image=$DATASET_USAGE_IMAGE")
        while IFS= read -r target; do plan_args+=("-target=$target"); done < <(uv run --no-sync python scripts/dataset_usage_deploy.py --targets)
        bash "$GITHUB_WORKSPACE/scripts/terraform_retry.sh" -chdir=terraform/envs/prod plan "${plan_args[@]}"
    - name: Export Terraform plan JSON
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: terraform -chdir=terraform/envs/prod show -json "${RUNNER_TEMP}/dataset-usage.tfplan" > "${RUNNER_TEMP}/dataset-usage.tfplan.json"
    - name: Enforce dataset-usage resource-change allowlist
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: |
        uv run --no-sync python scripts/dataset_usage_deploy.py --plan-json "$RUNNER_TEMP/dataset-usage.tfplan.json" --image "$DATASET_USAGE_IMAGE"
    - name: Verify complete saved-plan mutation permissions
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: python scripts/deployment_permissions.py --target dataset-usage --plan-json "$RUNNER_TEMP/dataset-usage.tfplan.json"
    - name: Claim tested deployment revision
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      id: revision
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      run: |
        python scripts/deployment_revision.py start --target dataset-usage --workflow dataset-usage-deploy.yml \
          --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
          --artifact "${DATASET_USAGE_IMAGE}" --plan-json "$RUNNER_TEMP/dataset-usage.tfplan.json"
    - name: Attest serialized deployment claim before mutation
      id: claim-receipt
      if: ${{ steps.revision.outputs.proceed == 'true' }}
      uses: ./.github/actions/deployment-receipt
      with:
        mode: receipt
        receipt-path: ${{ steps.revision.outputs.receipt_path }}
    - name: Terraform apply
      if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
      run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod apply -input=false "${RUNNER_TEMP}/dataset-usage.tfplan"
    - name: Confirm deployed digest
      if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
      run: |
        set -euo pipefail

        deployed_image="$(gcloud run jobs describe "${JOB_NAME}" --region="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
        echo "Deployed image: ${deployed_image}"
        if [[ "${deployed_image}" != "${DATASET_USAGE_IMAGE}" ]]; then
          echo "Cloud Run job image does not match expected digest." >&2
          exit 1
        fi
    - name: Execute bounded usage canary
      if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
      run: |
        set -euo pipefail
        gcloud run jobs execute "$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" --wait   --update-env-vars="SHARED_DATASETS_GITHUB_ACTIONS_RUN_URL=${GITHUB_SERVER_URL:?}/${GITHUB_REPOSITORY:?}/actions/runs/${GITHUB_RUN_ID:?}"
        gcloud scheduler jobs describe "$JOB_NAME" --location="$REGION" --project="$GOOGLE_CLOUD_PROJECT" --format='value(state,schedule,timeZone)'
        echo "DEPLOYMENT_PHASE=verified" >> "$GITHUB_ENV"
    - name: Record deployment outcome
      id: deployment-outcome
      if: ${{ always() && steps.revision.outputs.deployment_id != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOYMENT_ID: ${{ steps.revision.outputs.deployment_id }}
        JOB_STATUS: ${{ job.status }}
      run: |
        phase="${DEPLOYMENT_PHASE:-unknown}"
        if [[ "$JOB_STATUS" != "success" ]]; then phase=failed; fi
        python scripts/deployment_revision.py finish --deployment-id "$DEPLOYMENT_ID" --phase "$phase"
    - name: Attest terminal deployment outcome
      if: ${{ always() && steps.deployment-outcome.outputs.receipt_path != '' }}
      uses: ./.github/actions/deployment-receipt
      with:
        mode: receipt
        receipt-path: ${{ steps.deployment-outcome.outputs.receipt_path }}
    needs: bootstrap
'on':
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
  workflow_call:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
