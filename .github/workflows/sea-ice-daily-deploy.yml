name: Ingestion / Sea ice daily deploy
'on':
  workflow_dispatch:
    inputs:
      executor_sha: {"description": "Exact tested main revision", "required": true, "type": "string"}
      source_run_id: {"description": "Main-push CI run that tested executor_sha", "required": true, "type": "string"}
      source_run_attempt: {"description": "Exact successful ci-ready attempt", "required": true, "type": "string"}
      canary_run_date: {"description": "Optional NOAA filename search date (YYYY-MM-DD). The new-contract release date is its documented valid date, one day later.", "required": false, "type": "string", "default": ""}
      cancel_running_canary: {"description": "Cancel an execution that is already running instead of skipping the canary. Use when replacing known-bad code.", "required": false, "type": "boolean", "default": false}
      resume_scheduler: {"description": "Resume sea-ice-daily after deploy, canary, and validation pass.", "required": false, "type": "boolean", "default": true}
  workflow_call:
    inputs:
      executor_sha: {"description": "Exact tested main revision", "required": true, "type": "string"}
      source_run_id: {"description": "Main-push CI run that tested executor_sha", "required": true, "type": "string"}
      source_run_attempt: {"description": "Exact successful ci-ready attempt", "required": true, "type": "string"}
permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write
jobs:
  deploy:
    concurrency:
      group: ingestion-sea-ice-daily
      queue: max
      cancel-in-progress: false
    uses: ./.github/workflows/ingestion-deploy.yml
    with:
      target: sea-ice-daily
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      cancel_running_canary: ${{ inputs.cancel_running_canary || false }}
      canary_run_date: ${{ inputs.canary_run_date || '' }}
      resume_scheduler: ${{ github.event_name != 'workflow_dispatch' || inputs.resume_scheduler }}
