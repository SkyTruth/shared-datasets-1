name: Catalog viewer deploy

on:
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision for selective recovery
        required: true
        type: string
      source_run_id:
        description: Main CI run that validated the executor
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
  workflow_call:
    inputs:
      executor_sha:
        required: true
        type: string
      source_run_id:
        required: true
        type: number
      source_run_attempt:
        required: true
        type: number

permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write
  attestations: write

env:
  BOOTSTRAP_WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXECUTOR_SHA: ${{ inputs.executor_sha }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  REGION: us-central1
  ARTIFACT_REGISTRY_REPOSITORY: shared-datasets-jobs
  IMAGE_NAME: catalog-viewer
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.8.5"
  TF_REGISTRY_CLIENT_TIMEOUT: "60"
  TF_REGISTRY_DISCOVERY_RETRY: "5"
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

jobs:
  deploy:
    name: Build image and apply catalog-viewer Terraform
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false

    steps:
      - name: Validate main ref
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                ("${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/catalog-viewer-deploy.yml@refs/heads/main" &&
                 "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main") ]]; then
            echo "Execution must use this workflow or CI from main." >&2
            exit 1
          fi

      - name: Check out trusted deployment verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false


      - name: Install pinned durable receipt verifier
        run: python scripts/install_deployment_verifier.py
      - name: Verify trusted tested source authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/deployment_revision.py verify --bootstrap --workflow catalog-viewer-deploy.yml \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact passing CI revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/deployment_revision.py verify --workflow catalog-viewer-deploy.yml \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Check already completed deployment
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/deployment_revision.py check --workflow catalog-viewer-deploy.yml --target catalog-viewer \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Validate Terraform auth configuration
        if: steps.replay.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          if [[ -z "${TERRAFORM_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            echo "Missing repository variable: GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER" >&2
            exit 1
          fi
          if [[ -z "${TERRAFORM_SERVICE_ACCOUNT}" ]]; then
            echo "Missing repository variable: GCP_TERRAFORM_SERVICE_ACCOUNT" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: steps.replay.outputs.proceed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.replay.outputs.proceed == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Artifact Registry image permissions
        if: steps.replay.outputs.proceed == 'true'
        run: python scripts/deployment_permissions.py --target artifact-registry-images

      - name: Configure Docker for Artifact Registry
        if: steps.replay.outputs.proceed == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build catalog-viewer image
        id: tested-image
        if: steps.replay.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          python scripts/tested_image_authorization.py --workflow catalog-viewer-deploy.yml --target catalog-viewer \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/tested-catalog-viewer"

      - name: Tag the exact tested catalog-viewer image
        if: steps.replay.outputs.proceed == 'true'
        env:
          TESTED_IMAGE_ID: ${{ steps.tested-image.outputs.image_id }}
        run: |
          set -euo pipefail
          image_tag="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${EXECUTOR_SHA}"
          docker tag "$TESTED_IMAGE_ID" "$image_tag"
          echo "CATALOG_VIEWER_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          echo "CATALOG_VIEWER_LOCAL_DIGEST=${TESTED_IMAGE_ID}" >> "${GITHUB_ENV}"

      - name: Verify run-bound signing capability without mutation
        if: steps.replay.outputs.proceed == 'true'
        uses: ./.github/actions/deployment-receipt
        with:
          mode: rehearsal
          signer-workflow: catalog-viewer-deploy.yml

      - name: Record serialized viewer deployment attempt
        if: steps.replay.outputs.proceed == 'true'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/deployment_revision.py start --workflow catalog-viewer-deploy.yml \
            --target catalog-viewer --artifact "catalog-viewer-image@${CATALOG_VIEWER_LOCAL_DIGEST}" \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Attest serialized deployment claim before mutation
        id: claim-receipt
        if: ${{ steps.deployment.outputs.proceed == 'true' }}
        uses: ./.github/actions/deployment-receipt
        with:
          mode: receipt
          receipt-path: ${{ steps.deployment.outputs.receipt_path }}

      - name: Push tested catalog-viewer image
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        env:
          TESTED_IMAGE_ID: ${{ steps.tested-image.outputs.image_id }}
        run: |
          set -euo pipefail
          image_tag="${CATALOG_VIEWER_IMAGE_TAG}"
          docker push "${image_tag}"
          docker buildx imagetools inspect --raw "${image_tag}" > "$RUNNER_TEMP/catalog-viewer-manifest.json"
          python -c 'import json, os, sys; manifest=json.load(open(sys.argv[1])); expected=os.environ["TESTED_IMAGE_ID"]; actual=manifest.get("config", {}).get("digest"); assert actual == expected, f"Registry image config {actual!r} differs from tested image {expected!r}"' "$RUNNER_TEMP/catalog-viewer-manifest.json"
          image_digest="$(docker buildx imagetools inspect "${image_tag}" --format '{{.Manifest.Digest}}')"
          if [[ -z "${image_digest}" || "${image_digest}" == "<no value>" ]]; then
            image_digest="$(docker buildx imagetools inspect "${image_tag}" | awk '/^Digest:/ {print $2; exit}')"
          fi
          if [[ -z "${image_digest}" || "${image_digest}" != sha256:* ]]; then
            echo "Could not resolve immutable image digest for ${image_tag}" >&2
            exit 1
          fi
          image_ref="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}@${image_digest}"
          echo "CATALOG_VIEWER_IMAGE=${image_ref}" >> "${GITHUB_ENV}"

      - name: Set up Terraform
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: terraform -chdir=terraform/envs/prod init -input=false

      - name: Verify existing project IAM bootstrap authority
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: python scripts/deployment_permissions.py --target iam-bootstrap

      - name: Terraform plan Secret Manager IAM bootstrap
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod plan \
            -input=false \
            -refresh=false \
            -out="${RUNNER_TEMP}/catalog-viewer-secret-manager-iam-bootstrap.tfplan" \
            -target=google_project_iam_member.github_actions_pmtiles_cdn_secret_iam_policy_manager \
            -var="wdpa_monthly_image=unused-by-catalog-viewer-deploy" \
            -var="sea_ice_daily_image=unused-by-catalog-viewer-deploy" \
            -var="eamlis_monthly_image=unused-by-catalog-viewer-deploy"

      - name: Export Secret Manager IAM bootstrap plan JSON
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: terraform -chdir=terraform/envs/prod show -json "${RUNNER_TEMP}/catalog-viewer-secret-manager-iam-bootstrap.tfplan" > "${RUNNER_TEMP}/catalog-viewer-secret-manager-iam-bootstrap.tfplan.json"

      - name: Enforce Secret Manager IAM bootstrap allowlist
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: |
          python - "${RUNNER_TEMP}/catalog-viewer-secret-manager-iam-bootstrap.tfplan.json" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1]))
          allowed_exact = {
              "google_project_iam_member.github_actions_pmtiles_cdn_secret_iam_policy_manager",
          }

          blocked = []
          for resource in plan.get("resource_changes", []):
              actions = resource.get("change", {}).get("actions", [])
              if actions in ([], ["no-op"], ["read"]):
                  continue
              address = resource.get("address", "")
              if address in allowed_exact:
                  continue
              blocked.append(f"{'/'.join(actions)} {address}")

          if blocked:
              print("Refusing catalog-viewer Secret Manager IAM bootstrap because the Terraform plan changes non-allowlisted resources:")
              for item in blocked:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

      - name: Verify permissions required by the saved viewer bootstrap plan
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: python scripts/deployment_permissions.py --target iam-bootstrap --plan-json "${RUNNER_TEMP}/catalog-viewer-secret-manager-iam-bootstrap.tfplan.json"

      - name: Terraform apply Secret Manager IAM bootstrap
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod apply -input=false "${RUNNER_TEMP}/catalog-viewer-secret-manager-iam-bootstrap.tfplan"

      - name: Wait for Secret Manager IAM propagation
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: sleep 30

      - name: Verify catalog-viewer live dependencies
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: python scripts/deployment_permissions.py --target catalog-viewer

      - name: Terraform plan
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod plan \
            -input=false \
            -refresh=false \
            -out="${RUNNER_TEMP}/catalog-viewer.tfplan" \
            -target=module.catalog_viewer_service_account.google_service_account.this \
            -target=google_storage_bucket_iam_member.catalog_viewer_object_viewer \
            -target=google_storage_bucket.catalog_comparisons \
            -target=google_storage_bucket_iam_member.catalog_comparisons_worker \
            -target=google_project_iam_custom_role.catalog_viewer_sign_blob \
            -target=google_service_account_iam_member.catalog_viewer_self_sign_blob \
            -target=google_secret_manager_secret_iam_member.pmtiles_cdn_catalog_viewer_signer \
            -target=google_cloud_run_v2_service.catalog_viewer \
            -target=google_cloud_run_v2_service_iam_member.catalog_viewer_iap_invoker \
            -target=google_iap_web_cloud_run_service_iam_member.catalog_viewer_accessors \
            -var="catalog_viewer_image=${CATALOG_VIEWER_IMAGE}" \
            -var="wdpa_monthly_image=unused-by-catalog-viewer-deploy" \
            -var="sea_ice_daily_image=unused-by-catalog-viewer-deploy" \
            -var="eamlis_monthly_image=unused-by-catalog-viewer-deploy"

      - name: Export Terraform plan JSON
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: terraform -chdir=terraform/envs/prod show -json "${RUNNER_TEMP}/catalog-viewer.tfplan" > "${RUNNER_TEMP}/catalog-viewer.tfplan.json"

      - name: Enforce catalog-viewer resource-change allowlist
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: |
          python - "${RUNNER_TEMP}/catalog-viewer.tfplan.json" <<'PY'
          import json
          import re
          import sys

          plan = json.load(open(sys.argv[1]))
          allowed_exact = {
              "google_cloud_run_v2_service.catalog_viewer",
              "google_cloud_run_v2_service_iam_member.catalog_viewer_iap_invoker",
              "google_project_iam_custom_role.catalog_viewer_sign_blob",
              "google_secret_manager_secret_iam_member.pmtiles_cdn_catalog_viewer_signer",
              "google_service_account_iam_member.catalog_viewer_self_sign_blob",
              "google_storage_bucket_iam_member.catalog_viewer_object_viewer",
              "google_storage_bucket.catalog_comparisons",
              "google_storage_bucket_iam_member.catalog_comparisons_worker",
          }
          allowed_patterns = [
              re.compile(r"^module\.catalog_viewer_service_account\."),
              re.compile(r"^google_iap_web_cloud_run_service_iam_member\.catalog_viewer_accessors\["),
          ]

          blocked = []
          for resource in plan.get("resource_changes", []):
              actions = resource.get("change", {}).get("actions", [])
              if actions in ([], ["no-op"], ["read"]):
                  continue
              address = resource.get("address", "")
              if address in allowed_exact or any(pattern.match(address) for pattern in allowed_patterns):
                  continue
              blocked.append(f"{'/'.join(actions)} {address}")

          if blocked:
              print("Refusing catalog-viewer deploy because the Terraform plan changes non-allowlisted resources:")
              for item in blocked:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

      - name: Verify permissions required by the saved viewer plan
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: python scripts/deployment_permissions.py --target catalog-viewer --plan-json "${RUNNER_TEMP}/catalog-viewer.tfplan.json"

      - name: Terraform apply
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod apply -input=false "${RUNNER_TEMP}/catalog-viewer.tfplan"

      - name: Verify ready revision uses tested image
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: |
          gcloud run services describe catalog-viewer --project "$GOOGLE_CLOUD_PROJECT" --region "$REGION" --format=json > "${RUNNER_TEMP}/catalog-viewer-service.json"
          python - "${RUNNER_TEMP}/catalog-viewer-service.json" <<'PYVERIFY'
          import json, os, sys
          service = json.load(open(sys.argv[1]))
          status = service['status']
          if status.get('latestReadyRevisionName') != status.get('latestCreatedRevisionName') or not status.get('latestReadyRevisionName'):
              raise SystemExit('Newest catalog-viewer revision is not ready')
          if not any(c.get('type') == 'Ready' and c.get('status') == 'True' for c in status.get('conditions', [])):
              raise SystemExit('Catalog-viewer service did not reach Ready')
          if service['spec']['template']['spec']['containers'][0]['image'] != os.environ['CATALOG_VIEWER_IMAGE']:
              raise SystemExit('Ready catalog-viewer service differs from the tested image digest')
          PYVERIFY

      - name: Record terminal deployment outcome
        id: deployment-outcome
        if: ${{ always() && steps.deployment.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          phase=failed
          if [[ "$JOB_STATUS" == success ]]; then phase=verified; fi
          python scripts/deployment_revision.py finish --deployment-id "$DEPLOYMENT_ID" --phase "$phase"

      - name: Attest terminal deployment outcome
        if: ${{ always() && steps.deployment-outcome.outputs.receipt_path != '' }}
        uses: ./.github/actions/deployment-receipt
        with:
          mode: receipt
          receipt-path: ${{ steps.deployment-outcome.outputs.receipt_path }}
