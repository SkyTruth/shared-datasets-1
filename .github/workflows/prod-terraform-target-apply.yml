name: Infrastructure / Production Terraform target apply
on:
  workflow_call:
    inputs:
      caller_workflow: {"description": "Registered trusted caller workflow filename", "required": true, "type": "string"}
      executor_sha: {"description": "Exact tested main revision", "required": true, "type": "string"}
      source_run_id: {"description": "Main-push CI run that tested executor_sha", "required": true, "type": "string"}
      source_run_attempt: {"description": "Exact successful ci-ready attempt", "required": true, "type": "string"}
      sync_name: {"description": "Registered Terraform synchronization name", "required": true, "type": "string"}
      tf_vars: {"description": "Current state-recorded variables for state-only reconciliation", "type": "string", "default": ""}
env:
  EXECUTOR_SHA: ${{ inputs.executor_sha }}
  CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TERRAFORM_VERSION: 1.8.5
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
  TERRAFORM_DIR: terraform/envs/prod
  SYNC_NAME: ${{ inputs.sync_name }}
  BLOCK_DELETES: 'false'
  DELETE_ONLY: 'false'
  POST_APPLY_WAIT_SECONDS: '0'
  PREPARE_MONITORING_SLACK: 'false'
permissions:
  contents: read
  actions: read
  pull-requests: read
  deployments: write
  id-token: write
  attestations: write
jobs:
  prepare:
    name: Prepare ${{ inputs.sync_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: shared-datasets-production
    outputs:
      proceed: ${{ steps.replay.outputs.proceed }}
      monitoring_vars: ${{ steps.monitoring-vars.outputs.variables }}
    steps:
    - name: Validate main ref
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then exit 1; fi
    - name: Check out trusted verifier
      uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Authorize and prepare registered Terraform deployment
      id: replay
      uses: ./.github/actions/deployment-bootstrap/terraform
      with:
        workflow: ${{ inputs.caller_workflow }}
        executor-sha: ${{ inputs.executor_sha }}
        source-run-id: ${{ inputs.source_run_id }}
        source-run-attempt: ${{ inputs.source_run_attempt }}
        tf-vars: ${{ inputs.tf_vars }}
        sync-name: ${{ inputs.sync_name }}
        workload-identity-provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
        service-account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}
    - name: Verify run-bound signing capability without mutation
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: ./.github/actions/deployment-receipt
      with:
        mode: rehearsal
        signer-workflow: prod-terraform-target-apply.yml
    - name: Set up uv for Monitoring image proof
      if: ${{ steps.replay.outputs.proceed == 'true' && env.PREPARE_MONITORING_SLACK == 'true' }}
      uses: astral-sh/setup-uv@v5
      with:
        version: 0.11.8
    - name: Load exact tested Monitoring receiver
      id: monitoring-image
      if: ${{ steps.replay.outputs.proceed == 'true' && env.PREPARE_MONITORING_SLACK == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      run: |
        set -euo pipefail
        [[ "$CALLER_WORKFLOW" == cron-alert-policy-sync.yml ]]
        uv sync --locked --no-dev
        uv run --no-sync python scripts/tested_image_authorization.py --workflow "$CALLER_WORKFLOW" --target monitoring-slack \
          --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
          --output "$RUNNER_TEMP/tested-monitoring-slack"
    - name: Prepare tested Monitoring image and bot credential
      if: ${{ steps.replay.outputs.proceed == 'true' && env.PREPARE_MONITORING_SLACK == 'true' }}
      env:
        TESTED_IMAGE_ID: ${{ steps.monitoring-image.outputs.image_id }}
        TESTED_IMAGE_CONFIG: ${{ steps.monitoring-image.outputs.config_digest }}
        SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
        SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
      run: |
        python scripts/deployment_permissions.py --target artifact-registry-images
        python scripts/deployment_permissions.py --target monitoring-slack-secret
        uv run --no-sync python scripts/monitoring_slack_prepare.py
    - name: Export prepared Monitoring variables
      id: monitoring-vars
      if: steps.replay.outputs.proceed == 'true' && env.PREPARE_MONITORING_SLACK == 'true'
      run: |-
        python - <<'PYTHON'
        import json, os
        from pathlib import Path
        values = {key: os.environ['TF_VAR_' + key] for key in ('monitoring_slack_image', 'monitoring_slack_channel_id', 'monitoring_slack_token_version')}
        with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
            stream.write('variables=' + json.dumps(values) + '\n')
        PYTHON
  sync:
    name: Apply ${{ inputs.sync_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    outputs:
      wait_seconds: ${{ steps.revision.outputs.propagation_seconds || '0' }}
      applied: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
    steps:
    - name: Validate main ref
      run: |
        if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then exit 1; fi
    - name: Check out trusted verifier
      uses: actions/checkout@v4
      with:
        ref: ${{ github.workflow_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Authorize and prepare registered Terraform deployment
      id: replay
      uses: ./.github/actions/deployment-bootstrap/terraform
      with:
        workflow: ${{ inputs.caller_workflow }}
        executor-sha: ${{ inputs.executor_sha }}
        source-run-id: ${{ inputs.source_run_id }}
        source-run-attempt: ${{ inputs.source_run_attempt }}
        tf-vars: ${{ inputs.tf_vars }}
        sync-name: ${{ inputs.sync_name }}
        workload-identity-provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
        service-account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}
    - name: Verify run-bound signing capability without mutation
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: ./.github/actions/deployment-receipt
      with:
        mode: rehearsal
        signer-workflow: prod-terraform-target-apply.yml
    - name: Load prepared Monitoring variables
      if: env.PREPARE_MONITORING_SLACK == 'true'
      env:
        MONITORING_VARS: ${{ needs.prepare.outputs.monitoring_vars }}
      run: |-
        python - <<'PYTHON'
        import json, os
        from pathlib import Path
        values = json.loads(os.environ['MONITORING_VARS'])
        if set(values) != {'monitoring_slack_image', 'monitoring_slack_channel_id', 'monitoring_slack_token_version'}:
            raise ValueError('Incomplete prepared Monitoring identities')
        if any(not isinstance(value, str) or not value or any(c in value for c in '\r\n') for value in values.values()):
            raise ValueError('Invalid prepared Monitoring identity')
        with Path(os.environ['GITHUB_ENV']).open('a') as stream:
            stream.writelines(f'TF_VAR_{key}={value}\n' for key, value in values.items())
        PYTHON
    - name: Set up Terraform
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
    - name: Terraform init
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: terraform -chdir="${TERRAFORM_DIR}" init -input=false
    - name: Terraform plan
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: |
        set -euo pipefail

        plan_args=(-input=false -refresh=true -out="${RUNNER_TEMP}/target-apply.tfplan")
        while IFS= read -r target; do
          [[ -z "${target}" ]] && continue
          plan_args+=("-target=${target}")
        done <<< "${TARGETS}"
        while IFS= read -r tf_var; do
          [[ -z "${tf_var}" ]] && continue
          plan_args+=("-var=${tf_var}")
        done <<< "${TF_VARS}"
        bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir="${TERRAFORM_DIR}" plan "${plan_args[@]}"
    - name: Export Terraform plan JSON
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: terraform -chdir="${TERRAFORM_DIR}" show -json "${RUNNER_TEMP}/target-apply.tfplan" > "${RUNNER_TEMP}/target-apply.tfplan.json"
    - name: Enforce resource-change allowlist
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: |
        set -euo pipefail

        enforce_args=(
          "${RUNNER_TEMP}/target-apply.tfplan.json"
          --allowed-exact "${ALLOWED_EXACT}"
          --refusal-prefix "${REFUSAL_PREFIX}"
        )
        if [[ "${BLOCK_DELETES}" == "true" ]]; then
          enforce_args+=(--block-deletes)
        fi
        if [[ "${DELETE_ONLY}" == "true" ]]; then
          enforce_args+=(--delete-only)
        fi
        python scripts/terraform_plan_allowlist.py "${enforce_args[@]}"
    - name: Verify complete saved-plan mutation permissions
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      run: python scripts/deployment_permissions.py --target "$READINESS_TARGET" --plan-json "$RUNNER_TEMP/target-apply.tfplan.json"
    - name: Claim tested deployment revision
      id: revision
      if: ${{ steps.replay.outputs.proceed == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      run: |
        target="terraform-$(printf '%s' "$SYNC_NAME" | sha256sum | cut -c1-16)"
        artifact="terraform@sha256:$(sha256sum "$RUNNER_TEMP/target-apply.tfplan.json" | cut -d' ' -f1)"
        python scripts/deployment_revision.py start --target "$target" --workflow "$CALLER_WORKFLOW" \
          --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
          --artifact "$artifact" --plan-json "$RUNNER_TEMP/target-apply.tfplan.json" --plan-scope "$TARGETS" \
          --propagation-window "$POST_APPLY_WAIT_SECONDS"
    - name: Attest serialized deployment claim before mutation
      id: claim-receipt
      if: ${{ steps.revision.outputs.proceed == 'true' }}
      uses: ./.github/actions/deployment-receipt
      with:
        mode: receipt
        receipt-path: ${{ steps.revision.outputs.receipt_path }}
    - name: Terraform apply
      if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
      run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir="${TERRAFORM_DIR}" apply -input=false "${RUNNER_TEMP}/target-apply.tfplan"
    - name: Record deployment outcome
      id: deployment-outcome
      if: ${{ always() && steps.revision.outputs.deployment_id != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOYMENT_ID: ${{ steps.revision.outputs.deployment_id }}
        JOB_STATUS: ${{ job.status }}
      run: |
        phase=applied
        if [[ "$JOB_STATUS" != "success" ]]; then phase=failed; fi
        python scripts/deployment_revision.py finish --deployment-id "$DEPLOYMENT_ID" --phase "$phase"
    - name: Attest terminal deployment outcome
      if: ${{ always() && steps.deployment-outcome.outputs.receipt_path != '' }}
      uses: ./.github/actions/deployment-receipt
      with:
        mode: receipt
        receipt-path: ${{ steps.deployment-outcome.outputs.receipt_path }}
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
  propagation:
    name: Wait for IAM propagation
    needs: sync
    if: ${{ needs.sync.outputs.applied == 'true' && fromJSON(needs.sync.outputs.wait_seconds) > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Wait after apply
      env:
        WAIT_SECONDS: ${{ needs.sync.outputs.wait_seconds }}
      run: sleep "$WAIT_SECONDS"
