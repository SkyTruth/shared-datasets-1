name: Prod Terraform target apply

# Reusable constrained apply for prod Terraform IAM syncs. Callers pass an
# explicit -target list plus a resource-change allowlist; the plan is refused
# if it touches anything else. This file owns the protected-apply mechanics
# (main-ref validation, trusted checkout, prod state concurrency, allowlist
# enforcement) so caller workflows stay declarative.

on:
  workflow_call:
    inputs:
      caller_workflow:
        description: Registered trusted caller workflow filename
        required: true
        type: string
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
      readiness_target:
        description: Read-only prerequisite probes before planning dependent mutations
        required: true
        type: string
      sync_name:
        description: "Human-readable name used in log and refusal messages."
        required: true
        type: string
      terraform_dir:
        description: "Terraform working directory; must stay under terraform/envs/prod."
        required: false
        type: string
        default: terraform/envs/prod
      targets:
        description: "Newline-separated Terraform -target resource addresses."
        required: true
        type: string
      allowed_exact:
        description: "Newline-separated resource addresses allowed to change."
        required: true
        type: string
      allowed_patterns:
        description: "Newline-separated regexes of additional allowed addresses."
        required: false
        type: string
        default: ""
      block_deletes:
        description: "Refuse deletes, including replaces, even for allowlisted addresses."
        required: false
        type: boolean
        default: false
      tf_vars:
        description: "Newline-separated key=value Terraform variable assignments."
        required: false
        type: string
        default: ""
      refusal_prefix:
        description: "Refusal message prefix, e.g. 'Refusing automatic X IAM sync'."
        required: true
        type: string
      post_apply_wait_seconds:
        description: "Seconds to sleep after apply, e.g. for IAM propagation."
        required: false
        type: number
        default: 0

env:
  EXECUTOR_SHA: ${{ inputs.executor_sha }}
  CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.8.5"
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
  TERRAFORM_DIR: ${{ inputs.terraform_dir }}

jobs:
  sync:
    name: Apply ${{ inputs.sync_name }}
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    # All jobs that write prod state share this queue, including deploys.
    # Hold it from plan through allowlist validation and saved-plan apply.
    # queue: max retains pending jobs instead of replacing an earlier sync.
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false

    steps:
      - name: Validate main ref
        env:
          SYNC_NAME: ${{ inputs.sync_name }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "${SYNC_NAME} may only apply from main after reviewed changes have landed." >&2
            exit 1
          fi

      - name: Validate Terraform directory
        run: |
          set -euo pipefail

          if [[ "${TERRAFORM_DIR}" == *..* ]] || [[ ! "${TERRAFORM_DIR}" =~ ^terraform/envs/prod(/[A-Za-z0-9_.-]+)*$ ]]; then
            echo "terraform_dir must stay under terraform/envs/prod: ${TERRAFORM_DIR}" >&2
            exit 1
          fi

      - name: Validate executor input contract
        env:
          INPUT_EXECUTOR: ${{ inputs.executor_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/"*"@refs/heads/main" ]]; then exit 1; fi
          if [[ ! "$INPUT_EXECUTOR" =~ ^[0-9a-f]{40}$ || ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then exit 1; fi

      - name: Check out trusted verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify executor before candidate checkout
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          python scripts/deployment_revision.py verify --bootstrap --workflow "$CALLER_WORKFLOW" \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 0

      - name: Verify tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          python scripts/deployment_revision.py verify --workflow "$CALLER_WORKFLOW" \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Validate Terraform auth configuration
        run: |
          set -euo pipefail

          if [[ -z "${TERRAFORM_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            echo "Missing repository variable: GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER" >&2
            exit 1
          fi
          if [[ -z "${TERRAFORM_SERVICE_ACCOUNT}" ]]; then
            echo "Missing repository variable: GCP_TERRAFORM_SERVICE_ACCOUNT" >&2
            exit 1
          fi

      - name: Check prior deployment before replanning
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SYNC_NAME: ${{ inputs.sync_name }}
        run: |
          target="terraform-$(printf '%s' "$SYNC_NAME" | sha256sum | cut -c1-16)"
          python scripts/deployment_revision.py check --target "$target" --workflow "$CALLER_WORKFLOW" \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Authenticate to Google Cloud
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify prerequisite deployment permissions
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          READINESS_TARGET: ${{ inputs.readiness_target }}
        run: python scripts/deployment_permissions.py --target "$READINESS_TARGET"

      - name: Set up Terraform
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: terraform -chdir="${TERRAFORM_DIR}" init -input=false

      - name: Terraform plan
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          TARGETS: ${{ inputs.targets }}
          TF_VARS: ${{ inputs.tf_vars }}
        run: |
          set -euo pipefail

          plan_args=(-input=false -refresh=true -out="${RUNNER_TEMP}/target-apply.tfplan")
          while IFS= read -r target; do
            [[ -z "${target}" ]] && continue
            plan_args+=("-target=${target}")
          done <<< "${TARGETS}"
          while IFS= read -r tf_var; do
            [[ -z "${tf_var}" ]] && continue
            plan_args+=("-var=${tf_var}")
          done <<< "${TF_VARS}"
          bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir="${TERRAFORM_DIR}" plan "${plan_args[@]}"

      - name: Export Terraform plan JSON
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: terraform -chdir="${TERRAFORM_DIR}" show -json "${RUNNER_TEMP}/target-apply.tfplan" > "${RUNNER_TEMP}/target-apply.tfplan.json"

      - name: Enforce resource-change allowlist
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          ALLOWED_EXACT: ${{ inputs.allowed_exact }}
          ALLOWED_PATTERNS: ${{ inputs.allowed_patterns }}
          BLOCK_DELETES: ${{ inputs.block_deletes }}
          REFUSAL_PREFIX: ${{ inputs.refusal_prefix }}
        run: |
          set -euo pipefail

          enforce_args=(
            "${RUNNER_TEMP}/target-apply.tfplan.json"
            --allowed-exact "${ALLOWED_EXACT}"
            --allowed-patterns "${ALLOWED_PATTERNS}"
            --refusal-prefix "${REFUSAL_PREFIX}"
          )
          if [[ "${BLOCK_DELETES}" == "true" ]]; then
            enforce_args+=(--block-deletes)
          fi
          python scripts/terraform_plan_allowlist.py "${enforce_args[@]}"

      - name: Claim tested deployment revision
        id: revision
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SYNC_NAME: ${{ inputs.sync_name }}
          TARGETS: ${{ inputs.targets }}
        run: |
          target="terraform-$(printf '%s' "$SYNC_NAME" | sha256sum | cut -c1-16)"
          artifact="terraform@sha256:$(sha256sum "$RUNNER_TEMP/target-apply.tfplan.json" | cut -d' ' -f1)"
          python scripts/deployment_revision.py start --target "$target" --workflow "$CALLER_WORKFLOW" \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --artifact "$artifact" --plan-json "$RUNNER_TEMP/target-apply.tfplan.json" --plan-scope "$TARGETS"

      - name: Terraform apply
        if: ${{ steps.revision.outputs.proceed == 'true' }}
        run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir="${TERRAFORM_DIR}" apply -input=false "${RUNNER_TEMP}/target-apply.tfplan"

      - name: Wait after apply
        if: ${{ steps.revision.outputs.proceed == 'true' && inputs.post_apply_wait_seconds > 0 }}
        env:
          WAIT_SECONDS: ${{ inputs.post_apply_wait_seconds }}
        run: sleep "${WAIT_SECONDS}"

      - name: Record deployment outcome
        if: ${{ always() && steps.revision.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.revision.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          phase=applied
          if [[ "$JOB_STATUS" != "success" ]]; then phase=failed; fi
          python scripts/deployment_revision.py finish --deployment-id "$DEPLOYMENT_ID" --phase "$phase"
