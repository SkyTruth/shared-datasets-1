name: Publish TypeScript SDK

on:
  push:
    branches:
      - main
    paths:
      - "api/typescript/src/**"
      - "api/typescript/README.md"
      - "api/typescript/package.json"
      - "api/typescript/package-lock.json"
      - "api/typescript/tsconfig.json"
      - ".github/workflows/publish-typescript-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "24"

jobs:
  publish:
    if: github.repository == 'SkyTruth/shared-datasets-1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-typescript-sdk
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api/typescript
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: api/typescript/package-lock.json

      - name: Require reviewed version increase
        id: changes
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/release-policy.mjs changes "$BASE_SHA" "$HEAD_SHA"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release_needed == 'true'
        run: npm ci

      - name: Test package
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release_needed == 'true'
        run: npm test

      - name: Validate packed consumer
        id: package
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release_needed == 'true'
        run: npm run test:pack

      - name: Check registry version and integrity
        id: registry
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.release_needed == 'true'
        env:
          CANDIDATE: ${{ steps.package.outputs.candidate }}
        run: node scripts/release-policy.mjs registry "$CANDIDATE"

      - name: Publish validated package
        if: steps.registry.outputs.should_publish == 'true'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --ignore-scripts --registry=https://registry.npmjs.org
