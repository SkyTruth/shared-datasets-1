name: Operations / Safety check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Check for operational work
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: shared-datasets-production
      deployment: false
    permissions:
      contents: read
      actions: write
      deployments: read
      id-token: write
    concurrency:
      group: operational-safety-check
      queue: max
      cancel-in-progress: false
    env:
      GOOGLE_CLOUD_PROJECT: shared-datasets-1
      SHARED_DATASETS_BUCKET: skytruth-shared-datasets-1
      SHARED_DATASETS_ALLOW_CANONICAL_MUTATION: "0"
    steps:
      - name: Require trusted main workflow
        id: trust
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/operational-safety-check.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: false
      - name: Install locked probe dependencies
        run: uv sync --locked --no-dev
      - name: Install pinned durable receipt verifier
        run: python scripts/install_deployment_verifier.py
      - name: Authenticate read-only catalog probe
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: shared-datasets-publisher@shared-datasets-1.iam.gserviceaccount.com
      - name: Check operational work
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
          SHARED_DATASETS_SLACK_INCIDENTS_SINCE: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_SINCE }}
          SHARED_DATASETS_SLACK_INCIDENTS_ENABLED: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_ENABLED }}
        run: uv run --no-sync python scripts/operational_safety_check.py --work-dir "$RUNNER_TEMP/operational-safety"
      - name: Request catalog refresh
        if: ${{ steps.probe.outputs.catalog == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-web-deploy.yml --ref main -f safety_run_id="$GITHUB_RUN_ID" -f safety_run_attempt="$GITHUB_RUN_ATTEMPT"
      - name: Retain operational safety snapshot
        if: ${{ success() && steps.probe.outputs.snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: safety-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operational-safety/cache.json
          if-no-files-found: error
          retention-days: 1
      - name: Request execution verification
        if: ${{ steps.probe.outputs.verify == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deployment-verification.yml --ref main
      - name: Request operational reconciliation
        if: ${{ steps.probe.outputs.reconcile == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run unattended-workflow-alert.yml --ref main
          -f incident_id=operational-batch -f delivery_result=batch
          -f operation="safety:${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
