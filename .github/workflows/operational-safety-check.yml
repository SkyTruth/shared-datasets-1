name: Operations / Safety check
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    name: Check for operational work
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: shared-datasets-production
    permissions:
      contents: read
      actions: write
      deployments: read
      attestations: read
      id-token: write
    concurrency:
      group: operational-safety-check
      queue: max
      cancel-in-progress: false
    env:
      GOOGLE_CLOUD_PROJECT: shared-datasets-1
      SHARED_DATASETS_BUCKET: skytruth-shared-datasets-1
      SHARED_DATASETS_ALLOW_CANONICAL_MUTATION: "0"
    steps:
      - name: Require trusted main workflow
        id: trust
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/operational-safety-check.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: false
      - name: Install locked probe dependencies
        id: dependencies
        run: uv sync --locked --no-dev
      # The gh release download returned a 504 on 2026-11-09. The installer
      # re-checks this archive's SHA-256, so a cached copy needs no trust.
      # Python and uv stay uncached: setup actions do not verify cache hits.
      - name: Restore pinned verifier archive
        uses: actions/cache@v4
        with:
          key: safety-gh-verifier-2.96.0-linux-amd64
          path: ${{ runner.temp }}/deployment-receipts/tools/gh_2.96.0_linux_amd64.tar.gz
      - name: Install pinned durable receipt verifier
        id: verifier
        run: python scripts/install_deployment_verifier.py
      - name: Authenticate heartbeat writer and catalog reader
        id: authentication
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: shared-datasets-heartbeat@shared-datasets-1.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check operational work
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_INCIDENTS_ENABLED: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_ENABLED }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
          SHARED_DATASETS_SLACK_INCIDENTS_SINCE: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_SINCE }}
        run: uv run --no-sync python scripts/operational_safety_check.py --work-dir "$RUNNER_TEMP/operational-safety"
      - name: Request catalog refresh
        if: ${{ steps.probe.outputs.catalog == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-web-deploy.yml --ref main -f safety_run_id="$GITHUB_RUN_ID" -f safety_run_attempt="$GITHUB_RUN_ATTEMPT"
      - name: Request execution verification
        if: ${{ steps.probe.outputs.verify == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deployment-verification.yml --ref main
      - name: Request operational reconciliation
        if: ${{ always() && steps.probe.outputs.reconcile == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run unattended-workflow-alert.yml --ref main
          -f incident_id=operational-batch -f delivery_result=batch
          -f operation="safety:${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
      - name: Check freshness and stalled operations
        id: health
        if: ${{ always() && !cancelled() && steps.trust.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SAFETY_PROBE_OUTCOME: ${{ steps.probe.outcome }}
          SAFETY_SETUP_OUTCOMES: ${{ format('dependencies={0}, verifier={1}, authentication={2}', steps.dependencies.outcome, steps.verifier.outcome, steps.authentication.outcome) }}
          SHARED_DATASETS_SLACK_INCIDENTS_ENABLED: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_ENABLED }}
          SHARED_DATASETS_SLACK_INCIDENTS_SINCE: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_SINCE }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_WEBHOOK_URL: ${{ secrets.SHARED_DATASETS_SLACK_WEBHOOK_URL }}
        run: |
          interpreter=python
          if [[ -x .venv/bin/python ]]; then interpreter=.venv/bin/python; fi
          "$interpreter" scripts/operational_safety_check.py --health --work-dir "$RUNNER_TEMP/operational-safety"
      - name: Retain safety health report
        id: health-report
        if: ${{ always() && steps.health.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: safety-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/operational-safety/health/cache.json
          if-no-files-found: error
          retention-days: 3
      - name: Report safety failure directly
        if: ${{ (failure() || cancelled()) && steps.trust.outcome == 'success' && (steps.probe.outcome == 'success' || steps.health.outcome != 'success' || steps.health-report.outcome != 'success') }}
        env:
          SHARED_DATASETS_SLACK_WEBHOOK_URL: ${{ secrets.SHARED_DATASETS_SLACK_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' \
            --data "{\"text\":\"Operational safety infrastructure failed: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SHARED_DATASETS_SLACK_WEBHOOK_URL"
