name: Terraform state read IAM sync
on:
  workflow_call:
    inputs:
      executor_sha: {description: Exact tested main revision, required: true, type: string}
      source_run_id: {description: Main-push CI run that tested executor_sha, required: true, type: string}
      source_run_attempt: {description: Exact successful ci-ready attempt, required: true, type: string}
  workflow_dispatch:
    inputs:
      executor_sha: {description: Exact tested main revision, required: true, type: string}
      source_run_id: {description: Main-push CI run that tested executor_sha, required: true, type: string}
      source_run_attempt: {description: Exact successful ci-ready attempt, required: true, type: string}
permissions:
  actions: read
  pull-requests: read
  deployments: write
  contents: read
  id-token: write
  attestations: write
jobs:
  pr-plan-authority:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: terraform-state-read-iam-sync.yml
      sync_name: PR plan identity IAM bootstrap
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
  pr-plan-identity:
    needs: pr-plan-authority
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: terraform-state-read-iam-sync.yml
      sync_name: PR plan identity provisioning
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
  bootstrap:
    name: Provision shared-project Terraform metadata reads
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: terraform-state-read-iam-sync.yml
      sync_name: Production Terraform state read IAM bootstrap
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
