name: Cron alert policy sync

on:
  workflow_call:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string

permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write

jobs:
  bootstrap:
    name: Apply Monitoring alert policy IAM bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Monitoring alert policy IAM bootstrap
      refusal_prefix: Refusing automatic Monitoring alert policy IAM bootstrap
      # Wait for the role grant to propagate before the policies are applied.
      post_apply_wait_seconds: 30
      targets: |
        google_project_iam_custom_role.monitoring_alert_policy_manager
        google_project_iam_member.github_actions_monitoring_alert_policy_manager
      allowed_exact: |
        google_project_iam_custom_role.monitoring_alert_policy_manager
        google_project_iam_member.github_actions_monitoring_alert_policy_manager
      tf_vars: |
        wdpa_monthly_image=unused-by-cron-alert-policy-sync
        sea_ice_daily_image=unused-by-cron-alert-policy-sync
        eamlis_monthly_image=unused-by-cron-alert-policy-sync

  sync:
    name: Apply cron alert policy sync
    needs: bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: monitoring-alerts
      sync_name: Cron alert policy sync
      refusal_prefix: Refusing automatic cron alert policy sync
      targets: |
        google_monitoring_alert_policy.scheduled_ingestion_cloud_run_failure
        google_monitoring_alert_policy.wdpa_execution_observer_unhealthy
        google_monitoring_alert_policy.release_awaiting_identity_decision
        google_monitoring_alert_policy.scheduled_ingestion_scheduler_failure
        google_monitoring_alert_policy.dataset_object_written_by_unapproved_principal
      allowed_exact: |
        google_monitoring_alert_policy.scheduled_ingestion_cloud_run_failure
        google_monitoring_alert_policy.wdpa_execution_observer_unhealthy
        google_monitoring_alert_policy.release_awaiting_identity_decision
        google_monitoring_alert_policy.scheduled_ingestion_scheduler_failure
        google_monitoring_alert_policy.dataset_object_written_by_unapproved_principal
      tf_vars: |
        wdpa_monthly_image=unused-by-cron-alert-policy-sync
        sea_ice_daily_image=unused-by-cron-alert-policy-sync
        eamlis_monthly_image=unused-by-cron-alert-policy-sync

  retire-observer-access:
    name: Rolled-back observer access retirement
    needs: sync
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Rolled-back observer access retirement
      refusal_prefix: Refusing changes outside reviewed observer retirement
      targets: |
        google_logging_log_view_iam_member.operational_observer["_Default-run-activity"]
        google_logging_log_view_iam_member.operational_observer["_Default-run-data-access"]
        google_logging_log_view_iam_member.operational_observer["_Default-run-stderr"]
        google_logging_log_view_iam_member.operational_observer["_Default-scheduler-executions"]
        google_logging_log_view_iam_member.operational_observer["_Required-run-activity"]
        google_logging_log_view_iam_member.operational_observer["_Required-run-data-access"]
        google_logging_log_view_iam_member.operational_observer["_Required-run-stderr"]
        google_logging_log_view_iam_member.operational_observer["_Required-scheduler-executions"]
        google_monitoring_alert_policy.operational_reconciliation_unhealthy
        google_project_iam_audit_config.operational_run_data_write
        google_project_iam_member.operational_observer_reader
        google_service_account_iam_member.operational_observer_wif
        google_storage_bucket_iam_member.operational_observer_manifests["0"]
        google_storage_bucket_iam_member.operational_observer_manifests["1"]
        google_storage_bucket_iam_member.operational_observer_manifests["2"]
        google_storage_bucket_iam_member.operational_observer_manifests["3"]
        google_storage_bucket_iam_member.operational_observer_manifests["4"]
        google_storage_bucket_iam_member.operational_observer_receipts["0"]
        google_storage_bucket_iam_member.operational_observer_receipts["1"]
        google_storage_bucket_iam_member.operational_observer_receipts["2"]
        google_storage_bucket_iam_member.operational_observer_receipts["3"]
        google_storage_bucket_iam_member.operational_observer_receipts["4"]
      allowed_exact: |
        google_logging_log_view_iam_member.operational_observer["_Default-run-activity"]
        google_logging_log_view_iam_member.operational_observer["_Default-run-data-access"]
        google_logging_log_view_iam_member.operational_observer["_Default-run-stderr"]
        google_logging_log_view_iam_member.operational_observer["_Default-scheduler-executions"]
        google_logging_log_view_iam_member.operational_observer["_Required-run-activity"]
        google_logging_log_view_iam_member.operational_observer["_Required-run-data-access"]
        google_logging_log_view_iam_member.operational_observer["_Required-run-stderr"]
        google_logging_log_view_iam_member.operational_observer["_Required-scheduler-executions"]
        google_monitoring_alert_policy.operational_reconciliation_unhealthy
        google_project_iam_audit_config.operational_run_data_write
        google_project_iam_member.operational_observer_reader
        google_service_account_iam_member.operational_observer_wif
        google_storage_bucket_iam_member.operational_observer_manifests["0"]
        google_storage_bucket_iam_member.operational_observer_manifests["1"]
        google_storage_bucket_iam_member.operational_observer_manifests["2"]
        google_storage_bucket_iam_member.operational_observer_manifests["3"]
        google_storage_bucket_iam_member.operational_observer_manifests["4"]
        google_storage_bucket_iam_member.operational_observer_receipts["0"]
        google_storage_bucket_iam_member.operational_observer_receipts["1"]
        google_storage_bucket_iam_member.operational_observer_receipts["2"]
        google_storage_bucket_iam_member.operational_observer_receipts["3"]
        google_storage_bucket_iam_member.operational_observer_receipts["4"]
      tf_vars: |
        wdpa_monthly_image=unused-by-observer-retirement
        sea_ice_daily_image=unused-by-observer-retirement
        eamlis_monthly_image=unused-by-observer-retirement

  retire-observer-authority:
    name: Rolled-back observer authority retirement
    needs: retire-observer-access
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Rolled-back observer authority retirement
      refusal_prefix: Refusing changes outside reviewed observer retirement
      targets: |
        google_project_iam_member.github_actions_operational_log_view_manager
        google_project_iam_member.github_actions_operational_metric_descriptor_manager
        google_project_iam_member.github_actions_operational_provider_creator
        google_project_iam_member.github_actions_operational_provider_reader
        google_project_iam_member.github_actions_readonly_provider_updater
      allowed_exact: |
        google_project_iam_member.github_actions_operational_log_view_manager
        google_project_iam_member.github_actions_operational_metric_descriptor_manager
        google_project_iam_member.github_actions_operational_provider_creator
        google_project_iam_member.github_actions_operational_provider_reader
        google_project_iam_member.github_actions_readonly_provider_updater
      tf_vars: |
        wdpa_monthly_image=unused-by-observer-retirement
        sea_ice_daily_image=unused-by-observer-retirement
        eamlis_monthly_image=unused-by-observer-retirement
