name: Infrastructure / Cron alert policy sync
on:
  workflow_call:
    inputs:
      sync_iam:
        required: true
        type: boolean
      executor_sha: {description: Exact tested main revision, required: true, type: string}
      source_run_id: {description: Main-push CI run that tested executor_sha, required: true, type: string}
      source_run_attempt: {description: Exact successful ci-ready attempt, required: true, type: string}
  workflow_dispatch:
    inputs:
      executor_sha: {description: Exact tested main revision, required: true, type: string}
      source_run_id: {description: Main-push CI run that tested executor_sha, required: true, type: string}
      source_run_attempt: {description: Exact successful ci-ready attempt, required: true, type: string}
permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write
jobs:
  bootstrap:
    name: Apply Monitoring alert policy IAM bootstrap
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || inputs.sync_iam) }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      sync_name: Monitoring alert policy IAM bootstrap
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
  resources:
    name: Provision private Monitoring Slack transport resources
    needs: bootstrap
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.bootstrap.result == 'success' }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      sync_name: Monitoring Slack transport resources
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
  sync:
    name: Apply cron alert policy sync
    needs:
    - bootstrap
    - resources
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && ((github.event_name == 'push' && !inputs.sync_iam) || (needs.bootstrap.result == 'success' && needs.resources.result == 'success')) }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    secrets: inherit
    with:
      caller_workflow: cron-alert-policy-sync.yml
      sync_name: Cron alert policy sync
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
