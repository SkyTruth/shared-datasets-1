name: Cron alert policy sync

on:
  workflow_call:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string

permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write

jobs:
  bootstrap:
    name: Apply Monitoring alert policy IAM bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Monitoring alert policy IAM bootstrap
      refusal_prefix: Refusing automatic Monitoring alert policy IAM bootstrap
      # Wait for the role grant to propagate before the policies are applied.
      post_apply_wait_seconds: 30
      targets: |
        google_project_iam_custom_role.monitoring_alert_policy_manager
        google_project_iam_member.github_actions_monitoring_alert_policy_manager
      allowed_exact: |
        google_project_iam_custom_role.monitoring_alert_policy_manager
        google_project_iam_member.github_actions_monitoring_alert_policy_manager
      tf_vars: |
        wdpa_monthly_image=unused-by-cron-alert-policy-sync
        sea_ice_daily_image=unused-by-cron-alert-policy-sync
        eamlis_monthly_image=unused-by-cron-alert-policy-sync

  sync:
    name: Apply cron alert policy sync
    needs: bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: cron-alert-policy-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: monitoring-alerts
      sync_name: Cron alert policy sync
      refusal_prefix: Refusing automatic cron alert policy sync
      targets: |
        google_monitoring_alert_policy.scheduled_ingestion_cloud_run_failure
        google_monitoring_alert_policy.release_awaiting_identity_decision
        google_monitoring_alert_policy.scheduled_ingestion_scheduler_failure
        google_monitoring_alert_policy.dataset_object_written_by_unapproved_principal
      allowed_exact: |
        google_monitoring_alert_policy.scheduled_ingestion_cloud_run_failure
        google_monitoring_alert_policy.release_awaiting_identity_decision
        google_monitoring_alert_policy.scheduled_ingestion_scheduler_failure
        google_monitoring_alert_policy.dataset_object_written_by_unapproved_principal
      tf_vars: |
        wdpa_monthly_image=unused-by-cron-alert-policy-sync
        sea_ice_daily_image=unused-by-cron-alert-policy-sync
        eamlis_monthly_image=unused-by-cron-alert-policy-sync
