name: Deployments / Completion check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  attestations: read
jobs:
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      records: ${{ steps.pending.outputs.records }}
    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/deployment-verification.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/deployment_revision.py pending
  verify:
    needs: pending
    if: ${{ needs.pending.outputs.records != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        record: ${{ fromJSON(needs.pending.outputs.records) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: shared-datasets-production
    permissions:
      contents: read
      actions: write
      deployments: write
      id-token: write
      attestations: write
    concurrency:
      group: deployment-verification-${{ matrix.record }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned durable receipt verifier
        run: python scripts/install_deployment_verifier.py
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: shared-datasets-observer@shared-datasets-1.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          skip_install: true
      - name: Verify exact execution terminal outcome
        id: deployment-outcome
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ matrix.record }}
        run: python scripts/deployment_revision.py observe --deployment-id "$DEPLOYMENT_ID"
      - name: Attest verified execution outcome
        id: terminal-receipt
        if: ${{ always() && steps.deployment-outcome.outputs.receipt_path != '' }}
        uses: ./.github/actions/deployment-receipt
        with:
          mode: receipt
          receipt-path: ${{ steps.deployment-outcome.outputs.receipt_path }}
      - name: Request automatic execution recovery
        timeout-minutes: 1
        if: ${{ success() && steps.terminal-receipt.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run resolve-workflow-alert.yml --ref main -f automatic=true
