name: Preview Terraform IAM sync

on:
  workflow_call:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string

permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write

jobs:
  bootstrap:
    name: Bootstrap preview Terraform role authority
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: preview-terraform-iam-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Preview Terraform IAM bootstrap
      refusal_prefix: Refusing automatic preview Terraform IAM bootstrap
      block_deletes: true
      post_apply_wait_seconds: 30
      targets: |
        google_project_iam_custom_role.preview_terraform
        google_project_iam_member.github_actions_preview_terraform
      allowed_exact: |
        google_project_iam_custom_role.preview_terraform
        google_project_iam_member.github_actions_preview_terraform
      tf_vars: |
        wdpa_monthly_image=unused-by-preview-terraform-iam-sync
        sea_ice_daily_image=unused-by-preview-terraform-iam-sync
        eamlis_monthly_image=unused-by-preview-terraform-iam-sync

  sync:
    name: Apply preview Terraform IAM sync
    needs: bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: preview-terraform-iam-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: preview-service-account-iam
      sync_name: Preview Terraform IAM sync
      refusal_prefix: Refusing automatic preview Terraform IAM sync
      block_deletes: true
      targets: |
        module.feature_preview_service_account.google_service_account.this
        module.feature_preview_loader_service_account.google_service_account.this
        google_service_account_iam_member.feature_preview_loader_github_wif
        google_service_account_iam_member.feature_preview_service_self_sign_blob
      allowed_exact: |
        module.feature_preview_service_account.google_service_account.this
        module.feature_preview_loader_service_account.google_service_account.this
        google_service_account_iam_member.feature_preview_loader_github_wif
        google_service_account_iam_member.feature_preview_service_self_sign_blob
      tf_vars: |
        wdpa_monthly_image=unused-by-preview-terraform-iam-sync
        sea_ice_daily_image=unused-by-preview-terraform-iam-sync
        eamlis_monthly_image=unused-by-preview-terraform-iam-sync
