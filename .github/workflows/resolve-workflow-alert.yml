name: Alerts / Legacy workflow resolution

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Original failed unattended run ID
        required: false
        type: string
      message_ts:
        description: Owner-confirmed timestamp of that run's original Slack parent
        required: false
        type: string
      monitoring_incident_id:
        description: Monitoring incident ID instead of run_id/message_ts; must already be CLOSED
        required: false
        type: string

permissions:
  contents: read
  actions: read
  deployments: read
  attestations: read

jobs:
  resolve:
    if: github.actor == 'jonaraphael' && github.ref == 'refs/heads/main' && inputs.monitoring_incident_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Install pinned durable receipt verifier
        run: python scripts/install_deployment_verifier.py
      - name: Verify every failed target and update the original parent
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
          ORIGINAL_RUN_ID: ${{ inputs.run_id }}
          ORIGINAL_MESSAGE_TS: ${{ inputs.message_ts }}
        run: uv run --no-sync python scripts/workflow_failure_alert.py --resolve-run-id "$ORIGINAL_RUN_ID" --message-ts "$ORIGINAL_MESSAGE_TS"

  monitoring:
    if: github.actor == 'jonaraphael' && github.ref == 'refs/heads/main' && inputs.monitoring_incident_id != ''
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/resolve-workflow-alert.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --locked --no-dev
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
      - name: Read authoritative closure and edit the recorded parent
        env:
          INCIDENT_ID: ${{ inputs.monitoring_incident_id }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
        run: uv run --no-sync python scripts/monitoring_slack_reconcile.py "$INCIDENT_ID"
