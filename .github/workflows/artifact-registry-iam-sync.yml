name: Artifact Registry IAM sync

on:
  workflow_call:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string

permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write

jobs:
  bootstrap:
    name: Apply Artifact Registry IAM policy manager bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: artifact-registry-iam-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Artifact Registry IAM sync
      refusal_prefix: Refusing automatic Artifact Registry IAM bootstrap
      # Wait for IAM policy manager propagation before the writer binding plan.
      post_apply_wait_seconds: 30
      targets: |
        google_project_iam_custom_role.artifact_registry_iam_policy_manager
        google_project_iam_member.github_actions_artifact_registry_iam_policy_manager
      allowed_exact: |
        google_project_iam_custom_role.artifact_registry_iam_policy_manager
        google_project_iam_member.github_actions_artifact_registry_iam_policy_manager
      tf_vars: |
        wdpa_monthly_image=unused-by-artifact-registry-iam-sync
        sea_ice_daily_image=unused-by-artifact-registry-iam-sync
        eamlis_monthly_image=unused-by-artifact-registry-iam-sync

  writer:
    name: Apply Artifact Registry writer binding
    needs: bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: artifact-registry-iam-sync.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: artifact-registry
      sync_name: Artifact Registry writer binding sync
      refusal_prefix: Refusing automatic Artifact Registry IAM writer sync
      targets: |
        google_artifact_registry_repository_iam_member.github_actions_artifact_registry_writer
      allowed_exact: |
        google_artifact_registry_repository_iam_member.github_actions_artifact_registry_writer
      tf_vars: |
        wdpa_monthly_image=unused-by-artifact-registry-iam-sync
        sea_ice_daily_image=unused-by-artifact-registry-iam-sync
        eamlis_monthly_image=unused-by-artifact-registry-iam-sync
