name: Infrastructure / Artifact Registry IAM sync
on:
  workflow_call:
    inputs:
      executor_sha: {description: Exact tested main revision, required: true, type: string}
      source_run_id: {description: Main-push CI run that tested executor_sha, required: true, type: string}
      source_run_attempt: {description: Exact successful ci-ready attempt, required: true, type: string}
  workflow_dispatch:
    inputs:
      executor_sha: {description: Exact tested main revision, required: true, type: string}
      source_run_id: {description: Main-push CI run that tested executor_sha, required: true, type: string}
      source_run_attempt: {description: Exact successful ci-ready attempt, required: true, type: string}
permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write
jobs:
  bootstrap:
    name: Apply Artifact Registry IAM policy manager bootstrap
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: artifact-registry-iam-sync.yml
      sync_name: Artifact Registry IAM sync
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
  identities:
    name: Bind protected workflow identities
    needs: bootstrap
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: artifact-registry-iam-sync.yml
      sync_name: GitHub workflow identity sync
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
  writer:
    name: Apply Artifact Registry writer binding
    needs: [bootstrap, identities]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: artifact-registry-iam-sync.yml
      sync_name: Artifact Registry writer binding sync
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
