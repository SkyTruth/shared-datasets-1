name: Catalog browser smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.8'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install locked Python and browser test dependencies
        run: |
          uv sync --locked
          npm ci --ignore-scripts --prefix tests/browser
          npm ci --ignore-scripts --prefix api/typescript
          npm run build --prefix api/typescript
      - name: Install pinned Chromium and OS libraries
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Render real catalog and verify release selection
        working-directory: tests/browser
        env:
          SHARED_DATASETS_WORKDIR: ${{ runner.temp }}/shared-datasets-1
        run: npm test
      - name: Preserve browser reports and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-browser-smoke
          path: ${{ runner.temp }}/shared-datasets-1/catalog-browser-smoke
          retention-days: 7
          if-no-files-found: error
