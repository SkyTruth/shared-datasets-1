name: Ingestion / Schedule control
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Affected ingestion schedule"
        type: string
        required: true
      action:
        description: "Pause before reset; resume only after validated publication"
        type: choice
        options: [pause, resume]
        default: pause
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    env:
      JOB_NAME: ${{ inputs.job }}
      SCHEDULE_ACTION: ${{ inputs.action }}
    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/ingestion-schedule-control.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate fixed schedule scope
        run: |
          python -c 'import os, sys; from scripts.ingestion_targets import TARGETS; sys.exit(0 if os.environ["JOB_NAME"] in TARGETS and os.environ["SCHEDULE_ACTION"] in {"pause", "resume"} else "Require a registered publisher schedule and pause/resume")'
      - name: Install pinned durable receipt verifier
        if: ${{ inputs.action == 'resume' && inputs.job == 'wdpa-monthly' }}
        run: python scripts/install_deployment_verifier.py
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: shared-datasets-runtime@shared-datasets-1.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.8"
      - name: Verify publication before resuming
        if: ${{ inputs.action == 'resume' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv sync --frozen
          if [[ "${JOB_NAME}" == eamlis-monthly ]]; then
            uv run --no-sync python scripts/eamlis_identity_transition.py require-published
          elif [[ "${JOB_NAME}" == mpatlas-monthly ]]; then
            uv run --no-sync python -c 'from google.cloud import storage; from ingestion.common.gcs import GcsPublisher; from ingestion.mpatlas_monthly.run import load_baseline; load_baseline(GcsPublisher(storage.Client(project="shared-datasets-1"), "skytruth-shared-datasets-1"))'
          else
            uv run --no-sync python scripts/publication_rollout_gate.py --job "$JOB_NAME" --require-published
          fi
          if [[ "${JOB_NAME}" == wdpa-monthly ]]; then
            uv run --no-sync python scripts/wdpa_schedule_readiness.py
          fi
      - name: Set schedule state
        run: |
          set -euo pipefail
          args=("${JOB_NAME}" --location=us-central1 --project=shared-datasets-1)
          state="$(gcloud scheduler jobs describe "${args[@]}" --format='value(state)')"
          if [[ "${SCHEDULE_ACTION}" == pause && "${state}" == ENABLED ]]; then
            gcloud scheduler jobs pause "${args[@]}"
          elif [[ "${SCHEDULE_ACTION}" == resume && "${state}" == PAUSED ]]; then
            gcloud scheduler jobs resume "${args[@]}"
          elif [[ "${SCHEDULE_ACTION}:${state}" != pause:PAUSED && "${SCHEDULE_ACTION}:${state}" != resume:ENABLED ]]; then
            echo "Unexpected scheduler state: ${state}" >&2
            exit 1
          fi
          gcloud scheduler jobs describe "${args[@]}" --format='yaml(name,state,schedule,timeZone)'
          echo "A paused schedule does not cancel running executions. The reset installer verifies they have finished."
