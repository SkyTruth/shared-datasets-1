name: Ingestion schedule control

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Affected ingestion schedule"
        type: choice
        options: [wdpa-monthly, sea-ice-daily]
        required: true
      action:
        description: "Pause before reset; resume only after validated publication"
        type: choice
        options: [pause, resume]
        default: pause
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  control:
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    env:
      JOB_NAME: ${{ inputs.job }}
      SCHEDULE_ACTION: ${{ inputs.action }}
    steps:
      - name: Validate reviewed main and fixed scope
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/main ]] ||
             [[ "${JOB_NAME}" != wdpa-monthly && "${JOB_NAME}" != sea-ice-daily ]] ||
             [[ "${SCHEDULE_ACTION}" != pause && "${SCHEDULE_ACTION}" != resume ]]; then
            echo "Only pause/resume of WDPA or sea ice from reviewed main is allowed." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Verify publication before resuming
        if: ${{ inputs.action == 'resume' }}
        run: |
          uv sync --frozen
          uv run --no-sync python scripts/publication_rollout_gate.py --job "$JOB_NAME" --require-published

      - name: Set schedule state
        run: |
          set -euo pipefail
          args=("${JOB_NAME}" --location=us-central1 --project=shared-datasets-1)
          state="$(gcloud scheduler jobs describe "${args[@]}" --format='value(state)')"
          if [[ "${SCHEDULE_ACTION}" == pause && "${state}" == ENABLED ]]; then
            gcloud scheduler jobs pause "${args[@]}"
          elif [[ "${SCHEDULE_ACTION}" == resume && "${state}" == PAUSED ]]; then
            gcloud scheduler jobs resume "${args[@]}"
          elif [[ "${SCHEDULE_ACTION}:${state}" != pause:PAUSED && "${SCHEDULE_ACTION}:${state}" != resume:ENABLED ]]; then
            echo "Unexpected scheduler state: ${state}" >&2
            exit 1
          fi
          gcloud scheduler jobs describe "${args[@]}" --format='yaml(name,state,schedule,timeZone)'
          echo "A paused schedule does not cancel running executions. The reset installer verifies they have finished."
