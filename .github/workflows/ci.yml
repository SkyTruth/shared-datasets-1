name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      wdpa_full_benchmark:
        description: Run small sea-ice smoke first, then marine WDPA without publication
        type: boolean
        default: false
      wdpa_benchmark_fraction:
        description: Use 1 for complete acceptance; 0.001 is a short diagnostic probe only
        type: choice
        options: ["1", "0.001"]
        default: "1"
      wdpa_inputs_probe:
        description: Measure input preparation only; cannot satisfy acceptance
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.8.5"

jobs:
  wdpa-benchmark-capacity:
    if: github.event_name == 'workflow_dispatch' && !inputs.wdpa_full_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure host capacity
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          disks = {}
          for path in ('/', '/mnt', os.environ['RUNNER_TEMP']):
              stat = os.statvfs(path)
              disks[path] = {'total_bytes': stat.f_blocks * stat.f_frsize, 'free_bytes': stat.f_bavail * stat.f_frsize}
          print(json.dumps({'cpu_count': os.cpu_count(), 'memory_bytes': int(memory['MemTotal'].split()[0]) * 1024, 'disks': disks}, sort_keys=True))
          PY
      - name: Check constrained-container telemetry
        run: |
          docker run --rm --cpus=4 --memory=8g --memory-swap=8g \
            python:3.12-slim-bookworm python -c \
            'import json; from pathlib import Path; root=Path("/sys/fs/cgroup"); print(json.dumps({name:(root/name).read_text().strip() if (root/name).exists() else None for name in ("cpu.max","memory.max","memory.peak")},sort_keys=True))'

  wdpa-benchmark-image:
    if: github.event_name == 'workflow_dispatch' && inputs.wdpa_full_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build the deployment image once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wdpa-image"
          docker buildx build --load --platform linux/amd64 \
            --build-arg SHARED_DATASETS_EXECUTOR_SHA="$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/wdpa-image/image.json" \
            -f ingestion/wdpa_monthly/Dockerfile -t wdpa-processing-benchmark:local .
          docker save wdpa-processing-benchmark:local | gzip -1 > "$RUNNER_TEMP/wdpa-image/image.tar.gz"
      - name: Share the deployment image with staged checks
        uses: actions/upload-artifact@v4
        with:
          name: wdpa-benchmark-image
          path: ${{ runner.temp }}/wdpa-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  wdpa-small-smoke:
    needs: wdpa-benchmark-image
    if: github.event_name == 'workflow_dispatch' && inputs.wdpa_full_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the shared deployment image
        uses: actions/download-artifact@v4
        with:
          name: wdpa-benchmark-image
          path: ${{ runner.temp }}/wdpa-image
      - name: Verify image and run the small sea-ice production path
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/wdpa-image/image.tar.gz" | docker load
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.config.digest"])' "$RUNNER_TEMP/wdpa-image/image.json")"
          [[ "$(docker image inspect wdpa-processing-benchmark:local --format '{{.Id}}')" == "$expected" ]]
          mkdir -p "$RUNNER_TEMP/wdpa-small"
          docker run --name wdpa-small --cpus=4 --memory=8g --memory-swap=8g \
            -e CLOUD_RUN_EXECUTION=wdpa-small \
            -v "$RUNNER_TEMP/wdpa-small:/work" wdpa-processing-benchmark:local \
            python scripts/local_ingestion_smoke.py --workdir /work/shared-datasets-1/small
          cp "$RUNNER_TEMP/wdpa-image/image.json" "$RUNNER_TEMP/wdpa-small/shared-datasets-1/small/image.json"
      - name: Upload small-fixture measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdpa-small-smoke-report
          path: |
            ${{ runner.temp }}/wdpa-small/shared-datasets-1/small/benchmark.json
            ${{ runner.temp }}/wdpa-small/shared-datasets-1/small/image.json
          if-no-files-found: ignore
          retention-days: 30

  wdpa-full-benchmark:
    needs: [wdpa-benchmark-image, wdpa-small-smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.wdpa_full_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WDPA_BENCHMARK_REPLAY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare disposable benchmark host
        run: |
          set -euo pipefail
          # These are unused preinstalled tools on this job's disposable VM.
          # Each CI job has its own VM; no other job or user workspace is affected.
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift /opt/swift /usr/lib/jvm /usr/local/share/chromium /usr/local/share/boost /usr/local/share/vcpkg; do
            if [[ -e "$path" ]]; then sudo du -sh "$path"; sudo rm -rf "$path"; fi
          done
          df -h /
          mkdir -p "$RUNNER_TEMP/wdpa-reports"
      - name: Download reviewed public frozen inputs without credentials
        run: |
          python3 scripts/download_public_wdpa_benchmark.py \
            --recipe docs/wdpa-processing-public-inputs.json \
            --out "$RUNNER_TEMP/wdpa-inputs"
      - name: Download the shared deployment image
        uses: actions/download-artifact@v4
        with:
          name: wdpa-benchmark-image
          path: ${{ runner.temp }}/wdpa-image
      - name: Load and verify the identical deployment image
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/wdpa-image/image.tar.gz" | docker load
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.config.digest"])' "$RUNNER_TEMP/wdpa-image/image.json")"
          actual="$(docker image inspect wdpa-processing-benchmark:local --format '{{.Id}}')"
          [[ "$actual" == "$expected" ]] || { echo 'Loaded deployment image digest mismatch'; exit 1; }
          cp "$RUNNER_TEMP/wdpa-image/image.json" "$RUNNER_TEMP/wdpa-reports/image.json"
          rm "$RUNNER_TEMP/wdpa-image/image.tar.gz"
      - name: Provision a 100 GiB disk scratch filesystem
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          s = os.statvfs(os.environ['RUNNER_TEMP'])
          available = s.f_bavail * s.f_frsize
          print({'host_free_bytes_before_disk': available}, flush=True)
          if available < 105 * 1024**3:
              raise SystemExit('Insufficient host storage for a 100 GiB disk; resource target must not be reduced')
          PY
          sudo fallocate -l 100G "$RUNNER_TEMP/wdpa-scratch.ext4"
          device="$(sudo losetup --find --show --direct-io=on "$RUNNER_TEMP/wdpa-scratch.ext4")"
          echo "WDPA_SCRATCH_DEVICE=$device" >> "$GITHUB_ENV"
          sudo mkfs.ext4 -q -m 0 -E lazy_itable_init=0,lazy_journal_init=0 "$device"
          sudo mkdir -p /work
          sudo mount "$device" /work
          sudo chmod 0777 /work
          df -h /work
      - name: Run marine WDPA with 4 CPU and 8 GiB
        if: ${{ !inputs.wdpa_inputs_probe }}
        env:
          WDPA_BENCHMARK_FRACTION: ${{ inputs.wdpa_benchmark_fraction || '1' }}
        run: |
          set -euo pipefail
          echo "Starting October replay $WDPA_BENCHMARK_REPLAY (fraction $WDPA_BENCHMARK_FRACTION)"
          # Each replay gets a fresh VM, disk and cgroup, with the identical image.
          # Leave time to retain diagnostics before the hosted job's six-hour limit.
          timeout --signal=TERM --kill-after=120s 330m docker run --name wdpa-replay \
            --cpus=4 --memory=8g --memory-swap=8g \
            -e CLOUD_RUN_EXECUTION=wdpa-benchmark \
            -v /work:/work \
            -v "$RUNNER_TEMP/wdpa-inputs:/inputs:ro" \
            wdpa-processing-benchmark:local \
            python scripts/local_wdpa_sample.py \
              --source /inputs/WDPA_WDOECM_Oct2026_Public_all_shp.zip \
              --baselines /inputs/frozen-inputs \
              --translation-sources /inputs/frozen-inputs/translation-sources.json \
              --workdir /work/shared-datasets-1/replay --run-date 2026-10-01 \
              --asset wdpa-marine \
              --fraction "$WDPA_BENCHMARK_FRACTION"
          cp /work/shared-datasets-1/replay/benchmark.json "$RUNNER_TEMP/wdpa-reports/replay-$WDPA_BENCHMARK_REPLAY.json"
          docker inspect wdpa-replay --format '{{json .State}}' > "$RUNNER_TEMP/wdpa-reports/container-$WDPA_BENCHMARK_REPLAY.json"
          docker rm wdpa-replay
      - name: Measure input preparation only
        if: ${{ inputs.wdpa_inputs_probe }}
        run: |
          docker run --name wdpa-replay --cpus=4 --memory=8g --memory-swap=8g \
            -e CLOUD_RUN_EXECUTION=wdpa-benchmark -v /work:/work \
            -v "$PWD/scripts/wdpa_input_memory_probe.py:/app/scripts/wdpa_input_memory_probe.py:ro" \
            -v "$RUNNER_TEMP/wdpa-inputs:/inputs:ro" wdpa-processing-benchmark:local \
            python scripts/wdpa_input_memory_probe.py \
              --source /inputs/WDPA_WDOECM_Oct2026_Public_all_shp.zip \
              --baselines /inputs/frozen-inputs --workdir /work/shared-datasets-1/replay
          cp /work/shared-datasets-1/replay/benchmark.json "$RUNNER_TEMP/wdpa-reports/input-probe.json"
          docker inspect wdpa-replay --format '{{json .State}}' > "$RUNNER_TEMP/wdpa-reports/container-probe.json"
          docker rm wdpa-replay
      - name: Retain report if a replay failed
        if: failure() || cancelled()
        run: |
          if docker inspect wdpa-replay >/dev/null 2>&1; then
            docker stop --time=120 wdpa-replay || true
            docker inspect wdpa-replay --format '{{json .State}}' > "$RUNNER_TEMP/wdpa-reports/container-$WDPA_BENCHMARK_REPLAY.json"
            python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          phases = []
          with subprocess.Popen(['docker', 'logs', 'wdpa-replay'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True) as process:
              for line in process.stdout:
                  try:
                      record = json.loads(line[line.index('{'):])
                  except ValueError:
                      continue
                  if isinstance(record, dict) and record.get('event') in {'wdpa_phase_started', 'wdpa_phase_resources'}:
                      phases.append(record)
              if process.wait() != 0:
                  raise SystemExit('Could not retain benchmark phase diagnostics')
          target = Path(os.environ['RUNNER_TEMP']) / 'wdpa-reports/partial-phases.json'
          target.write_text(json.dumps({'scope':'partial-not-acceptance', 'phases':phases}, indent=2)+'\n')
          PY
          fi
          if [[ -f /work/shared-datasets-1/replay/benchmark.json ]]; then
            cp /work/shared-datasets-1/replay/benchmark.json "$RUNNER_TEMP/wdpa-reports/failed-replay.json"
          fi
      - name: Upload measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (inputs.wdpa_inputs_probe || inputs.wdpa_benchmark_fraction == '0.001') && 'wdpa-debug-benchmark-reports' || 'wdpa-marine-benchmark-reports' }}
          path: ${{ runner.temp }}/wdpa-reports/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Unmount disposable benchmark disk
        if: always()
        run: |
          sudo umount /work 2>/dev/null || true
          if [[ -n "${WDPA_SCRATCH_DEVICE:-}" ]]; then sudo losetup -d "$WDPA_SCRATCH_DEVICE"; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Validate Terraform configurations
        run: |
          set -euo pipefail
          for env_dir in terraform/envs/prod terraform/envs/preview terraform/envs/metadata-retirement-iam; do
            echo "Validating ${env_dir}"
            terraform -chdir="${env_dir}" init -backend=false -input=false >/dev/null
            terraform -chdir="${env_dir}" validate
          done

      - name: Test account-scoped retirement authority
        run: terraform -chdir=terraform/envs/metadata-retirement-iam test

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run full-history secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Fetch PR base for admission check
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/typescript/package-lock.json

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Install TypeScript package dependencies
        working-directory: api/typescript
        run: npm ci

      - name: Check dataset admission evidence
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/admission_check.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD

      - name: Check repo guardrails for this diff
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/repo_guardrails.py check-diff \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head HEAD \
            --event-path "$GITHUB_EVENT_PATH"

      - name: Check static repo guardrails
        run: uv run python scripts/repo_guardrails.py check-static

      - name: Run tests
        run: |
          mkdir -p test-results
          uv run pytest --junitxml=test-results/pytest.xml

      - name: Run TypeScript package tests
        working-directory: api/typescript
        run: npm test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore

  geospatial-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect geospatial changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          geospatial_pattern='^(\.github/(docker/geospatial-ci\.Dockerfile|workflows/ci\.yml)|pyproject\.toml|uv\.lock|ingestion/.*|scripts/(vector_asset|release_feature_model|check_geospatial_test_results|feature_metadata_localization|feature_metadata_translation_reuse|translation_local_io|raster_asset|dataset_alerts)\.py|tests/test_(geospatial_ci|feature_metadata_localization|feature_metadata_translation_reuse|translation_local_io|raster_standards|wdpa_monthly|wdpa_disk_processing|wdpa_translation_inputs|sea_ice_daily|eamlis_monthly)\.py)$'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed_files="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          else
            changed_files=""
          fi

          if printf '%s\n' "$changed_files" | grep -E "$geospatial_pattern" >/dev/null; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  geospatial-integration:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build geospatial CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/geospatial-ci.Dockerfile
          tags: shared-datasets-geospatial-ci:latest
          load: true
          cache-from: type=gha,scope=geospatial-ci
          cache-to: type=gha,mode=max,scope=geospatial-ci,ignore-error=true

      - name: Run geospatial integration tests
        run: |
          mkdir -p test-results
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e UV_CACHE_DIR=.uv-cache \
            -e UV_LINK_MODE=copy \
            -e UV_PROJECT_ENVIRONMENT=/tmp/shared-datasets-geospatial-venv \
            -e RUN_GDAL_INTEGRATION_TESTS=1 \
            shared-datasets-geospatial-ci \
            bash -lc 'uv sync --locked --all-groups --extra wdpa-native --extra geospatial-ci && uv run pytest tests/test_feature_metadata_localization.py tests/test_translation_local_io.py tests/test_raster_standards.py tests/test_wdpa_monthly.py tests/test_wdpa_disk_processing.py tests/test_sea_ice_daily.py tests/test_eamlis_monthly.py -o xfail_strict=true --junitxml=test-results/geospatial-pytest.xml && uv run python scripts/check_geospatial_test_results.py test-results/geospatial-pytest.xml'

      - name: Upload geospatial test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: geospatial-pytest-results
          path: test-results/geospatial-pytest.xml
          if-no-files-found: ignore
