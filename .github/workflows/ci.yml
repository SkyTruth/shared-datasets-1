name: CI / Validate and deliver

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel the entire obsolete PR graph. Main runs retain their deployment bytes
# and dispatch runs retain their requested diagnostics, each in a unique group.
concurrency:
  group: ci-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12.12"
  NODE_VERSION: "22.12.0"
  TERRAFORM_VERSION: "1.8.5"

jobs:
  geospatial-changes:
    name: geospatial-changes
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      sdk: ${{ steps.plan.outputs.sdk-node22 }}
      browser: ${{ steps.plan.outputs.browser }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      production_images: ${{ steps.plan.outputs.production-images }}
      production_image_targets: ${{ steps.plan.outputs.production-image-targets }}
      image_handoff_benchmark: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (contains(fromJSON(steps.plan.outputs.changed-paths), 'scripts/tested_image_authorization.py') || contains(fromJSON(steps.plan.outputs.changed-paths), 'scripts/tested_image_bundle.py') || contains(fromJSON(steps.plan.outputs.changed-paths), 'scripts/benchmark_image_handoff.py')) }}
      mpatlas: ${{ steps.plan.outputs.mpatlas }}
      eamlis: ${{ steps.plan.outputs.eamlis }}
      wdpa: ${{ steps.plan.outputs.wdpa }}
      sea_ice: ${{ steps.plan.outputs.sea_ice }}
      ingestion_iam: ${{ steps.plan.outputs.ingestion_iam }}
      pmtiles_cdn: ${{ steps.plan.outputs.pmtiles_cdn }}
      catalog_viewer: ${{ steps.plan.outputs.catalog_viewer }}
      dataset_usage: ${{ steps.plan.outputs.dataset_usage }}
      artifact_registry_iam: ${{ steps.plan.outputs.artifact_registry_iam }}
      preview_terraform_iam: ${{ steps.plan.outputs.preview_terraform_iam }}
      scratch_cleanup_iam: ${{ steps.plan.outputs.scratch_cleanup_iam }}
      cron_alert_policy: ${{ steps.plan.outputs.cron_alert_policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Select validation for the tested merge tree
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci_preflight.py plan --base "$BASE_SHA" --head "$GITHUB_SHA" --source-head "$SOURCE_HEAD" \
            --output "$RUNNER_TEMP/ci-plan/plan.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-validation-plan-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan/plan.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}

  lint:
    needs: geospatial-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run selected lint checks
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite lint --output "$RUNNER_TEMP/ci-results/lint"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-lint-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/lint
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-lint-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/lint/result.json
          if-no-files-found: error
          retention-days: 14

  tests:
    needs: geospatial-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
        with:
          binaries: gitleaks
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run selected secret, guardrail and Python checks
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite tests --output "$RUNNER_TEMP/ci-results/tests"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-tests-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/tests
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-tests-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/tests/result.json
          if-no-files-found: error
          retention-days: 14

  geospatial-integration:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Reuse verified PR native validation
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_preflight.py reuse-suite --plan "$RUNNER_TEMP/ci-plans"
          --suite geospatial-integration --output "$RUNNER_TEMP/ci-results/geospatial-integration" --github-output "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.reuse.outputs.reused != 'true'
      - name: Build geospatial CI image
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/geospatial-ci.Dockerfile
          tags: shared-datasets-geospatial-ci:local
          load: true
          cache-from: type=gha,scope=geospatial-ci
          cache-to: type=gha,mode=max,scope=geospatial-ci,ignore-error=true
      - name: Run shared native validation
        if: steps.reuse.outputs.reused != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ci-results/geospatial-integration"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" -v "$RUNNER_TEMP:/evidence" -w /workspace \
            -e UV_CACHE_DIR=/opt/uv-cache -e UV_LINK_MODE=copy \
            -e UV_PROJECT_ENVIRONMENT=/evidence/native-venv \
            -e SHARED_DATASETS_WORKDIR=/evidence/shared-datasets-1 \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            shared-datasets-geospatial-ci:local python scripts/ci_preflight.py run-suite \
            --plan /evidence/ci-plans --suite geospatial-integration \
            --output /evidence/ci-results/geospatial-integration
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-geospatial-integration-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/geospatial-integration
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-geospatial-integration-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/geospatial-integration/result.json
          if-no-files-found: error
          retention-days: 14

  production-images:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.production_images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Reuse verified PR production images
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_preflight.py reuse-suite --plan "$RUNNER_TEMP/ci-plans"
          --suite production-images --output "$RUNNER_TEMP/ci-results/production-images" --github-output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/ci-tools
        if: steps.reuse.outputs.reused != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.reuse.outputs.reused != 'true'
      - name: Expose the ephemeral Actions cache runtime
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Test the actual production image recipes
        if: steps.reuse.outputs.reused != 'true'
        env:
          SHARED_DATASETS_GITHUB_IMAGE_CACHE: "true"
        run: python scripts/ci_preflight.py run-suite --plan "$(find "$RUNNER_TEMP/ci-plans" -name plan.json | sort -V | tail -1)" --suite production-images --output "$RUNNER_TEMP/ci-results/production-images"
      - name: Retain tested mpatlas-monthly image
        uses: actions/upload-artifact@v4
        id: retained-mpatlas-monthly
        if: steps.reuse.outputs.reused != 'true' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'mpatlas-monthly')
        with:
          name: ci-image-mpatlas-monthly-attempt${{ github.run_attempt }}
          compression-level: 1
          path: ${{ runner.temp }}/ci-results/production-images/images/mpatlas-monthly.docker.tar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}
      - name: Retain tested eamlis-monthly image
        uses: actions/upload-artifact@v4
        id: retained-eamlis-monthly
        if: steps.reuse.outputs.reused != 'true' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'eamlis-monthly')
        with:
          name: ci-image-eamlis-monthly-attempt${{ github.run_attempt }}
          compression-level: 1
          path: ${{ runner.temp }}/ci-results/production-images/images/eamlis-monthly.docker.tar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}
      - name: Retain tested wdpa-monthly image
        uses: actions/upload-artifact@v4
        id: retained-wdpa-monthly
        if: steps.reuse.outputs.reused != 'true' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'wdpa-monthly')
        with:
          name: ci-image-wdpa-monthly-attempt${{ github.run_attempt }}
          compression-level: 1
          path: ${{ runner.temp }}/ci-results/production-images/images/wdpa-monthly.docker.tar
          if-no-files-found: error
          retention-days: 14
      - name: Retain tested sea-ice-daily image
        uses: actions/upload-artifact@v4
        id: retained-sea-ice-daily
        if: steps.reuse.outputs.reused != 'true' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'sea-ice-daily')
        with:
          name: ci-image-sea-ice-daily-attempt${{ github.run_attempt }}
          compression-level: 1
          path: ${{ runner.temp }}/ci-results/production-images/images/sea-ice-daily.docker.tar
          if-no-files-found: error
          retention-days: 14
      - name: Retain tested catalog-viewer image
        uses: actions/upload-artifact@v4
        id: retained-catalog-viewer
        if: steps.reuse.outputs.reused != 'true' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'catalog-viewer')
        with:
          name: ci-image-catalog-viewer-attempt${{ github.run_attempt }}
          compression-level: 1
          path: ${{ runner.temp }}/ci-results/production-images/images/catalog-viewer.docker.tar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}
      - name: Retain tested dataset-usage image
        uses: actions/upload-artifact@v4
        id: retained-dataset-usage
        if: steps.reuse.outputs.reused != 'true' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'dataset-usage')
        with:
          name: ci-image-dataset-usage-attempt${{ github.run_attempt }}
          compression-level: 1
          path: ${{ runner.temp }}/ci-results/production-images/images/dataset-usage.docker.tar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}
      - name: Retain tested monitoring-slack image
        uses: actions/upload-artifact@v4
        id: retained-monitoring-slack
        if: steps.reuse.outputs.reused != 'true' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'monitoring-slack')
        with:
          name: ci-image-monitoring-slack-attempt${{ github.run_attempt }}
          compression-level: 1
          path: ${{ runner.temp }}/ci-results/production-images/images/monitoring-slack.docker.tar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-production-images-attempt${{ github.run_attempt }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/ci-results/production-images
            !${{ runner.temp }}/ci-results/production-images/images/*.docker.tar
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}
      - name: Retain full-bundle benchmark baseline
        if: needs.geospatial-changes.outputs.image_handoff_benchmark == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-full-images-attempt${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/ci-results/production-images
          if-no-files-found: error
          retention-days: 14
      - name: Retain compression-zero benchmark image
        if: needs.geospatial-changes.outputs.image_handoff_benchmark == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-image-mpatlas-level0-attempt${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/ci-results/production-images/images/mpatlas-monthly.docker.tar
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: >-
          ${{ always() && steps.retained-results.outcome == 'success' &&
            (steps.reuse.outputs.reused == 'true' || (
            (!contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'mpatlas-monthly') || steps.retained-mpatlas-monthly.outcome == 'success') &&
            (!contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'eamlis-monthly') || steps.retained-eamlis-monthly.outcome == 'success') &&
            (!contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'wdpa-monthly') || steps.retained-wdpa-monthly.outcome == 'success') &&
            (!contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'sea-ice-daily') || steps.retained-sea-ice-daily.outcome == 'success') &&
            (!contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'catalog-viewer') || steps.retained-catalog-viewer.outcome == 'success') &&
            (!contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'dataset-usage') || steps.retained-dataset-usage.outcome == 'success') &&
            (!contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'monitoring-slack') || steps.retained-monitoring-slack.outcome == 'success'))) }}
        with:
          name: ci-gate-result-production-images-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/production-images/result.json
          if-no-files-found: error
          retention-days: 14

  image-handoff-benchmark:
    needs: [geospatial-changes, production-images]
    if: needs.geospatial-changes.outputs.image_handoff_benchmark == 'true' && needs.production-images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Compare exact-byte image artifact handoffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/benchmark_image_handoff.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --sha "$GITHUB_SHA" \
            --baseline-ref 7bcded0ac55cebc67889321f11782895ffd729f0 \
            --output "$RUNNER_TEMP/image-handoff-benchmark"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-handoff-benchmark-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-handoff-benchmark
          if-no-files-found: error
          retention-days: 14

  sdk-validation:
    name: sdk-validation (Node ${{ matrix.node }})
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
        with:
          node: ${{ matrix.node }}
          binaries: gitleaks
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run shared SDK version, runtime and packed consumer validation
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite "sdk-node${{ matrix.node }}" --output "$RUNNER_TEMP/ci-results/sdk-node${{ matrix.node }}"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-sdk-node${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node${{ matrix.node }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-sdk-node${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node${{ matrix.node }}/result.json
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Reuse verified PR browser validation
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_preflight.py reuse-suite --plan "$RUNNER_TEMP/ci-plans"
          --suite browser --output "$RUNNER_TEMP/ci-results/browser" --github-output "$GITHUB_OUTPUT"
      - uses: ./.github/actions/ci-tools
        if: steps.reuse.outputs.reused != 'true'
        with:
          binaries: gitleaks
      - name: Run shared real-browser validation
        if: steps.reuse.outputs.reused != 'true'
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite browser --output "$RUNNER_TEMP/ci-results/browser"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-browser-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/browser
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-browser-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/browser/result.json
          if-no-files-found: error
          retention-days: 14

  ci-ready:
    name: ci-ready
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: always()
    needs: [geospatial-changes, lint, tests, geospatial-integration, production-images, sdk-validation, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested_sha: ${{ needs.geospatial-changes.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-gate-result-*
          path: ${{ runner.temp }}/ci-results
      - name: Require every selected suite and matrix entry
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"ci-jobs.json").write_text(os.environ["JOB_RESULTS"])'
          python scripts/ci_preflight.py verify --plan "$RUNNER_TEMP/ci-plans" \
            --results "$RUNNER_TEMP/ci-results" --jobs "$RUNNER_TEMP/ci-jobs.json" \
            --output "$RUNNER_TEMP/ci-ready/evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-ready-evidence-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ready/evidence.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 14 }}

  # Post-gate callers check selection and prerequisite results explicitly.
  # Explicit status avoids implicit success() over skipped optional ancestors.
  dataset-mutation-selection:
    needs: ci-ready
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.discover.outputs.pr_numbers }}
      has_mutations: ${{ steps.discover.outputs.has_mutations }}
      has_catalog_changes: ${{ steps.catalog.outputs.should_deploy }}
      has_repo_alert: ${{ steps.repo_alert_selection.outputs.has_repo_alert }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enumerate immutable merged mutation plans
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_mutation_authorization.py discover
      - name: Select reviewed catalog changes without duplicating publication refresh
        if: ${{ steps.discover.outputs.has_mutations == 'false' }}
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/catalog_web_changes.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.8'
      - name: Sync pinned announcement parser dependencies
        run: uv sync --locked --no-dev
      - name: Inspect every commit for repository announcements
        id: repo_alert_selection
        env:
          BASE_SHA: ${{ github.event.before }}
        run: uv run --no-sync python scripts/repo_alerts.py select-from-git-range --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  refresh-reviewed-catalog:
    needs: [ci-ready, dataset-mutation-selection, geospatial-changes, pmtiles-cdn]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.dataset-mutation-selection.result == 'success' && needs.dataset-mutation-selection.outputs.has_catalog_changes == 'true' && (needs.geospatial-changes.outputs.pmtiles_cdn != 'true' || needs.pmtiles-cdn.result == 'success') }}
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/catalog-web-deploy.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      authorization_artifact_id: ""
      authorization_sha256: ""
      pr_number: 0
      mutation_completed: false
    secrets: inherit

  announce-repo-functionality:
    needs: [ci-ready, dataset-mutation-selection]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.dataset-mutation-selection.outputs.has_repo_alert == 'true' && needs.dataset-mutation-selection.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/repo-functionality-alert.yml
    with:
      base_sha: ${{ github.event.before }}
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
    secrets: inherit

  publish-reviewed-dataset:
    name: "Publish PR #${{ matrix.pr_number }}"
    needs: [ci-ready, dataset-mutation-selection, geospatial-changes, pmtiles-cdn]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.dataset-mutation-selection.outputs.has_mutations == 'true' && (needs.geospatial-changes.outputs.pmtiles_cdn != 'true' || needs.pmtiles-cdn.result == 'success') && needs.dataset-mutation-selection.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr_number: ${{ fromJSON(needs.dataset-mutation-selection.outputs.pr_numbers) }}
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-dataset.yml
    with:
      pr_number: ${{ matrix.pr_number }}
      executor_sha: ${{ github.sha }}
    secrets: inherit

