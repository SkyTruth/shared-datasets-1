name: CI / Validate and deliver
run-name: "${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft CI' || 'CI' }} / ${{ github.event.pull_request.title || github.event.head_commit.message || github.sha }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel the entire obsolete PR graph. Main runs retain their deployment bytes
# and dispatch runs retain their requested diagnostics, each in a unique group.
concurrency:
  group: ci-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12.12"
  NODE_VERSION: "22.12.0"
  TERRAFORM_VERSION: "1.8.5"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  geospatial-changes:
    name: geospatial-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pr_terraform: ${{ steps.pr-plan.outputs.pr_terraform }}
      should_run: ${{ steps.plan.outputs.should_run }}
      sdk: ${{ steps.plan.outputs.sdk-node22 }}
      browser: ${{ steps.plan.outputs.browser }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      production_images: ${{ steps.plan.outputs.production-images }}
      production_image_groups: ${{ steps.plan.outputs.production-image-groups }}
      deploy_image_targets: ${{ steps.plan.outputs.deploy-image-targets }}
      production_image_targets: ${{ steps.plan.outputs.production-image-targets }}
    steps:
      # Two failed required checks block this SHA without allocating suite runners.
      - &reject-draft
        name: Require a ready PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Full CI requires a ready PR. Mark ready for review to start a fresh run."
          exit 1
      - &validation-checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - &validation-python
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.8'
          python-version: '3.12.12'
          enable-cache: true
      - name: Check publication runtime before validation fanout
        run: python scripts/publication_runtime_check.py
      - name: Select validation for the tested merge tree
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run --frozen --only-group ci-plan python scripts/ci_preflight.py plan --base "$BASE_SHA" --head "$GITHUB_SHA" --source-head "$SOURCE_HEAD" \
            --output "$RUNNER_TEMP/ci-plan/plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Select live PR Terraform check
        id: pr-plan
        run: uv run --frozen --only-group ci-plan python scripts/pr_terraform_plan.py select --plan "$RUNNER_TEMP/ci-plan/plan.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-validation-plan-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan/plan.json
          if-no-files-found: error
          retention-days: 14

  lint:
    needs: geospatial-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *validation-checkout
      - uses: ./.github/actions/ci-tools
      - &validation-plan
        uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run selected lint checks
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite lint --output "$RUNNER_TEMP/ci-results/lint"
      - &retained-validation-results
        uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-${{ github.job }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/${{ github.job }}
          if-no-files-found: error
          retention-days: 14
      - &compact-gate-result
        name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-${{ github.job }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/${{ github.job }}/result.json
          if-no-files-found: error
          retention-days: 14

  tests: &python-tests
    needs: geospatial-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *validation-checkout
      - uses: ./.github/actions/ci-tools
        with:
          binaries: gitleaks terraform
      - *validation-plan
      - name: Run selected secret, guardrail and Python checks
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite "$GITHUB_JOB" --output "$RUNNER_TEMP/ci-results/$GITHUB_JOB"
      - *retained-validation-results
      - *compact-gate-result

  tests-control-plane: *python-tests

  geospatial-integration:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: &validation-permissions
      contents: read
      actions: read
      pull-requests: read
    steps:
      - *validation-checkout
      - *validation-plan
      - uses: docker/setup-buildx-action@v3
      - name: Build geospatial CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/geospatial-ci.Dockerfile
          tags: shared-datasets-geospatial-ci:local
          load: true
          cache-from: type=gha,scope=geospatial-ci
          cache-to: type=gha,mode=max,scope=geospatial-ci,ignore-error=true
      - name: Run shared native validation
        run: |
          mkdir -p "$RUNNER_TEMP/ci-results/geospatial-integration"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" -v "$RUNNER_TEMP:/evidence" -w /workspace \
            -e UV_CACHE_DIR=/opt/uv-cache -e UV_LINK_MODE=copy \
            -e UV_PROJECT_ENVIRONMENT=/evidence/native-venv \
            -e SHARED_DATASETS_WORKDIR=/evidence/shared-datasets-1 \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            shared-datasets-geospatial-ci:local python scripts/ci_preflight.py run-suite \
            --plan /evidence/ci-plans --suite geospatial-integration \
            --output /evidence/ci-results/geospatial-integration
      - *retained-validation-results
      - *compact-gate-result

  production-images:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.production_images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: *validation-permissions
    name: production-images (${{ matrix.group }})
    strategy:
      fail-fast: true
      matrix:
        group: ${{ fromJSON(needs.geospatial-changes.outputs.production_image_groups) }}
    steps:
      - *validation-checkout
      - *validation-plan
      - *validation-python
      - uses: docker/setup-buildx-action@v3
      - name: Expose the ephemeral Actions cache runtime
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Test the actual production image recipes
        env:
          SHARED_DATASETS_GITHUB_IMAGE_CACHE: "true"
          IMAGE_GROUP: ${{ matrix.group }}
        run: uv run --no-project --python 3.12.12 python scripts/ci_preflight.py run-image-group --plan "$RUNNER_TEMP/ci-plans" --group "$IMAGE_GROUP" --output "$RUNNER_TEMP/ci-results/production-images"
      - uses: ./.github/actions/ci-image-result
        if: ${{ always() && matrix.group == 'short' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'dataset-usage') }}
        with:
          target: dataset-usage
          retain-image: ${{ github.event_name == 'push' && contains(fromJSON(needs.geospatial-changes.outputs.deploy_image_targets), 'dataset-usage') }}
      - uses: ./.github/actions/ci-image-result
        if: ${{ always() && matrix.group == 'short' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'monitoring-slack') }}
        with:
          target: monitoring-slack
          retain-image: ${{ github.event_name == 'push' && contains(fromJSON(needs.geospatial-changes.outputs.deploy_image_targets), 'monitoring-slack') }}
      - uses: ./.github/actions/ci-image-result
        if: ${{ always() && matrix.group == 'short' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'catalog-viewer') }}
        with:
          target: catalog-viewer
          retain-image: ${{ github.event_name == 'push' && contains(fromJSON(needs.geospatial-changes.outputs.deploy_image_targets), 'catalog-viewer') }}
      - uses: ./.github/actions/ci-image-result
        if: ${{ always() && matrix.group == 'short' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'eamlis-monthly') }}
        with:
          target: eamlis-monthly
          retain-image: ${{ github.event_name == 'push' && contains(fromJSON(needs.geospatial-changes.outputs.deploy_image_targets), 'eamlis-monthly') }}
      - uses: ./.github/actions/ci-image-result
        if: ${{ always() && matrix.group == 'short' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'sea-ice-daily') }}
        with:
          target: sea-ice-daily
          retain-image: ${{ github.event_name == 'push' && contains(fromJSON(needs.geospatial-changes.outputs.deploy_image_targets), 'sea-ice-daily') }}
      - uses: ./.github/actions/ci-image-result
        if: ${{ always() && matrix.group == 'short' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'mpatlas-monthly') }}
        with:
          target: mpatlas-monthly
          retain-image: ${{ github.event_name == 'push' && contains(fromJSON(needs.geospatial-changes.outputs.deploy_image_targets), 'mpatlas-monthly') }}
      - uses: ./.github/actions/ci-image-result
        if: ${{ always() && matrix.group == 'wdpa' && contains(fromJSON(needs.geospatial-changes.outputs.production_image_targets), 'wdpa-monthly') }}
        with:
          target: wdpa-monthly
          retain-image: ${{ github.event_name == 'push' && contains(fromJSON(needs.geospatial-changes.outputs.deploy_image_targets), 'wdpa-monthly') }}

  sdk-validation:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *validation-checkout
      - *validation-plan
      - uses: ./.github/actions/ci-tools
        id: sdk-tools
        with:
          node: '22'
          binaries: gitleaks
      - name: Validate SDK on Node 22
        id: sdk-node22
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite sdk-node22 --output "$RUNNER_TEMP/ci-results/sdk-node22"
      - uses: actions/upload-artifact@v4
        id: retained-results-22
        if: ${{ always() && steps.sdk-node22.outcome != 'skipped' }}
        with:
          name: ci-result-sdk-node22-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node22
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact Node 22 gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results-22.outcome == 'success' }}
        with:
          name: ci-gate-result-sdk-node22-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node22/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Install Node 24
        id: node24
        if: ${{ !cancelled() && steps.sdk-tools.outcome == 'success' }}
        run: |
          python scripts/ci_install_tools.py --destination "$RUNNER_TEMP/ci-tools" node24
          echo "CI_NODE24_BIN=$RUNNER_TEMP/ci-tools/node24/bin" >> "$GITHUB_ENV"
      - name: Validate SDK on Node 24
        id: sdk-node24
        if: ${{ !cancelled() && steps.node24.outcome == 'success' }}
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite sdk-node24 --output "$RUNNER_TEMP/ci-results/sdk-node24"
      - uses: actions/upload-artifact@v4
        id: retained-results-24
        if: ${{ always() && steps.sdk-node24.outcome != 'skipped' }}
        with:
          name: ci-result-sdk-node24-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node24
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact Node 24 gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results-24.outcome == 'success' }}
        with:
          name: ci-gate-result-sdk-node24-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node24/result.json
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: *validation-permissions
    steps:
      - *validation-checkout
      - *validation-plan
      - uses: ./.github/actions/ci-tools
        with:
          binaries: gitleaks
      - name: Run shared real-browser validation
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite browser --output "$RUNNER_TEMP/ci-results/browser"
      - *retained-validation-results
      - *compact-gate-result

  pr-terraform-plan:
    needs: geospatial-changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.geospatial-changes.outputs.pr_terraform == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pr-terraform-plan.yml

  ci-ready:
    name: ci-ready
    permissions: *validation-permissions
    if: always()
    needs: [geospatial-changes, lint, tests, tests-control-plane, geospatial-integration, production-images, sdk-validation, browser, pr-terraform-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested_sha: ${{ needs.geospatial-changes.outputs.tested_sha }}
      delivery: ${{ job.status == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verify.outputs.delivery || '{}' }}
    steps:
      - *reject-draft
      - *validation-checkout
      - *validation-python
      - *validation-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-gate-result-*
          path: ${{ runner.temp }}/ci-results
      - name: Owner approval of this exact head required before merge
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'jonaraphael' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXECUTOR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          selected="$(jq -sr 'any(.[]; .deployments | length > 0)' "$RUNNER_TEMP"/ci-plans/*/plan.json)"
          if [[ "$selected" == true ]]; then
            python -I -S scripts/deployment_revision.py accept --pr-number "$PR_NUMBER"
          fi
      - name: Require selected same-repo Terraform plan
        env:
          REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.geospatial-changes.outputs.pr_terraform == 'true' }}
          RESULT: ${{ needs.pr-terraform-plan.result }}
        run: '[[ "$REQUIRED" != "true" || "$RESULT" == "success" ]]'
      - name: Require every selected suite and matrix entry
        id: verify
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"ci-jobs.json").write_text(os.environ["JOB_RESULTS"])'
          python scripts/ci_preflight.py verify --plan "$RUNNER_TEMP/ci-plans" \
            --results "$RUNNER_TEMP/ci-results" --jobs "$RUNNER_TEMP/ci-jobs.json" \
            --output "$RUNNER_TEMP/ci-ready/evidence.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-ready-evidence-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ready/evidence.json
          if-no-files-found: error
          retention-days: 14

  typescript-sdk:
    needs: ci-ready
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').typescript-sdk }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch top-level npm trusted publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXECUTOR_SHA: ${{ needs.ci-ready.outputs.tested_sha }}
        run: |
          gh workflow run publish-typescript-sdk.yml --ref main \
            -f executor_sha="$EXECUTOR_SHA" -f source_run_id="$GITHUB_RUN_ID" \
            -f source_run_attempt="$GITHUB_RUN_ATTEMPT"

  dataset-mutation-selection:
    needs: ci-ready
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').dataset-mutation-selection }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.discover.outputs.pr_numbers }}
      has_mutations: ${{ steps.discover.outputs.has_mutations }}
      has_catalog_changes: ${{ steps.catalog.outputs.should_deploy }}
      has_repo_alert: ${{ steps.repo_alert_selection.outputs.has_repo_alert }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enumerate immutable merged mutation plans
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_mutation_authorization.py discover
      - name: Select reviewed catalog changes without duplicating publication refresh
        if: ${{ steps.discover.outputs.has_mutations == 'false' }}
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/catalog_web_changes.py
      - *validation-python
      - name: Inspect every commit for repository announcements
        id: repo_alert_selection
        env:
          BASE_SHA: ${{ github.event.before }}
        run: uv run --frozen --no-dev python scripts/repo_alerts.py select-from-git-range --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  refresh-reviewed-catalog:
    needs: [ci-ready, dataset-mutation-selection, pmtiles-cdn, artifact-registry-iam]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').refresh-reviewed-catalog && needs.dataset-mutation-selection.outputs.has_catalog_changes == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/catalog-web-deploy.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      authorization_artifact_id: ""
      authorization_sha256: ""
      pr_number: 0
      mutation_completed: false
    secrets: inherit

  announce-repo-functionality:
    needs: [ci-ready, dataset-mutation-selection]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').announce-repo-functionality && needs.dataset-mutation-selection.outputs.has_repo_alert == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/repo-functionality-alert.yml
    with:
      base_sha: ${{ github.event.before }}
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
    secrets: inherit

  publish-reviewed-dataset:
    name: "Publish PR #${{ matrix.pr_number }}"
    needs: [ci-ready, dataset-mutation-selection, pmtiles-cdn, artifact-registry-iam]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').publish-reviewed-dataset && needs.dataset-mutation-selection.outputs.has_mutations == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr_number: ${{ fromJSON(needs.dataset-mutation-selection.outputs.pr_numbers) }}
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-dataset.yml
    with:
      pr_number: ${{ matrix.pr_number }}
      executor_sha: ${{ github.sha }}
    secrets: inherit

  ingestion-iam:
    needs: ci-ready
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').ingestion-iam }}
    permissions: &terraform-permissions
      contents: read
      actions: read
      pull-requests: read
      deployments: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/scheduled-ingestion-deploy-iam-sync.yml
    with: &deployment-source
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}

  mpatlas:
    needs: &ingestion-prerequisites [ci-ready, ingestion-iam, artifact-registry-iam, cron-alert-policy]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').mpatlas }}
    permissions: &deployment-permissions
      contents: read
      actions: read
      pull-requests: read
      deployments: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/mpatlas-monthly-deploy.yml
    with: *deployment-source
    secrets: inherit

  eamlis:
    needs: *ingestion-prerequisites
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').eamlis }}
    permissions: *deployment-permissions
    uses: ./.github/workflows/eamlis-monthly-deploy.yml
    with: *deployment-source
    secrets: inherit

  wdpa:
    needs: *ingestion-prerequisites
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').wdpa }}
    permissions: *deployment-permissions
    uses: ./.github/workflows/wdpa-monthly-deploy.yml
    with: *deployment-source
    secrets: inherit

  sea-ice:
    needs: *ingestion-prerequisites
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').sea-ice }}
    permissions: *terraform-permissions
    uses: ./.github/workflows/sea-ice-daily-deploy.yml
    with: *deployment-source
    secrets: inherit

  pmtiles-cdn:
    needs: [ci-ready, artifact-registry-iam]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').pmtiles-cdn }}
    permissions: *terraform-permissions
    uses: ./.github/workflows/pmtiles-cdn-sync.yml
    with: *deployment-source
    secrets: inherit

  dataset-usage:
    # Settle bucket CORS before the logging-only deployment plans the same bucket.
    needs: [ci-ready, artifact-registry-iam, catalog-viewer, pmtiles-cdn]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').dataset-usage }}
    permissions: *deployment-permissions
    uses: ./.github/workflows/dataset-usage-deploy.yml
    with: &deployment-source-with-iam
      sync_iam: ${{ fromJSON(needs.ci-ready.outputs.delivery).artifact-registry-iam }}
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit

  catalog-viewer:
    needs: [ci-ready, artifact-registry-iam]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').catalog-viewer }}
    permissions: *deployment-permissions
    uses: ./.github/workflows/catalog-viewer-deploy.yml
    with: *deployment-source-with-iam
    secrets: inherit

  artifact-registry-iam:
    needs: ci-ready
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').artifact-registry-iam }}
    permissions: *terraform-permissions
    uses: ./.github/workflows/artifact-registry-iam-sync.yml
    with: *deployment-source

  preview-terraform-iam:
    needs: [ci-ready, artifact-registry-iam]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').preview-terraform-iam }}
    permissions: *terraform-permissions
    uses: ./.github/workflows/preview-terraform-iam-sync.yml
    with: *deployment-source

  scratch-cleanup-iam:
    needs: ci-ready
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').scratch-cleanup-iam }}
    permissions: *terraform-permissions
    uses: ./.github/workflows/scratch-cleanup-iam-sync.yml
    with: *deployment-source

  cron-alert-policy:
    needs: [ci-ready, ingestion-iam, artifact-registry-iam]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').cron-alert-policy }}
    permissions: *terraform-permissions
    uses: ./.github/workflows/cron-alert-policy-sync.yml
    with: *deployment-source-with-iam
    secrets: inherit

  identity-decision-reconcile:
    needs: [ci-ready, ingestion-iam, artifact-registry-iam, cron-alert-policy]
    if: ${{ !cancelled() && !failure() && !contains(needs.*.result, 'cancelled') && fromJSON(needs.ci-ready.outputs.delivery || '{}').identity-decision-reconcile }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/identity-decision-reconcile.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit
