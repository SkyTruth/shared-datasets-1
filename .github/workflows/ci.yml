name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      wdpa_build_smoke:
        description: Test the build image with small fixtures and the deterministic sample only
        type: boolean
        default: false
      wdpa_full_benchmark:
        description: Run small sea-ice smoke first, then marine WDPA without publication
        type: boolean
        default: false
      wdpa_benchmark_fraction:
        description: Use 1 for complete acceptance; 0.001 is a short diagnostic probe only
        type: choice
        options: ["1", "0.001"]
        default: "1"
      wdpa_inputs_probe:
        description: Measure input preparation only; cannot satisfy acceptance
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12.12"
  NODE_VERSION: "22.12.0"
  TERRAFORM_VERSION: "1.8.5"

jobs:
  wdpa-benchmark-capacity:
    if: github.event_name == 'workflow_dispatch' && !inputs.wdpa_full_benchmark && !inputs.wdpa_build_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure host capacity
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          disks = {}
          for path in ('/', '/mnt', os.environ['RUNNER_TEMP']):
              stat = os.statvfs(path)
              disks[path] = {'total_bytes': stat.f_blocks * stat.f_frsize, 'free_bytes': stat.f_bavail * stat.f_frsize}
          print(json.dumps({'cpu_count': os.cpu_count(), 'memory_bytes': int(memory['MemTotal'].split()[0]) * 1024, 'disks': disks}, sort_keys=True))
          PY
      - name: Check constrained-container telemetry
        run: |
          docker run --rm --cpus=4 --memory=8g --memory-swap=8g \
            python:3.12-slim-bookworm python -c \
            'import json; from pathlib import Path; root=Path("/sys/fs/cgroup"); print(json.dumps({name:(root/name).read_text().strip() if (root/name).exists() else None for name in ("cpu.max","memory.max","memory.peak")},sort_keys=True))'

  wdpa-benchmark-image:
    if: github.event_name == 'workflow_dispatch' && (inputs.wdpa_full_benchmark || inputs.wdpa_build_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build the deployment image once
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wdpa-image"
          docker buildx build --load --platform linux/amd64 \
            --build-arg SHARED_DATASETS_EXECUTOR_SHA="$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/wdpa-image/image.json" \
            -f ingestion/wdpa_monthly/Dockerfile -t wdpa-processing-benchmark:local .
          docker save wdpa-processing-benchmark:local | gzip -1 > "$RUNNER_TEMP/wdpa-image/image.tar.gz"
      - name: Share the deployment image with staged checks
        uses: actions/upload-artifact@v4
        with:
          name: wdpa-benchmark-image
          path: ${{ runner.temp }}/wdpa-image/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  wdpa-small-smoke:
    needs: wdpa-benchmark-image
    if: github.event_name == 'workflow_dispatch' && (inputs.wdpa_full_benchmark || inputs.wdpa_build_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested image verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the shared deployment image
        uses: actions/download-artifact@v4
        with:
          name: wdpa-benchmark-image
          path: ${{ runner.temp }}/wdpa-image
      - name: Verify image and run the small sea-ice production path
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/wdpa-image/image.tar.gz" | docker load
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.config.digest"])' "$RUNNER_TEMP/wdpa-image/image.json")"
          python3 -c 'import os, sys; from scripts.tested_image_bundle import verify_local_config; verify_local_config("wdpa-processing-benchmark:local", sys.argv[1], directory=os.environ["RUNNER_TEMP"])' "$expected"
          mkdir -p "$RUNNER_TEMP/wdpa-small"
          mkdir -p "$RUNNER_TEMP/wdpa-small/shared-datasets-1"
          cp "$RUNNER_TEMP/wdpa-image/image.json" "$RUNNER_TEMP/wdpa-small/shared-datasets-1/image.json"
          docker run --name wdpa-small --cpus=4 --memory=8g --memory-swap=8g \
            -e CLOUD_RUN_EXECUTION=wdpa-small \
            -v "$RUNNER_TEMP/wdpa-small:/work" wdpa-processing-benchmark:local \
            python scripts/local_ingestion_smoke.py --workdir /work/shared-datasets-1/small
      - name: Upload small-fixture measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdpa-small-smoke-report
          path: |
            ${{ runner.temp }}/wdpa-small/shared-datasets-1/small/benchmark.json
            ${{ runner.temp }}/wdpa-small/shared-datasets-1/image.json
          if-no-files-found: ignore
          retention-days: 30

  wdpa-full-benchmark:
    needs: [wdpa-benchmark-image, wdpa-small-smoke]
    if: github.event_name == 'workflow_dispatch' && (inputs.wdpa_full_benchmark || inputs.wdpa_build_smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      WDPA_BENCHMARK_REPLAY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare disposable benchmark host
        run: |
          set -euo pipefail
          # These are unused preinstalled tools on this job's disposable VM.
          # Each CI job has its own VM; no other job or user workspace is affected.
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift /opt/swift /usr/lib/jvm /usr/local/share/chromium /usr/local/share/boost /usr/local/share/vcpkg; do
            if [[ -e "$path" ]]; then sudo du -sh "$path"; sudo rm -rf "$path"; fi
          done
          df -h /
          mkdir -p "$RUNNER_TEMP/wdpa-reports"
      - name: Download reviewed public frozen inputs without credentials
        run: |
          python3 scripts/download_public_wdpa_benchmark.py \
            --recipe docs/wdpa-processing-public-inputs.json \
            --out "$RUNNER_TEMP/wdpa-inputs"
      - name: Download the shared deployment image
        uses: actions/download-artifact@v4
        with:
          name: wdpa-benchmark-image
          path: ${{ runner.temp }}/wdpa-image
      - name: Load and verify the identical deployment image
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/wdpa-image/image.tar.gz" | docker load
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.config.digest"])' "$RUNNER_TEMP/wdpa-image/image.json")"
          python3 -c 'import os, sys; from scripts.tested_image_bundle import verify_local_config; verify_local_config("wdpa-processing-benchmark:local", sys.argv[1], directory=os.environ["RUNNER_TEMP"])' "$expected"
          cp "$RUNNER_TEMP/wdpa-image/image.json" "$RUNNER_TEMP/wdpa-reports/image.json"
          rm "$RUNNER_TEMP/wdpa-image/image.tar.gz"
      - name: Provision a 100 GiB disk scratch filesystem
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          s = os.statvfs(os.environ['RUNNER_TEMP'])
          available = s.f_bavail * s.f_frsize
          print({'host_free_bytes_before_disk': available}, flush=True)
          if available < 105 * 1024**3:
              raise SystemExit('Insufficient host storage for a 100 GiB disk; resource target must not be reduced')
          PY
          sudo fallocate -l 100G "$RUNNER_TEMP/wdpa-scratch.ext4"
          device="$(sudo losetup --find --show --direct-io=on "$RUNNER_TEMP/wdpa-scratch.ext4")"
          echo "WDPA_SCRATCH_DEVICE=$device" >> "$GITHUB_ENV"
          sudo mkfs.ext4 -q -m 0 -E lazy_itable_init=0,lazy_journal_init=0 "$device"
          sudo mkdir -p /work
          sudo mount "$device" /work
          sudo chmod 0777 /work
          df -h /work
      - name: Compare deterministic October sample with the old processing path
        if: ${{ !inputs.wdpa_inputs_probe }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=120s 60m docker run --name wdpa-compatibility \
            --cpus=4 --memory=8g --memory-swap=8g \
            -e CLOUD_RUN_EXECUTION=wdpa-compatibility \
            -v /work:/work -v "$RUNNER_TEMP/wdpa-inputs:/inputs:ro" \
            wdpa-processing-benchmark:local python scripts/local_wdpa_sample.py \
              --source /inputs/WDPA_WDOECM_Oct2026_Public_all_shp.zip \
              --baselines /inputs/frozen-inputs \
              --translation-sources /inputs/frozen-inputs/translation-sources.json \
              --workdir /work/shared-datasets-1/compatibility --run-date 2026-10-01 \
              --fraction 0.001 --seed 7919 --compare-legacy
          cp /work/shared-datasets-1/compatibility/benchmark.json "$RUNNER_TEMP/wdpa-reports/compatibility.json"
          # This job owns the disposable sample directory; retain its raw report
          # before freeing this disposable scratch directory.
          sudo rm -rf /work/shared-datasets-1/compatibility
          docker rm wdpa-compatibility
      - name: Run marine WDPA with 4 CPU and 8 GiB
        if: ${{ !inputs.wdpa_inputs_probe && !inputs.wdpa_build_smoke }}
        env:
          WDPA_BENCHMARK_FRACTION: ${{ inputs.wdpa_benchmark_fraction || '1' }}
        run: |
          set -euo pipefail
          echo "Starting October replay $WDPA_BENCHMARK_REPLAY (fraction $WDPA_BENCHMARK_FRACTION)"
          # Each replay gets a fresh VM, disk and cgroup, with the identical image.
          # Leave time to retain diagnostics before the hosted job's six-hour limit.
          timeout --signal=TERM --kill-after=120s 330m docker run --name wdpa-replay \
            --cpus=4 --memory=8g --memory-swap=8g \
            -e CLOUD_RUN_EXECUTION=wdpa-benchmark \
            -v /work:/work \
            -v "$RUNNER_TEMP/wdpa-inputs:/inputs:ro" \
            wdpa-processing-benchmark:local \
            python scripts/local_wdpa_sample.py \
              --source /inputs/WDPA_WDOECM_Oct2026_Public_all_shp.zip \
              --baselines /inputs/frozen-inputs \
              --translation-sources /inputs/frozen-inputs/translation-sources.json \
              --workdir /work/shared-datasets-1/replay --run-date 2026-10-01 \
              --asset wdpa-marine \
              --fraction "$WDPA_BENCHMARK_FRACTION"
          cp /work/shared-datasets-1/replay/benchmark.json "$RUNNER_TEMP/wdpa-reports/replay-$WDPA_BENCHMARK_REPLAY.json"
          docker inspect wdpa-replay --format '{{json .State}}' > "$RUNNER_TEMP/wdpa-reports/container-$WDPA_BENCHMARK_REPLAY.json"
          docker rm wdpa-replay
      - name: Measure input preparation only
        if: ${{ inputs.wdpa_inputs_probe }}
        run: |
          docker run --name wdpa-replay --cpus=4 --memory=8g --memory-swap=8g \
            -e CLOUD_RUN_EXECUTION=wdpa-benchmark -v /work:/work \
            -v "$PWD/scripts/wdpa_input_memory_probe.py:/app/scripts/wdpa_input_memory_probe.py:ro" \
            -v "$RUNNER_TEMP/wdpa-inputs:/inputs:ro" wdpa-processing-benchmark:local \
            python scripts/wdpa_input_memory_probe.py \
              --source /inputs/WDPA_WDOECM_Oct2026_Public_all_shp.zip \
              --baselines /inputs/frozen-inputs --workdir /work/shared-datasets-1/replay
          cp /work/shared-datasets-1/replay/benchmark.json "$RUNNER_TEMP/wdpa-reports/input-probe.json"
          docker inspect wdpa-replay --format '{{json .State}}' > "$RUNNER_TEMP/wdpa-reports/container-probe.json"
          docker rm wdpa-replay
      - name: Retain report if a replay failed
        if: failure() || cancelled()
        run: |
          if [[ -f /work/shared-datasets-1/compatibility/benchmark.json ]]; then
            cp /work/shared-datasets-1/compatibility/benchmark.json "$RUNNER_TEMP/wdpa-reports/failed-compatibility.json"
          fi
          if docker inspect wdpa-compatibility >/dev/null 2>&1; then
            docker stop --time=120 wdpa-compatibility || true
            docker logs wdpa-compatibility > "$RUNNER_TEMP/wdpa-reports/compatibility.log" 2>&1
            docker inspect wdpa-compatibility --format '{{json .State}}' > "$RUNNER_TEMP/wdpa-reports/compatibility-container.json"
          fi
          if docker inspect wdpa-replay >/dev/null 2>&1; then
            docker stop --time=120 wdpa-replay || true
            docker inspect wdpa-replay --format '{{json .State}}' > "$RUNNER_TEMP/wdpa-reports/container-$WDPA_BENCHMARK_REPLAY.json"
            python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          phases = []
          with subprocess.Popen(['docker', 'logs', 'wdpa-replay'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True) as process:
              for line in process.stdout:
                  try:
                      record = json.loads(line[line.index('{'):])
                  except ValueError:
                      continue
                  if isinstance(record, dict) and record.get('event') in {'wdpa_phase_started', 'wdpa_phase_resources'}:
                      phases.append(record)
              if process.wait() != 0:
                  raise SystemExit('Could not retain benchmark phase diagnostics')
          target = Path(os.environ['RUNNER_TEMP']) / 'wdpa-reports/partial-phases.json'
          target.write_text(json.dumps({'scope':'partial-not-acceptance', 'phases':phases}, indent=2)+'\n')
          PY
          fi
          if [[ -f /work/shared-datasets-1/replay/benchmark.json ]]; then
            cp /work/shared-datasets-1/replay/benchmark.json "$RUNNER_TEMP/wdpa-reports/failed-replay.json"
          fi
      - name: Upload measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.wdpa_build_smoke && 'wdpa-build-smoke-reports' || (inputs.wdpa_inputs_probe || inputs.wdpa_benchmark_fraction == '0.001') && 'wdpa-debug-benchmark-reports' || 'wdpa-marine-benchmark-reports' }}
          path: ${{ runner.temp }}/wdpa-reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Unmount disposable benchmark disk
        if: always()
        run: |
          sudo umount /work 2>/dev/null || true
          if [[ -n "${WDPA_SCRATCH_DEVICE:-}" ]]; then sudo losetup -d "$WDPA_SCRATCH_DEVICE"; fi

  geospatial-changes:
    concurrency:
      group: ci-validation-geospatial-changes-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: geospatial-changes
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      sdk: ${{ steps.plan.outputs.sdk-node22 }}
      browser: ${{ steps.plan.outputs.browser }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      production_images: ${{ steps.plan.outputs.production-images }}
      eamlis: ${{ steps.plan.outputs.eamlis }}
      wdpa: ${{ steps.plan.outputs.wdpa }}
      sea_ice: ${{ steps.plan.outputs.sea_ice }}
      wdpa_processing: ${{ steps.plan.outputs.wdpa_processing }}
      ingestion_iam: ${{ steps.plan.outputs.ingestion_iam }}
      pmtiles_cdn: ${{ steps.plan.outputs.pmtiles_cdn }}
      catalog_viewer: ${{ steps.plan.outputs.catalog_viewer }}
      dataset_usage: ${{ steps.plan.outputs.dataset_usage }}
      artifact_registry_iam: ${{ steps.plan.outputs.artifact_registry_iam }}
      preview_terraform_iam: ${{ steps.plan.outputs.preview_terraform_iam }}
      scratch_cleanup_iam: ${{ steps.plan.outputs.scratch_cleanup_iam }}
      cron_alert_policy: ${{ steps.plan.outputs.cron_alert_policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Select validation for the tested merge tree
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci_preflight.py plan --base "$BASE_SHA" --head "$GITHUB_SHA" --source-head "$SOURCE_HEAD" \
            --output "$RUNNER_TEMP/ci-plan/plan.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-validation-plan-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan/plan.json
          if-no-files-found: error
          retention-days: 14

  lint:
    concurrency:
      group: ci-validation-lint-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: geospatial-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run shared lint, workflow syntax and Terraform validation
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite lint --output "$RUNNER_TEMP/ci-results/lint"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-lint-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/lint
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-lint-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/lint/result.json
          if-no-files-found: error
          retention-days: 14

  tests:
    concurrency:
      group: ci-validation-tests-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: geospatial-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
        with:
          binaries: gitleaks
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run shared secret history, admission, guardrails and Python validation
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite tests --output "$RUNNER_TEMP/ci-results/tests"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-tests-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/tests
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-tests-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/tests/result.json
          if-no-files-found: error
          retention-days: 14

  geospatial-integration:
    concurrency:
      group: ci-validation-geospatial-integration-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - uses: docker/setup-buildx-action@v3
      - name: Build geospatial CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/geospatial-ci.Dockerfile
          tags: shared-datasets-geospatial-ci:local
          load: true
          cache-from: type=gha,scope=geospatial-ci
          cache-to: type=gha,mode=max,scope=geospatial-ci,ignore-error=true
      - name: Run shared native validation
        run: |
          mkdir -p "$RUNNER_TEMP/ci-results/geospatial-integration"
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/workspace" -v "$RUNNER_TEMP:/evidence" -w /workspace \
            -e UV_CACHE_DIR=/evidence/native-uv-cache -e UV_LINK_MODE=copy \
            -e UV_PROJECT_ENVIRONMENT=/evidence/native-venv \
            -e SHARED_DATASETS_WORKDIR=/evidence/shared-datasets-1 \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            shared-datasets-geospatial-ci:local python scripts/ci_preflight.py run-suite \
            --plan /evidence/ci-plans --suite geospatial-integration \
            --output /evidence/ci-results/geospatial-integration
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-geospatial-integration-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/geospatial-integration
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-geospatial-integration-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/geospatial-integration/result.json
          if-no-files-found: error
          retention-days: 14

  production-images:
    concurrency:
      group: ci-validation-production-images-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.production_images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Test the actual production image recipes
        run: python scripts/ci_preflight.py run-suite --plan "$(find "$RUNNER_TEMP/ci-plans" -name plan.json | sort -V | tail -1)" --suite production-images --output "$RUNNER_TEMP/ci-results/production-images"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-production-images-attempt${{ github.run_attempt }}
          compression-level: 0
          path: ${{ runner.temp }}/ci-results/production-images
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-production-images-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/production-images/result.json
          if-no-files-found: error
          retention-days: 14

  sdk-validation:
    concurrency:
      group: ci-validation-sdk-validation-${{ matrix.node }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: sdk-validation (Node ${{ matrix.node }})
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
        with:
          node: ${{ matrix.node }}
          binaries: gitleaks
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run shared SDK version, runtime and packed consumer validation
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite "sdk-node${{ matrix.node }}" --output "$RUNNER_TEMP/ci-results/sdk-node${{ matrix.node }}"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-sdk-node${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node${{ matrix.node }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-sdk-node${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/sdk-node${{ matrix.node }}/result.json
          if-no-files-found: error
          retention-days: 14

  browser:
    concurrency:
      group: ci-validation-browser-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    needs: geospatial-changes
    if: needs.geospatial-changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
        with:
          binaries: gitleaks
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - name: Run shared real-browser validation
        run: python scripts/ci_preflight.py run-suite --plan "$RUNNER_TEMP/ci-plans" --suite browser --output "$RUNNER_TEMP/ci-results/browser"
      - uses: actions/upload-artifact@v4
        id: retained-results
        if: always()
        with:
          name: ci-result-browser-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/browser
          if-no-files-found: error
          retention-days: 14
      - name: Upload compact gate result
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.retained-results.outcome == 'success' }}
        with:
          name: ci-gate-result-browser-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-results/browser/result.json
          if-no-files-found: error
          retention-days: 14

  ci-ready:
    concurrency:
      group: ci-validation-ci-ready-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: ci-ready
    permissions:
      contents: read
      actions: read
    if: always()
    needs: [geospatial-changes, lint, tests, geospatial-integration, production-images, sdk-validation, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tested_sha: ${{ needs.geospatial-changes.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-validation-plan-attempt*
          path: ${{ runner.temp }}/ci-plans
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-gate-result-*
          path: ${{ runner.temp }}/ci-results
      - name: Require every selected suite and matrix entry
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"ci-jobs.json").write_text(os.environ["JOB_RESULTS"])'
          python scripts/ci_preflight.py verify --plan "$RUNNER_TEMP/ci-plans" \
            --results "$RUNNER_TEMP/ci-results" --jobs "$RUNNER_TEMP/ci-jobs.json" \
            --output "$RUNNER_TEMP/ci-ready/evidence.json"
      - name: Recheck retained WDPA image availability before deployment allocation
        if: ${{ needs.geospatial-changes.outputs.wdpa_processing == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/wdpa_staged_image_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-ready-evidence-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-ready/evidence.json
          if-no-files-found: error
          retention-days: 14

  dataset-mutation-selection:
    needs: ci-ready
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_numbers: ${{ steps.discover.outputs.pr_numbers }}
      has_mutations: ${{ steps.discover.outputs.has_mutations }}
      has_repo_alert: ${{ steps.repo_alert_selection.outputs.has_repo_alert }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enumerate immutable merged mutation plans
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_mutation_authorization.py discover
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.8'
      - name: Sync pinned announcement parser dependencies
        run: uv sync --locked --no-dev
      - name: Inspect every commit for repository announcements
        id: repo_alert_selection
        env:
          BASE_SHA: ${{ github.event.before }}
        run: uv run --no-sync python scripts/repo_alerts.py select-from-git-range --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

  announce-repo-functionality:
    needs: [ci-ready, dataset-mutation-selection]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.dataset-mutation-selection.outputs.has_repo_alert == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/repo-functionality-alert.yml
    with:
      base_sha: ${{ github.event.before }}
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
    secrets: inherit

  publish-reviewed-dataset:
    name: "Publish PR #${{ matrix.pr_number }}"
    needs: [ci-ready, dataset-mutation-selection, geospatial-changes, pmtiles-cdn]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.dataset-mutation-selection.outputs.has_mutations == 'true' && (needs.geospatial-changes.outputs.pmtiles_cdn != 'true' || needs.pmtiles-cdn.result == 'success') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr_number: ${{ fromJSON(needs.dataset-mutation-selection.outputs.pr_numbers) }}
    permissions:
      contents: read
      actions: read
      deployments: write
      pull-requests: read
      issues: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-dataset.yml
    with:
      pr_number: ${{ matrix.pr_number }}
      executor_sha: ${{ github.sha }}
    secrets: inherit

  ingestion-iam:
    needs: [ci-ready, geospatial-changes, dataset-usage]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.geospatial-changes.outputs.ingestion_iam == 'true' && (needs.geospatial-changes.outputs.dataset_usage != 'true' || needs.dataset-usage.result == 'success') }}
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/scheduled-ingestion-deploy-iam-sync.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit

  eamlis:
    needs: [ci-ready, geospatial-changes, ingestion-iam, artifact-registry-iam]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.geospatial-changes.outputs.eamlis == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/eamlis-monthly-deploy.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit

  wdpa:
    needs: [ci-ready, geospatial-changes, ingestion-iam, artifact-registry-iam]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.geospatial-changes.outputs.wdpa == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
      attestations: write
      pull-requests: read
    uses: ./.github/workflows/wdpa-monthly-deploy.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit

  sea-ice:
    needs: [ci-ready, geospatial-changes, ingestion-iam, artifact-registry-iam]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.geospatial-changes.outputs.sea_ice == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/sea-ice-daily-deploy.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit

  wdpa-processing:
    needs: [ci-ready, geospatial-changes, artifact-registry-iam]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.geospatial-changes.outputs.wdpa_processing == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
      attestations: write
      pull-requests: read
    uses: ./.github/workflows/wdpa-processing-validation-deploy.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit

  pmtiles-cdn:
    needs: [ci-ready, geospatial-changes, dataset-usage]
    if: ${{ always() && (needs.geospatial-changes.outputs.dataset_usage != 'true' || needs.dataset-usage.result == 'success') && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.geospatial-changes.outputs.pmtiles_cdn == 'true' }}
    permissions:
      contents: read
      actions: read
      deployments: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/pmtiles-cdn-sync.yml
    with:
      executor_sha: ${{ needs.ci-ready.outputs.tested_sha }}
      source_run_id: ${{ format('{0}', github.run_id) }}
      source_run_attempt: ${{ format('{0}', github.run_attempt) }}
    secrets: inherit

  dataset-usage:
    needs: [ci-ready, geospatial-changes, artifact-registry-iam]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ready.result == 'success' && needs.geospatial-changes.outputs.dataset_usage == 'true' }}
    permissions:
