name: Isolated notification rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHARED_DATASETS_SLACK_TEST_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_TEST_CHANNEL_ID }}
      SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
    steps:
      - name: Require trusted main workflow and isolated destination
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/notification-rehearsal.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
          if [[ -z "$SHARED_DATASETS_SLACK_TEST_CHANNEL_ID" || -z "$SHARED_DATASETS_SLACK_CHANNEL_ID" ||
                "$SHARED_DATASETS_SLACK_TEST_CHANNEL_ID" == "$SHARED_DATASETS_SLACK_CHANNEL_ID" ||
                "$SHARED_DATASETS_SLACK_TEST_CHANNEL_ID" == C0B12LDMB1A ]]; then
            echo "Configure a separate test channel; synthetic shared-channel delivery is forbidden." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Rehearse isolated notification delivery
        env:
          SHARED_DATASETS_SLACK_TEST_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_TEST_BOT_TOKEN }}
        run: python scripts/notification_rehearsal.py --output "$RUNNER_TEMP/alert-probe-report.json"
      - name: Retain probe verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: alert-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/alert-probe-report.json
          if-no-files-found: error
