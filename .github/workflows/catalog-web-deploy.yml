name: Catalog web deploy

on:
  workflow_call:
    inputs:
      executor_sha:
        required: true
        type: string
      authorization_artifact_id:
        required: true
        type: string
      authorization_sha256:
        required: true
        type: string
      pr_number:
        required: true
        type: number
      mutation_completed:
        required: true
        type: boolean
  workflow_run:
    workflows:
      - Release index rebuild
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

env:
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  SHARED_DATASETS_BUCKET: skytruth-shared-datasets-1
  PUBLISHER_SERVICE_ACCOUNT: shared-datasets-publisher@shared-datasets-1.iam.gserviceaccount.com
  SHARED_DATASETS_ALLOW_CANONICAL_MUTATION: "1"
  CATALOG_WEB_CACHE_CONTROL: "no-cache, max-age=0, must-revalidate"
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    name: Build and publish catalog web
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    if: >-
      ${{
        inputs.mutation_completed == true ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.event == 'workflow_dispatch'
        )
      }}
    concurrency:
      group: catalog-web-deploy
      cancel-in-progress: false

    steps:
      - name: Validate main ref
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Catalog web deploy may only publish from main after reviewed changes have landed." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.executor_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download immutable mutation authorization
        if: ${{ inputs.mutation_completed == true }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.authorization_artifact_id }}
          path: authorization

      - name: Verify successful mutation provenance
        if: ${{ inputs.mutation_completed == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.authorization_sha256 }}
          EXECUTOR_SHA: ${{ inputs.executor_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          python scripts/dataset_mutation_authorization.py verify --directory authorization --expected-sha256 "$EXPECTED_SHA256"
          python scripts/catalog_refresh_authorization.py \
            --authorization authorization/authorization.json \
            --executor-sha "$EXECUTOR_SHA" --pr-number "$PR_NUMBER"

      - name: Verify successful release index rebuild provenance
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          expected = event['workflow_run']
          repository = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh', 'api', f"repos/{repository}/actions/runs/{expected['id']}"], text=True))
          workflow = json.loads(subprocess.check_output(['gh', 'api', f"repos/{repository}/actions/workflows/{run['workflow_id']}"], text=True))
          if (run['status'] != 'completed' or run['conclusion'] != 'success'
                  or run['event'] != 'workflow_dispatch' or run['head_branch'] != 'main'
                  or run['head_repository']['full_name'] != repository
                  or run['head_sha'] != expected['head_sha']
                  or run['run_attempt'] != expected['run_attempt']
                  or workflow['path'] != '.github/workflows/release-index-rebuild.yml'
                  or subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != run['head_sha']):
              raise SystemExit('Catalog refresh requires the exact successful trusted index rebuild')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check generated catalog docs
        run: uv run python scripts/catalog_docs.py check

      - name: Run focused catalog tests
        run: |
          uv run pytest \
            tests/test_catalog_site.py \
            tests/test_catalog_web_pmtiles_js.py \
            tests/test_catalog_web_publish.py \
            tests/test_catalog_web_workflows.py

      - name: Check browser JavaScript syntax
        run: |
          node --check web/catalog/app.js
          node --check web/catalog/map-preview.js

      - name: Validate publisher auth configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail

          if [[ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            echo "Missing repository variable: GCP_WORKLOAD_IDENTITY_PROVIDER" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PUBLISHER_SERVICE_ACCOUNT }}

      - name: Collect release indexes
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-indexes"
          if gcloud storage ls "gs://${SHARED_DATASETS_BUCKET}/_catalog/releases/*.json" >/dev/null 2>&1; then
            gcloud storage cp "gs://${SHARED_DATASETS_BUCKET}/_catalog/releases/*.json" "${RUNNER_TEMP}/release-indexes/"
          else
            echo "No release indexes found; building catalog without release history."
          fi

      - name: Build catalog web bundle
        run: |
          uv run python scripts/catalog_site.py \
            --release-index-dir "${RUNNER_TEMP}/release-indexes" \
            --latest-from-release-index \
            --out "${RUNNER_TEMP}/catalog-web"

      - name: Publish catalog web bundle
        run: |
          uv run python scripts/catalog_web_publish.py \
            --source "${RUNNER_TEMP}/catalog-web" \
            --destination "gs://${SHARED_DATASETS_BUCKET}/_catalog/web" \
            --catalog-source "catalog/shared-datasets-catalog.csv" \
            --catalog-destination "gs://${SHARED_DATASETS_BUCKET}/_catalog/shared-datasets-catalog.csv" \
            --cache-control "${CATALOG_WEB_CACHE_CONTROL}"

      - name: Verify live catalog after publication
        run: |
          uv run python scripts/catalog_drift_guard.py \
            --release-index-dir "${RUNNER_TEMP}/release-indexes" \
            --latest-from-release-index
