name: Protected Terraform readiness

# Offline only: live prerequisites are verified by trusted main after bootstrap.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  readiness:
    name: release-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - run: uv sync --locked --all-groups
      - name: Validate release evidence and permission dependencies
        run: uv run --no-sync python scripts/release_contracts.py --target all
