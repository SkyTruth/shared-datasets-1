name: Feature metadata localization materialization

on:
  workflow_run:
    workflows:
      - Approved dataset mutation
    types:
      - completed
  workflow_dispatch:
    inputs:
      translation_source_uri:
        description: "Canonical .metadata-translations.csv URI to materialize."
        required: false
        type: string
      asset_slug:
        description: "Expected asset slug for manual dispatch validation."
        required: false
        type: string
      release:
        description: "Expected release date, YYYY-MM-DD. Optional for latest/ translation refreshes."
        required: false
        type: string
      fail_on_stale:
        description: "Fail if stale translations are detected instead of reporting and skipping them."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  pull-requests: read
  actions: read

env:
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  SHARED_DATASETS_BUCKET: skytruth-shared-datasets-1
  PUBLISHER_SERVICE_ACCOUNT: shared-datasets-publisher@shared-datasets-1.iam.gserviceaccount.com
  UV_CACHE_DIR: .uv-cache
  UV_VERSION: "0.11.8"
  PYTHON_VERSION: "3.12"

jobs:
  materialize:
    name: Materialize localized metadata sidecars
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    concurrency:
      group: feature-metadata-localization-${{ github.event.workflow_run.id || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Validate manual dispatch ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Feature metadata localization materialization must run from main for canonical writes." >&2
            exit 1
          fi

      - name: Check out trusted repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Prepare reviewed publish plan
        id: reviewed_plan
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dataset_mutation_authorization.py from-run --directory "${RUNNER_TEMP}/dataset-authorization"

      - name: Check out upstream immutable executor
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.reviewed_plan.outputs.executor_sha }}

      - name: Verify upstream authorization
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ steps.reviewed_plan.outputs.envelope_sha256 }}
        run: python scripts/dataset_mutation_authorization.py verify --directory "${RUNNER_TEMP}/dataset-authorization" --expected-sha256 "$EXPECTED_SHA256"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Validate publisher auth configuration
        if: >-
          ${{
            (
              github.event_name == 'workflow_run' &&
              steps.reviewed_plan.outputs.has_publish_plan == 'true'
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.translation_source_uri != ''
            )
          }}
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail

          if [[ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            echo "Missing repository variable: GCP_WORKLOAD_IDENTITY_PROVIDER" >&2
            exit 1
          fi

      - name: Recheck upstream acceptance before publisher authentication
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ steps.reviewed_plan.outputs.envelope_sha256 }}
        run: python scripts/dataset_mutation_authorization.py verify --directory "${RUNNER_TEMP}/dataset-authorization" --expected-sha256 "$EXPECTED_SHA256"

      - name: Authenticate as shared datasets publisher
        if: >-
          ${{
            (
              github.event_name == 'workflow_run' &&
              steps.reviewed_plan.outputs.has_publish_plan == 'true'
            ) ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.translation_source_uri != ''
            )
          }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PUBLISHER_SERVICE_ACCOUNT }}

      - name: Materialize reviewed translation-source promotions
        if: ${{ github.event_name == 'workflow_run' && steps.reviewed_plan.outputs.has_publish_plan == 'true' }}
        env:
          SHARED_DATASETS_ALLOW_CANONICAL_MUTATION: "1"
        run: |
          set -euo pipefail

          uv run python scripts/feature_metadata_translation_pipeline.py \
            --publish-plan publish-plan.json \
            --work-dir "${RUNNER_TEMP}/feature-metadata-localization" \
            --upload \
            --report "${RUNNER_TEMP}/feature-metadata-localization/summary.json"

      - name: Materialize manual translation source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.translation_source_uri != '' }}
        env:
          SHARED_DATASETS_ALLOW_CANONICAL_MUTATION: "1"
        run: |
          set -euo pipefail

          stale_args=()
          if [[ "${{ inputs.fail_on_stale }}" == "true" ]]; then
            stale_args+=(--fail-on-stale)
          fi

          optional_args=()
          if [[ -n "${{ inputs.asset_slug }}" ]]; then
            optional_args+=(--asset-slug "${{ inputs.asset_slug }}")
          fi
          if [[ -n "${{ inputs.release }}" ]]; then
            optional_args+=(--release "${{ inputs.release }}")
          fi

          uv run python scripts/feature_metadata_translation_pipeline.py \
            --translation-source-uri "${{ inputs.translation_source_uri }}" \
            --work-dir "${RUNNER_TEMP}/feature-metadata-localization" \
            --upload \
            --report "${RUNNER_TEMP}/feature-metadata-localization/summary.json" \
            "${optional_args[@]}" \
            "${stale_args[@]}"

      - name: Upload materialization report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-metadata-localization-report
          path: ${{ runner.temp }}/feature-metadata-localization
          if-no-files-found: ignore
