name: Catalog / PMTiles CDN sync
'on':
  workflow_dispatch:
    inputs:
      executor_sha: {"description": "Exact tested main revision for selective recovery", "required": true, "type": "string"}
      source_run_id: {"description": "Main CI run that validated the executor", "required": true, "type": "string"}
      source_run_attempt: {"description": "Exact successful ci-ready attempt", "required": true, "type": "string"}
  workflow_call:
    inputs:
      executor_sha: {required: true, type: string}
      source_run_id: {required: true, type: string}
      source_run_attempt: {required: true, type: string}
permissions:
  contents: read
  actions: read
  pull-requests: read
  deployments: write
  id-token: write
  attestations: write
concurrency:
  group: deployment-pmtiles-cdn
  queue: max
  cancel-in-progress: false
env:
  BOOTSTRAP_WORKFLOW_SHA: ${{ github.workflow_sha }}
  EXECUTOR_SHA: ${{ inputs.executor_sha }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TERRAFORM_VERSION: 1.8.5
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
jobs:
  sync:
    name: Apply PMTiles CDN route sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    steps:
      - name: Validate main ref
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                ("${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/pmtiles-cdn-sync.yml@refs/heads/main" &&
                 "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main") ]]; then exit 1; fi
      - &trusted-checkout
        name: Check out trusted deployment verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - &trusted-bootstrap
        name: Authorize tested executor and retain trusted receipt policy
        uses: ./.github/actions/deployment-bootstrap
        with:
          workflow: pmtiles-cdn-sync.yml
          executor-sha: ${{ inputs.executor_sha }}
          source-run-id: ${{ inputs.source_run_id }}
          source-run-attempt: ${{ inputs.source_run_attempt }}
      - name: Check already completed deployment
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/deployment_revision.py check --workflow pmtiles-cdn-sync.yml --target pmtiles-cdn \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Authenticate protected deployer
        uses: ./.github/actions/deployment-auth
        if: steps.replay.outputs.proceed == 'true'
      - name: Set up Terraform
        if: steps.replay.outputs.proceed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform init
        if: steps.replay.outputs.proceed == 'true'
        run: terraform -chdir=terraform/envs/prod init -input=false
      - name: Verify existing PMTiles bootstrap authority
        if: steps.replay.outputs.proceed == 'true'
        run: python scripts/deployment_permissions.py --target pmtiles-cdn-bootstrap
      - name: Terraform plan PMTiles managed-folder IAM bootstrap
        if: steps.replay.outputs.proceed == 'true'
        run: |
          image_vars_text="$(python scripts/ingestion_targets.py image-vars)"
          image_vars=(); while IFS= read -r variable; do image_vars+=("$variable"); done <<< "$image_vars_text"
          bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod plan \
            -input=false \
            -refresh=false \
            -out="${RUNNER_TEMP}/pmtiles-managed-folder-bootstrap.tfplan" \
            -target=google_storage_bucket.shared_bucket \
            -target=google_project_iam_custom_role.pmtiles_managed_folder_sync \
            -target=google_project_iam_custom_role.pmtiles_url_map_sync \
            -target=google_storage_bucket_iam_member.github_actions_pmtiles_managed_folder_sync \
            "${image_vars[@]}"
      - name: Export PMTiles managed-folder IAM bootstrap plan JSON
        if: steps.replay.outputs.proceed == 'true'
        run: terraform -chdir=terraform/envs/prod show -json "${RUNNER_TEMP}/pmtiles-managed-folder-bootstrap.tfplan" > "${RUNNER_TEMP}/pmtiles-managed-folder-bootstrap.tfplan.json"
      - name: Enforce PMTiles managed-folder IAM bootstrap allowlist
        if: steps.replay.outputs.proceed == 'true'
        run: python scripts/cdn_plan_readiness.py check-bootstrap --plan-json "${RUNNER_TEMP}/pmtiles-managed-folder-bootstrap.tfplan.json"
      - name: Verify permissions required by the saved CDN bootstrap plan
        if: steps.replay.outputs.proceed == 'true'
        run: python scripts/deployment_permissions.py --target pmtiles-cdn-bootstrap --plan-json "${RUNNER_TEMP}/pmtiles-managed-folder-bootstrap.tfplan.json"
      - name: Verify run-bound signing capability without mutation
        if: steps.replay.outputs.proceed == 'true'
        uses: ./.github/actions/deployment-receipt
        with:
          mode: rehearsal
          signer-workflow: pmtiles-cdn-sync.yml
      - name: Record serialized CDN deployment attempt
        if: steps.replay.outputs.proceed == 'true'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="terraform@sha256:$(python scripts/deployment_artifact.py terraform/envs/prod/*.tf terraform/envs/prod/.terraform.lock.hcl catalog/shared-datasets-catalog.csv)"
          python scripts/deployment_revision.py start --workflow pmtiles-cdn-sync.yml \
            --target pmtiles-cdn --artifact "$artifact" --plan-json "${RUNNER_TEMP}/pmtiles-managed-folder-bootstrap.tfplan.json" \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Attest serialized deployment claim before mutation
        id: claim-receipt
        if: ${{ steps.deployment.outputs.proceed == 'true' }}
        uses: ./.github/actions/deployment-receipt
        with:
          mode: receipt
          receipt-path: ${{ steps.deployment.outputs.receipt_path }}
      - name: Terraform apply PMTiles managed-folder IAM bootstrap
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod apply -input=false "${RUNNER_TEMP}/pmtiles-managed-folder-bootstrap.tfplan"
      - name: Verify PMTiles managed-folder dependencies
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: python scripts/deployment_permissions.py --target pmtiles-cdn
      - name: Terraform plan
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: |
          image_vars_text="$(python scripts/ingestion_targets.py image-vars)"
          image_vars=(); while IFS= read -r variable; do image_vars+=("$variable"); done <<< "$image_vars_text"
          bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod plan \
            -input=false \
            -refresh=false \
            -out="${RUNNER_TEMP}/pmtiles-cdn-sync.tfplan" \
            -target=google_storage_bucket.shared_bucket \
            -target=google_compute_url_map.pmtiles_cdn \
            -target=google_storage_managed_folder.shared_bucket_public_prefixes \
            -target=google_storage_managed_folder_iam_member.shared_bucket_public_object_viewers \
            "${image_vars[@]}"
      - name: Export Terraform plan JSON
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: terraform -chdir=terraform/envs/prod show -json "${RUNNER_TEMP}/pmtiles-cdn-sync.tfplan" > "${RUNNER_TEMP}/pmtiles-cdn-sync.tfplan.json"
      - name: Enforce PMTiles resource-change allowlist
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: python scripts/cdn_plan_readiness.py check-runtime --plan-json "${RUNNER_TEMP}/pmtiles-cdn-sync.tfplan.json"
      - name: Verify permissions required by the saved CDN plan
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: python scripts/deployment_permissions.py --target pmtiles-cdn --plan-json "${RUNNER_TEMP}/pmtiles-cdn-sync.tfplan.json"
      - name: Terraform apply
        if: steps.deployment.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success'
        run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod apply -input=false "${RUNNER_TEMP}/pmtiles-cdn-sync.tfplan"
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}
      claim_signed: ${{ steps.claim-receipt.outcome }}
  verify:
    name: Verify CDN outside Terraform state queue
    needs: sync
    if: ${{ always() && needs.sync.outputs.deployment_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: shared-datasets-production
    steps:
      - *trusted-checkout
      - *trusted-bootstrap
      - name: Require successful signed apply
        env:
          APPLY_RESULT: ${{ needs.sync.result }}
          CLAIM_SIGNED: ${{ needs.sync.outputs.claim_signed }}
        run: test "$APPLY_RESULT" = success && test "$CLAIM_SIGNED" = success
      - name: Authenticate protected observer
        uses: ./.github/actions/deployment-auth
        with:
          service-account: shared-datasets-observer@shared-datasets-1.iam.gserviceaccount.com
      - name: Authenticate cache invalidator
        uses: ./.github/actions/deployment-auth
        with:
          service-account: shared-datasets-runtime@shared-datasets-1.iam.gserviceaccount.com
      - name: Invalidate catalog CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache shared-datasets-pmtiles-cdn \
            --path="/_catalog/*" \
            --project="${GOOGLE_CLOUD_PROJECT}"
      - name: Restore observer for route verification
        uses: ./.github/actions/deployment-auth
        with:
          service-account: shared-datasets-observer@shared-datasets-1.iam.gserviceaccount.com
      - name: Verify catalog CDN routes
        run: python -I -S scripts/cdn_plan_readiness.py verify-routes
      - name: Record terminal deployment outcome
        id: deployment-outcome
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ needs.sync.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          phase=failed
          if [[ "$JOB_STATUS" == success ]]; then phase=verified; fi
          python scripts/deployment_revision.py finish --deployment-id "$DEPLOYMENT_ID" --phase "$phase"
        if: ${{ always() }}
      - name: Attest terminal deployment outcome
        uses: ./.github/actions/deployment-receipt
        with:
          mode: receipt
          receipt-path: ${{ steps.deployment-outcome.outputs.receipt_path }}
        if: ${{ always() && steps.deployment-outcome.outputs.receipt_path != '' }}
