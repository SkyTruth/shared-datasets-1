name: Alerts / Workflow health and Slack reconciliation

on:
  workflow_run:
    # Historical aliases keep reruns and incident replay observable.
    workflows:
      - "Approved dataset mutation"
      - "Artifact Registry IAM sync"
      - "Bucket hygiene audit"
      - "CI"
      - "CI / Validate and deliver"
      - "Catalog / PMTiles CDN sync"
      - "Catalog / Viewer deploy"
      - "Catalog / Web deploy"
      - "Catalog viewer deploy"
      - "Catalog web deploy"
      - "Cron alert policy sync"
      - "Data / Approved mutation"
      - "Data / Scratch cleanup audit"
      - "Deployment completion check"
      - "Deployment read-only reconciliation"
      - "Deployment terminal verification"
      - "Deployments / Completion check"
      - "Deployments / Read-only reconciliation"
      - "EAMLIS monthly deploy"
      - "Infrastructure / Artifact Registry IAM sync"
      - "Infrastructure / Cron alert policy sync"
      - "Infrastructure / Ingestion deploy IAM sync"
      - "Infrastructure / Preview Terraform IAM sync"
      - "Infrastructure / Scratch cleanup IAM sync"
      - "Ingestion / EAMLIS monthly deploy"
      - "Ingestion / MPAtlas monthly deploy"
      - "Ingestion / Sea ice daily deploy"
      - "Ingestion / WDPA monthly deploy"
      - "MPAtlas monthly deploy"
      - "PMTiles CDN sync"
      - "Preview Terraform IAM sync"
      - "Prod Terraform state reconciliation"
      - "Publish TypeScript SDK"
      - "SDK / Publish TypeScript"
      - "Scheduled ingestion deploy IAM sync"
      - "Scratch cleanup IAM sync"
      - "Scratch cleanup audit"
      - "Sea ice daily deploy"
      - "WDPA monthly deploy"
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      incident_id:
        description: Exact incident ID with unconfirmed Slack delivery
        required: true
        type: string
      operation:
        description: Claimed operation, checkpoint:ID:SHA256, or replay:START..END for an owner-reviewed UTC catch-up
        required: true
        type: string
      delivery_result:
        description: Owner confirmation after inspecting the incident in Slack
        required: true
        type: choice
        options: [delivered, not-delivered, seal-checkpoint, replay-window]
      message_ts:
        description: Exact message timestamp when confirming delivered; empty otherwise
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: >-
      vars.SHARED_DATASETS_SLACK_INCIDENTS_ENABLED != 'true' &&
      github.event.workflow_run.status == 'completed' &&
      contains(fromJSON('["failure","timed_out","cancelled","action_required","startup_failure","stale"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_run' ||
        (github.event.workflow_run.event == 'push' && contains(fromJSON('["CI / Validate and deliver","CI"]'), github.event.workflow_run.name)) ||
        (github.event.workflow_run.event == 'workflow_dispatch' && contains(fromJSON('["Deployments / Completion check","Deployment completion check","Deployment terminal verification","Deployments / Read-only reconciliation","Deployment read-only reconciliation"]'), github.event.workflow_run.name))
      )
    runs-on: ubuntu-latest
    steps:
      # workflow_run is privileged: use trusted main code, never the source
      # run's checkout, caches, or artifacts. Event text is parsed as data.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify unattended failures
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_WEBHOOK_URL: ${{ secrets.SHARED_DATASETS_SLACK_WEBHOOK_URL }}
        run: python scripts/workflow_failure_alert.py --event-path "$GITHUB_EVENT_PATH"

  incidents:
    name: Reconcile Slack incident status
    if: >-
      vars.SHARED_DATASETS_SLACK_INCIDENTS_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.status == 'completed' &&
          contains(fromJSON('["success","failure","timed_out","cancelled","action_required","startup_failure","stale"]'), github.event.workflow_run.conclusion) &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'workflow_run' ||
            github.event.workflow_run.event == 'workflow_dispatch' ||
            (github.event.workflow_run.event == 'push' && contains(fromJSON('["CI / Validate and deliver","CI"]'), github.event.workflow_run.name))
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: write
      attestations: write
      id-token: write
    concurrency:
      group: slack-incidents-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/unattended-workflow-alert.yml@refs/heads/main" ]]; then
            echo "Incident notifications require this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: false
      - name: Install locked notification dependencies
        run: uv sync --locked --no-dev
      - name: Install pinned durable receipt verifier
        run: python scripts/install_deployment_verifier.py
      - name: Prepare incident changes and claim posts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
          SHARED_DATASETS_SLACK_INCIDENTS_SINCE: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_SINCE }}
        run: uv run --no-sync python scripts/slack_incidents.py prepare --work-dir "$RUNNER_TEMP/slack-incidents"
      - name: Attest incident claims before Slack delivery
        id: attest-claims
        if: ${{ always() && steps.prepare.outputs.claims == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/slack-incidents/claims/*.json
          create-storage-record: false
      - name: Deliver or update incident messages
        id: deliver
        if: ${{ always() && steps.prepare.outputs.claims == 'true' && steps.attest-claims.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
        run: uv run --no-sync python scripts/slack_incidents.py deliver --work-dir "$RUNNER_TEMP/slack-incidents"
      - name: Attest confirmed deliveries even after a later send fails
        id: attest-outcomes
        if: ${{ always() && steps.deliver.outputs.outcomes == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/slack-incidents/outcomes/*.json
          create-storage-record: false
      - name: Verify durable incident checkpoints
        if: ${{ always() && (steps.attest-claims.outcome == 'success' || steps.attest-outcomes.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/slack_incidents.py verify --work-dir "$RUNNER_TEMP/slack-incidents"
