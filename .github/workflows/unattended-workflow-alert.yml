name: Workflow health and Slack reconciliation
run-name: ${{ inputs.action == 'supervision' && format('Supervision {0}', inputs.supervision_request_id) || 'Workflow health and Slack reconciliation' }}

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_run:
    workflows:
      - Bucket hygiene audit
      - Scratch cleanup audit
      - Catalog web deploy
      - Catalog viewer deploy
      - PMTiles CDN sync
      - CI
      - Publish TypeScript SDK
      - Deployment completion check
      # Retain coverage for reruns of historical workflow revisions.
      - Deployment terminal verification
      - Deployment read-only reconciliation
      - MPAtlas monthly deploy
      - EAMLIS monthly deploy
      - WDPA monthly deploy
      - Sea ice daily deploy
      - Artifact Registry IAM sync
      - Scheduled ingestion deploy IAM sync
      - Preview Terraform IAM sync
      - Scratch cleanup IAM sync
      - Cron alert policy sync
      - Approved dataset mutation
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: Reconcile uncertain delivery, or register/check in accountable supervision
        type: choice
        options: [reconcile-delivery, supervision]
        default: reconcile-delivery
      supervision_request:
        description: Exact JSON request from scripts/slack_supervision.py; no authority or clocks accepted
        type: string
      supervision_request_id:
        description: Unique CLI request ID used to verify this exact signed workflow run
        type: string
      incident_id:
        description: Exact incident ID with unconfirmed Slack delivery
        required: false
        type: string
      operation:
        description: Exact first claimed operation, or checkpoint:ID:SHA256 for reviewed checkpoint sealing
        required: false
        type: string
      delivery_result:
        description: Owner confirmation after inspecting the incident in Slack
        required: false
        type: choice
        options: [none, delivered, not-delivered, seal-checkpoint]
        default: none
      message_ts:
        description: Exact message timestamp when confirming delivered; empty otherwise
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  incidents:
    name: Reconcile Slack incident status
    if: >-
      vars.SHARED_DATASETS_SLACK_INCIDENTS_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (
          github.event.workflow_run.status == 'completed' &&
          contains(fromJSON('["success","failure","timed_out","cancelled","action_required","startup_failure","stale"]'), github.event.workflow_run.conclusion) &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            github.event.workflow_run.event == 'schedule' ||
            github.event.workflow_run.event == 'workflow_run' ||
            github.event.workflow_run.event == 'workflow_dispatch' ||
            (github.event.workflow_run.event == 'push' && github.event.workflow_run.name == 'CI')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      deployments: write
      attestations: write
      id-token: write
    concurrency:
      group: slack-incidents-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/unattended-workflow-alert.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: false
      - name: Install locked notification dependencies
        run: uv sync --locked --no-dev
      - name: Install pinned durable receipt verifier
        run: python scripts/install_deployment_verifier.py
      - name: Authenticate read-only cloud observer
        if: ${{ github.event_name == 'schedule' && vars.SHARED_DATASETS_CLOUD_OBSERVATIONS_ENABLED == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_OPERATIONAL_OBSERVER_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_OPERATIONAL_OBSERVER_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Prepare incident changes and claim posts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
          SHARED_DATASETS_SLACK_INCIDENTS_SINCE: ${{ vars.SHARED_DATASETS_SLACK_INCIDENTS_SINCE }}
          SHARED_DATASETS_CLOUD_OBSERVATIONS_ENABLED: ${{ vars.SHARED_DATASETS_CLOUD_OBSERVATIONS_ENABLED }}
        run: uv run --no-sync python scripts/operational_reconcile.py prepare --work-dir "$RUNNER_TEMP/slack-incidents"
      - name: Attest incident claims before Slack delivery
        id: attest-claims
        if: ${{ always() && steps.prepare.outputs.claims == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/slack-incidents/claims/*.json
          create-storage-record: false
      - name: Deliver or update incident messages
        id: deliver
        if: ${{ always() && steps.prepare.outputs.claims == 'true' && steps.attest-claims.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
          SHARED_DATASETS_SLACK_CHANNEL_ID: ${{ vars.SHARED_DATASETS_SLACK_CHANNEL_ID }}
        run: uv run --no-sync python scripts/operational_reconcile.py deliver --work-dir "$RUNNER_TEMP/slack-incidents"
      - name: Attest confirmed deliveries even after a later send fails
        id: attest-outcomes
        if: ${{ always() && steps.deliver.outputs.outcomes == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/slack-incidents/outcomes/*.json
          create-storage-record: false
      - name: Verify durable incident checkpoints
        id: verify
        if: ${{ always() && (steps.attest-claims.outcome == 'success' || steps.attest-outcomes.outcome == 'success' || steps.prepare.outputs.cycle_proposed == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/operational_reconcile.py verify --work-dir "$RUNNER_TEMP/slack-incidents"
      - name: Persist complete cloud cycle after verified incident delivery
        id: finalize-cycle
        if: ${{ success() && steps.prepare.outputs.cycle_proposed == 'true' && steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_CLOUD_OBSERVATIONS_ENABLED: ${{ vars.SHARED_DATASETS_CLOUD_OBSERVATIONS_ENABLED }}
        run: uv run --no-sync python scripts/operational_reconcile.py finalize-cycle --work-dir "$RUNNER_TEMP/slack-incidents"
      - name: Attest complete cloud cycle
        id: attest-cycle
        if: ${{ success() && steps.finalize-cycle.outputs.cycle_saved == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/slack-incidents/claims/*.json
          create-storage-record: false
      - name: Verify durable cloud cycle and emit pipeline heartbeat
        if: ${{ success() && steps.attest-cycle.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DATASETS_CLOUD_OBSERVATIONS_ENABLED: ${{ vars.SHARED_DATASETS_CLOUD_OBSERVATIONS_ENABLED }}
        run: uv run --no-sync python scripts/operational_reconcile.py verify-heartbeat --work-dir "$RUNNER_TEMP/slack-incidents"
