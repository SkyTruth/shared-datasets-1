name: Inspect held EAMLIS candidate

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact 64-character candidate ID from the EAMLIS quality hold
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: feature-branch-preview
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      UV_CACHE_DIR: .uv-cache
      PREVIEW_BUCKET: skytruth-shared-datasets-1-preview
      PREVIEW_URL: https://feature-preview-catalog-viewer-vmust7rama-uc.a.run.app
    steps:
      - name: Require trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/eamlis-held-candidate-preview.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.8'
      - run: uv sync --frozen
      - name: Authenticate read of exact held production inputs
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: shared-datasets-publisher@shared-datasets-1.iam.gserviceaccount.com
      - name: Download immutable candidate and published baseline
        run: uv run python scripts/eamlis_source_loss_review.py download-preview --candidate-id "$CANDIDATE_ID" --directory "$RUNNER_TEMP/held-preview"
      - name: Authenticate preview catalog publisher
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: feature-preview-loader@shared-datasets-1.iam.gserviceaccount.com
      - name: Load exact dataset bytes into private preview
        run: uv run python scripts/eamlis_source_loss_review.py upload-preview --directory "$RUNNER_TEMP/held-preview"
      - name: Collect preview release indexes
        run: uv run python scripts/eamlis_source_loss_review.py collect-preview-indexes --directory "$RUNNER_TEMP/held-indexes"
      - name: Build staging catalog
        run: |
          uv run python scripts/catalog_site.py --bucket "$PREVIEW_BUCKET" \
            --release-index-dir "$RUNNER_TEMP/held-indexes" --feature-preview \
            --release-index-assets-only --latest-from-release-index --allow-release-index-only-assets \
            --force-access-tier private --out "$RUNNER_TEMP/held-catalog"
      - name: Publish staging catalog
        env:
          SHARED_DATASETS_ALLOW_CANONICAL_MUTATION: '1'
        run: |
          uv run python scripts/catalog_web_publish.py --source "$RUNNER_TEMP/held-catalog" \
            --destination "gs://$PREVIEW_BUCKET/_catalog/web" --cache-control 'no-cache, max-age=0, must-revalidate'
      - name: Retain inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: eamlis-source-loss-preview-${{ inputs.candidate_id }}
          path: |
            ${{ runner.temp }}/held-preview/preview.json
            ${{ runner.temp }}/held-preview/preview-results.json
          if-no-files-found: error
      - name: Report staging review
        run: |
          {
            echo '## Held EAMLIS candidate — production is unchanged'
            echo "Candidate: \`$CANDIDATE_ID\`"
            echo "[Open the private staging catalog]($PREVIEW_URL) and select EAMLIS."
            echo 'The candidate and published baseline are available as separate versions.'
            echo 'After investigation, prepare the immutable approval PR with:'
            echo '`uv run python scripts/eamlis_source_loss_review.py prepare-plan`'
          } >> "$GITHUB_STEP_SUMMARY"
