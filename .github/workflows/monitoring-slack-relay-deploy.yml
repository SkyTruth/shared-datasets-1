name: Monitoring Slack relay deploy

on:
  workflow_dispatch:
    inputs:
      executor_sha:
        description: Exact tested main revision
        required: true
        type: string
      source_run_id:
        description: Main-push CI run that tested executor_sha
        required: true
        type: string
      source_run_attempt:
        description: Exact successful ci-ready attempt
        required: true
        type: string
      confirmed_secret_version:
        description: Optional exact numeric bot-secret version already inspected for receipt-only recovery; never latest
        required: false
        type: string

permissions:
  actions: read
  deployments: write
  contents: read
  id-token: write
  attestations: write

env:
  EXECUTOR_SHA: ${{ inputs.executor_sha }}
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  REGION: us-central1
  ARTIFACT_REGISTRY_REPOSITORY: shared-datasets-jobs
  IMAGE_NAME: monitoring-slack-relay
  JOB_NAME: monitoring-slack-relay
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TERRAFORM_VERSION: 1.8.5
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
  UV_VERSION: 0.11.8
  PYTHON_VERSION: '3.12'

jobs:
  bootstrap:
    name: Apply Monitoring Slack relay secret authority bootstrap
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: monitoring-slack-relay-deploy.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: iam-bootstrap
      sync_name: Monitoring Slack relay secret authority bootstrap
      refusal_prefix: Refusing Monitoring Slack relay secret authority bootstrap
      block_deletes: true
      post_apply_wait_seconds: 30
      targets: |
        google_project_iam_custom_role.monitoring_slack_secret_creator
        google_project_iam_member.github_actions_monitoring_slack_secret_creator
        google_project_iam_custom_role.monitoring_slack_secret_manager
        google_project_iam_member.github_actions_monitoring_slack_secret_manager
      allowed_exact: |
        google_project_iam_custom_role.monitoring_slack_secret_creator
        google_project_iam_member.github_actions_monitoring_slack_secret_creator
        google_project_iam_custom_role.monitoring_slack_secret_manager
        google_project_iam_member.github_actions_monitoring_slack_secret_manager
      tf_vars: |
        wdpa_monthly_image=unused-by-monitoring-slack-bootstrap
        sea_ice_daily_image=unused-by-monitoring-slack-bootstrap
        eamlis_monthly_image=unused-by-monitoring-slack-bootstrap

  secret-setup:
    name: Apply Monitoring Slack relay secret setup
    needs: bootstrap
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/prod-terraform-target-apply.yml
    with:
      caller_workflow: monitoring-slack-relay-deploy.yml
      executor_sha: ${{ inputs.executor_sha }}
      source_run_id: ${{ inputs.source_run_id }}
      source_run_attempt: ${{ inputs.source_run_attempt }}
      readiness_target: monitoring-slack-secret-setup
      sync_name: Monitoring Slack relay secret setup
      refusal_prefix: Refusing Monitoring Slack relay secret setup
      block_deletes: true
      targets: |
        google_secret_manager_secret.monitoring_slack_bot_token
        module.monitoring_slack_service_account.google_service_account.this
      allowed_exact: |
        google_secret_manager_secret.monitoring_slack_bot_token
        module.monitoring_slack_service_account.google_service_account.this
      tf_vars: |
        wdpa_monthly_image=unused-by-monitoring-slack-secret-setup
        sea_ice_daily_image=unused-by-monitoring-slack-secret-setup
        eamlis_monthly_image=unused-by-monitoring-slack-secret-setup

  deploy:
    name: Deploy tested Monitoring Slack relay in shadow
    needs: secret-setup
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    steps:
      - name: Validate trusted main workflow
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ||
                "${GITHUB_WORKFLOW_REF}" != "${GITHUB_REPOSITORY}/.github/workflows/monitoring-slack-relay-deploy.yml@refs/heads/main" ]]; then
            echo "Execution must use this workflow from main." >&2
            exit 1
          fi

      - name: Check out trusted verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact executor and confirmed-version inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          CONFIRMED_SECRET_VERSION: ${{ inputs.confirmed_secret_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXECUTOR_SHA" =~ ^[0-9a-f]{40}$ ||
                ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ||
                ! "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ||
                ( -n "$CONFIRMED_SECRET_VERSION" && ! "$CONFIRMED_SECRET_VERSION" =~ ^[1-9][0-9]*$ ) ]]; then
            echo "Relay preparation requires this trusted main workflow and exact tested executor inputs." >&2
            exit 1
          fi

      - name: Install pinned durable receipt verifier
        run: python scripts/install_deployment_verifier.py

      - name: Verify executor before candidate checkout
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          python scripts/deployment_revision.py verify --bootstrap --workflow monitoring-slack-relay-deploy.yml \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 0

      - name: Verify tested main revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          python scripts/deployment_revision.py verify --workflow monitoring-slack-relay-deploy.yml \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Validate Terraform auth configuration
        run: |
          set -euo pipefail
          [[ -n "$TERRAFORM_WORKLOAD_IDENTITY_PROVIDER" && -n "$TERRAFORM_SERVICE_ACCOUNT" ]]

      - name: Check prior deployment before loading tested image
        id: replay
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          python scripts/deployment_revision.py check --target monitoring-slack-relay --workflow monitoring-slack-relay-deploy.yml \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"

      - name: Authenticate to Google Cloud
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync Python dependencies
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: uv sync --locked --all-groups

      - name: Verify live deployment permissions
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: python scripts/deployment_permissions.py --target monitoring-slack-relay

      - name: Verify Artifact Registry image permissions
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: python scripts/deployment_permissions.py --target artifact-registry-images

      - name: Configure Docker for Artifact Registry
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Load the exact CI-tested relay image
        id: tested-image
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          python scripts/tested_image_authorization.py --workflow monitoring-slack-relay-deploy.yml --target monitoring-slack-relay \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/tested-monitoring-slack-relay"

      - name: Tag the exact tested relay image
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          TESTED_IMAGE_ID: ${{ steps.tested-image.outputs.image_id }}
        run: |
          set -euo pipefail
          image_tag="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${EXECUTOR_SHA}-${GITHUB_RUN_ID}"
          docker tag "$TESTED_IMAGE_ID" "$image_tag"
          echo "MONITORING_SLACK_IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"

      - name: Verify run-bound signing capability without mutation
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: ./.github/actions/deployment-receipt
        with:
          mode: rehearsal
          signer-workflow: monitoring-slack-relay-deploy.yml

      - name: Push tested relay image and verify registry config
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          TESTED_IMAGE_CONFIG: ${{ steps.tested-image.outputs.config_digest }}
        run: |
          set -euo pipefail
          docker push "$MONITORING_SLACK_IMAGE_TAG"
          docker buildx imagetools inspect --raw "$MONITORING_SLACK_IMAGE_TAG" > "$RUNNER_TEMP/monitoring-slack-relay-manifest.json"
          python -c 'import json, os, sys; manifest=json.load(open(sys.argv[1])); actual=manifest.get("config", {}).get("digest"); expected=os.environ["TESTED_IMAGE_CONFIG"]; assert actual == expected, "Registry image config differs from tested bytes"' "$RUNNER_TEMP/monitoring-slack-relay-manifest.json"
          image_digest="$(docker buildx imagetools inspect "$MONITORING_SLACK_IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the exact immutable relay image digest." >&2
            exit 1
          fi
          image_ref="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}@${image_digest}"
          echo "MONITORING_SLACK_IMAGE=$image_ref" >> "$GITHUB_ENV"

      - name: Seed the dedicated bot secret once
        id: seed
        if: ${{ steps.replay.outputs.proceed == 'true' && inputs.confirmed_secret_version == '' }}
        env:
          SHARED_DATASETS_SLACK_BOT_TOKEN: ${{ secrets.SHARED_DATASETS_SLACK_BOT_TOKEN }}
        run: uv run --no-sync python scripts/monitoring_slack_deploy.py --seed-bot-secret

      - name: Confirm the explicitly inspected existing bot-secret version
        id: confirmed-secret
        if: ${{ steps.replay.outputs.proceed == 'true' && inputs.confirmed_secret_version != '' }}
        env:
          CONFIRMED_SECRET_VERSION: ${{ inputs.confirmed_secret_version }}
        run: |
          uv run --no-sync python scripts/monitoring_slack_deploy.py \
            --confirm-bot-secret-version "$CONFIRMED_SECRET_VERSION"

      - name: Prepare pinned shadow-only relay configuration
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          SECRET_VERSION: ${{ steps.seed.outputs.secret_version || steps.confirmed-secret.outputs.secret_version }}
        run: |
          uv run --no-sync python scripts/monitoring_slack_deploy.py --prepare-config \
            --secret-version "$SECRET_VERSION" --image "$MONITORING_SLACK_IMAGE"

      - name: Set up Terraform
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: terraform -chdir=terraform/envs/prod init -input=false

      - name: Terraform plan
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          plan_args=(-input=false -out="$RUNNER_TEMP/monitoring-slack-relay.tfplan"
            -var="wdpa_monthly_image=unused-by-monitoring-slack-deploy"
            -var="eamlis_monthly_image=unused-by-monitoring-slack-deploy"
            -var="sea_ice_daily_image=unused-by-monitoring-slack-deploy")
          uv run --no-sync python scripts/monitoring_slack_deploy.py --targets > "$RUNNER_TEMP/monitoring-slack-relay-targets.txt"
          while IFS= read -r target; do
            [[ -n "$target" ]] || continue
            plan_args+=("-target=$target")
          done < "$RUNNER_TEMP/monitoring-slack-relay-targets.txt"
          bash "$GITHUB_WORKSPACE/scripts/terraform_retry.sh" -chdir=terraform/envs/prod plan "${plan_args[@]}"

      - name: Export Terraform plan JSON
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: terraform -chdir=terraform/envs/prod show -json "$RUNNER_TEMP/monitoring-slack-relay.tfplan" > "$RUNNER_TEMP/monitoring-slack-relay.tfplan.json"

      - name: Enforce exact generic Terraform resource-change allowlist
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          allowed_exact="$(uv run --no-sync python scripts/monitoring_slack_deploy.py --targets)"
          python scripts/terraform_plan_allowlist.py "$RUNNER_TEMP/monitoring-slack-relay.tfplan.json" \
            --allowed-exact="$allowed_exact" --block-deletes \
            --refusal-prefix="Refusing Monitoring Slack relay deploy"

      - name: Enforce relay resource and shadow-mode guard
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: |
          uv run --no-sync python scripts/monitoring_slack_deploy.py \
            --plan-json "$RUNNER_TEMP/monitoring-slack-relay.tfplan.json" --image "$MONITORING_SLACK_IMAGE"

      - name: Verify complete saved-plan mutation permissions
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        run: python scripts/deployment_permissions.py --target monitoring-slack-relay --plan-json "$RUNNER_TEMP/monitoring-slack-relay.tfplan.json"

      - name: Claim tested deployment revision
        id: revision
        if: ${{ steps.replay.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          python scripts/deployment_revision.py start --target monitoring-slack-relay --workflow monitoring-slack-relay-deploy.yml \
            --executor-sha "$EXECUTOR_SHA" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --artifact "$MONITORING_SLACK_IMAGE" --plan-json "$RUNNER_TEMP/monitoring-slack-relay.tfplan.json"

      - name: Attest serialized deployment claim before mutation
        id: claim-receipt
        if: ${{ steps.revision.outputs.proceed == 'true' }}
        uses: ./.github/actions/deployment-receipt
        with:
          mode: receipt
          receipt-path: ${{ steps.revision.outputs.receipt_path }}

      - name: Terraform apply
        if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
        run: bash "$GITHUB_WORKSPACE/scripts/terraform_retry.sh" -chdir=terraform/envs/prod apply -input=false "$RUNNER_TEMP/monitoring-slack-relay.tfplan"

      - name: Verify live shadow configuration and no active execution
        if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-monitoring-slack-live.py" <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import google.auth
          from google.auth.transport.requests import AuthorizedSession
          from google.cloud import storage
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.monitoring_slack_deploy import BUCKET, PROJECT, REGION, RUNTIME, SCHEDULER, SECRET, registry
          from services.monitoring_slack import model
          from services.monitoring_slack.store import CAPABILITY_OBJECT

          phase = sys.argv[1]
          assert phase in {"before", "after"}
          credentials, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
          session = AuthorizedSession(credentials, max_refresh_attempts=0, refresh_timeout=15)
          parent = f"projects/{PROJECT}/locations/{REGION}/jobs/monitoring-slack-relay"
          run_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          image = os.environ["MONITORING_SLACK_IMAGE"]
          selected = json.loads(os.environ["TF_VAR_monitoring_slack_relay"])
          reviewed = registry()

          def get(host, version, resource, params=None):
              response = session.get(f"https://{host}/{version}/{resource}", params=params,
                                     timeout=15, max_allowed_time=30, allow_redirects=False)
              response.raise_for_status()
              value = response.json()
              assert isinstance(value, dict), "Incomplete live metadata"
              return value

          secret = get("secretmanager.googleapis.com", "v1", SECRET)
          assert re.fullmatch(r"projects/[1-9][0-9]*/secrets/" + re.escape(SECRET.rsplit("/", 1)[1]), secret.get("name", "")), "Secret metadata did not return its canonical numeric project identity"
          job = get("run.googleapis.com", "v2", parent)
          assert job.get("name") == parent
          execution_template = job["template"]
          assert execution_template["taskCount"] == execution_template["parallelism"] == 1
          task = execution_template["template"]
          assert task["serviceAccount"] == RUNTIME and task.get("maxRetries", 0) == 0 and task["timeout"] == "240s"
          containers = task["containers"]
          assert len(containers) == 1
          container = containers[0]
          assert container["image"] == image
          assert container["command"] == ["python", "-m", "services.monitoring_slack.run"]
          assert not container.get("args")
          assert len(container["env"]) == 1 and container["env"][0]["name"] == "MONITORING_SLACK_CONFIG"
          config = model.Config.parse(json.loads(container["env"][0]["value"]))
          expected = model.Config.parse({
              "schema": "monitoring-slack-config-v1", "project": PROJECT,
              "policies": [{"name": name, "kind": "health" if key == "health" else "security"}
                           for key, name in reviewed["policies"].items()],
              "health_metric": "custom.googleapis.com/shared_datasets/operational_reconciliation_heartbeat_v2",
              "health_policy_created_at": selected["health_policy_created_at"],
              "state_bucket": BUCKET, "slack_secret_version": f"{secret['name']}/versions/{selected['secret_version']}",
              "slack_channel": reviewed["slack_channel"], "slack_team": reviewed["slack_team"],
              "slack_user": reviewed["slack_user"], "activated_at": selected["activated_at"], "mode": "shadow",
          })
          assert config.value == expected.value, "Deployed relay differs from its reviewed shadow configuration"
          scheduler = get("cloudscheduler.googleapis.com", "v1", parent)
          assert scheduler["name"] == parent and scheduler["state"] == "PAUSED"
          assert scheduler["schedule"] == "*/5 * * * *" and scheduler["timeZone"] == "UTC"
          target = scheduler["httpTarget"]
          assert target["uri"] == f"https://{REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/{PROJECT}/jobs/monitoring-slack-relay:run" and target["httpMethod"] == "POST"
          assert target["oauthToken"]["serviceAccountEmail"] == SCHEDULER
          assert scheduler.get("retryConfig", {}).get("retryCount", 0) == 0

          executions, names, tokens, page = [], set(), set(), None
          for _ in range(100):
              params = {"pageSize": 1000, "showDeleted": "true", **({"pageToken": page} if page else {})}
              value = get("run.googleapis.com", "v2", parent + "/executions", params)
              assert value.keys() <= {"executions", "nextPageToken"}, "Incomplete execution inventory"
              rows = value.get("executions", [])
              assert isinstance(rows, list)
              for row in rows:
                  assert isinstance(row, dict) and re.fullmatch(re.escape(parent) + r"/executions/[a-z][a-z0-9-]{0,62}", row.get("name", ""))
                  assert row["name"] not in names, "Duplicate execution identity"
                  if row.get("completionTime"):
                      assert model.instant(row["createTime"]) <= model.instant(row["completionTime"]) <= model.instant(model.utc_now())
                  names.add(row["name"])
                  executions.append(row)
              page = value.get("nextPageToken", "")
              assert isinstance(page, str) and page not in tokens
              if not page:
                  break
              tokens.add(page)
          else:
              raise AssertionError("Execution inventory exceeded its complete-page bound")
          assert not any(not row.get("completionTime") for row in executions), "An execution remains active; no overlapping canary is allowed"
          proof = {"phase": phase, "read_at": datetime.now(timezone.utc).isoformat(), "job": job,
                   "scheduler": scheduler, "complete_executions": executions, "config_binding": config.binding}
          if phase == "after":
              matches = []
              for row in executions:
                  candidate = row.get("template", {}).get("containers", [])
                  if len(candidate) == 1 and any(env.get("name") == "SHARED_DATASETS_GITHUB_ACTIONS_RUN_URL" and env.get("value") == run_url for env in candidate[0].get("env", [])):
                      matches.append(row)
              assert len(matches) == 1, "Capability execution is missing or ambiguous"
              execution = get("run.googleapis.com", "v2", matches[0]["name"])
              assert execution["name"] == matches[0]["name"] and execution.get("completionTime")
              assert execution["taskCount"] == execution["succeededCount"] == 1
              assert execution.get("failedCount", 0) == execution.get("cancelledCount", 0) == 0
              completed = [condition for condition in execution["conditions"] if condition.get("type") == "Completed"]
              assert len(completed) == 1 and completed[0]["state"] == "CONDITION_SUCCEEDED"
              canary_task = execution["template"]
              assert canary_task["serviceAccount"] == RUNTIME and len(canary_task["containers"]) == 1
              canary = canary_task["containers"][0]
              assert canary["image"] == image and canary["args"] == ["--verify-capabilities"]
              assert canary["command"] == ["python", "-m", "services.monitoring_slack.run"]
              canary_env = canary["env"]
              assert len(canary_env) == 2
              assert {entry["name"]: entry["value"] for entry in canary_env} == {
                  "MONITORING_SLACK_CONFIG": container["env"][0]["value"],
                  "SHARED_DATASETS_GITHUB_ACTIONS_RUN_URL": run_url,
              }
              started = (Path(os.environ["RUNNER_TEMP"]) / "monitoring-slack-canary-start.txt").read_text().strip()
              assert model.instant(execution["createTime"]) >= model.instant(started)
              blob = storage.Client(project=PROJECT, credentials=credentials).bucket(BUCKET).blob(CAPABILITY_OBJECT)
              blob.reload(timeout=15, retry=None)
              generation = int(blob.generation)
              assert generation > 0 and 0 < blob.size <= 4096
              marker_body = blob.download_as_bytes(if_generation_match=generation, timeout=15, retry=None)
              assert len(marker_body) == blob.size
              marker = model.parse_json(marker_body)
              assert marker["schema"] == "monitoring-slack-capability-v1" and marker["binding"] == config.binding
              assert marker["execution_name"] == execution["name"].rsplit("/", 1)[1] and marker["github_run_url"] == run_url
              assert model.instant(started) <= model.instant(execution["createTime"]) <= model.instant(marker["checked_at"]) <= model.instant(execution["completionTime"]) <= model.instant(model.utc_now())
              proof.update(capability_execution=execution, capability_marker=marker, capability_marker_generation=generation)
          (Path(os.environ["RUNNER_TEMP"]) / f"monitoring-slack-live-{phase}.json").write_text(json.dumps(proof, sort_keys=True) + "\n")
          print(f"Verified exact relay image, shadow configuration, paused scheduler and complete execution inventory ({phase}).")
          PY
          uv run --no-sync python "$RUNNER_TEMP/verify-monitoring-slack-live.py" before

      - name: Execute read-only capability canary
        if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"))' > "$RUNNER_TEMP/monitoring-slack-canary-start.txt"
          gcloud run jobs execute "$JOB_NAME" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" --wait \
            --args=--verify-capabilities \
            --update-env-vars="SHARED_DATASETS_GITHUB_ACTIONS_RUN_URL=${GITHUB_SERVER_URL:?}/${GITHUB_REPOSITORY:?}/actions/runs/${GITHUB_RUN_ID:?}" \
            --format=json > "$RUNNER_TEMP/monitoring-slack-relay-capability-execution.json"

      - name: Verify terminal capability proof and paused shadow deployment
        if: ${{ steps.revision.outputs.proceed == 'true' && steps.claim-receipt.outcome == 'success' }}
        run: |
          set -euo pipefail
          uv run --no-sync python "$RUNNER_TEMP/verify-monitoring-slack-live.py" after
          echo "DEPLOYMENT_PHASE=verified" >> "$GITHUB_ENV"

      - name: Record deployment outcome
        id: deployment-outcome
        if: ${{ always() && steps.revision.outputs.deployment_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.revision.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          phase="${DEPLOYMENT_PHASE:-unknown}"
          if [[ "$JOB_STATUS" != "success" ]]; then phase=failed; fi
          python scripts/deployment_revision.py finish --deployment-id "$DEPLOYMENT_ID" --phase "$phase"

      - name: Attest terminal deployment outcome
        if: ${{ always() && steps.deployment-outcome.outputs.receipt_path != '' }}
        uses: ./.github/actions/deployment-receipt
        with:
          mode: receipt
          receipt-path: ${{ steps.deployment-outcome.outputs.receipt_path }}
