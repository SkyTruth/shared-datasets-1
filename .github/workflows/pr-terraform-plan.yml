name: Infrastructure / Read-only PR plan
on:
  workflow_call:
    inputs:
      active:
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  plan:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.active }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: .uv-cache
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
      TF_WORKSPACE: default
      PRODUCTION_TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}
    steps:
      - name: Require activated planner configuration
        env:
          PROVIDER: ${{ vars.GCP_PR_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          PLANNER: ${{ vars.GCP_PR_PLAN_SERVICE_ACCOUNT }}
        run: test -n "$PROVIDER" && test -n "$PLANNER" && test -n "$PRODUCTION_TERRAFORM_SERVICE_ACCOUNT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
        with:
          binaries: terraform
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-validation-plan-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan
      - name: Sync locked planner dependencies before authentication
        run: uv sync --locked
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_PR_PLAN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PR_PLAN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Check selected live plans without mutation or plan artifacts
        run: uv run --no-sync python scripts/pr_terraform_plan.py run --plan "$RUNNER_TEMP/ci-plan/plan.json"
