name: WDPA monthly deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wdpa-monthly-deploy.yml"
      - "catalog/feature-identity-resolutions/**"
      - "scripts/publication_rollout_gate.py"
      - "ingestion/common/**"
      - "ingestion/wdpa_monthly/**"
      - "scripts/feature_metadata_localization.py"
      - "scripts/feature_metadata_translation_reuse.py"
      - "scripts/translation_local_io.py"
      - "scripts/pmtiles_zoom.py"
      - "scripts/release_feature_model.py"
      - "scripts/slack_notify.py"
      - "scripts/vector_asset.py"
      - "terraform/envs/prod/main.tf"
      - "terraform/envs/prod/wdpa_monthly.tf"
      - "terraform/envs/prod/wdpa_execution_observer.tf"
      - "catalog/wdpa-processing-acceptance.json"
      - "scripts/wdpa_processing_gate.py"
      - "terraform/envs/prod/wdpa_monthly_variables.tf"
      - "terraform/envs/prod/variables.tf"
      - "terraform/envs/prod/versions.tf"
      - "terraform/modules/cloud_run_job/**"
      - "terraform/modules/scheduler_job/**"
  workflow_dispatch:
    inputs:
      cancel_running_canary:
        description: "Cancel an execution that is already running instead of skipping the canary. Use when replacing known-bad code."
        required: false
        type: boolean
        default: false
      failure_alert_verified_execution:
        description: "Controlled failure execution whose actual alert delivery you verified. Required before a canary may write datasets."
        required: false
        type: string
        default: ""
      canary_run_date:
        description: "Optional RUN_DATE (YYYY-MM-DD) execution override for the post-deploy canary, e.g. a deliberate metadata-contract repair or backfill publish."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  REGION: us-central1
  ARTIFACT_REGISTRY_REPOSITORY: shared-datasets-jobs
  IMAGE_NAME: wdpa-monthly
  JOB_NAME: wdpa-monthly
  BUCKET: skytruth-shared-datasets-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.8.5"
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

jobs:
  deploy:
    name: Prepare publication image and apply wdpa-monthly Terraform
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false

    steps:
      - name: Validate main ref
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "WDPA monthly deploy may only apply from main after reviewed changes have landed." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Terraform auth configuration
        run: |
          set -euo pipefail

          if [[ -z "${TERRAFORM_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            echo "Missing repository variable: GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER" >&2
            exit 1
          fi
          if [[ -z "${TERRAFORM_SERVICE_ACCOUNT}" ]]; then
            echo "Missing repository variable: GCP_TERRAFORM_SERVICE_ACCOUNT" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Require WDPA processing acceptance and disk quota
        run: uv run --no-sync python scripts/wdpa_processing_gate.py

      - name: Verify reviewed build promotion authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/wdpa_build_authorization.py

      - name: Verify feature-ID publication state
        run: uv run --no-sync python scripts/publication_rollout_gate.py --job wdpa-monthly

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Verify accepted build terminal success
        run: |
          set -euo pipefail
          execution="$(python -c 'import json; print(json.load(open("catalog/wdpa-processing-acceptance.json"))["build"]["cloud_execution"])')"
          gcloud run jobs executions describe "$execution" --region="$REGION" --project="$GOOGLE_CLOUD_PROJECT" --format=json > "$RUNNER_TEMP/accepted-wdpa-execution.json"
          python - "$RUNNER_TEMP/accepted-wdpa-execution.json" <<'PY'
          import json, sys
          accepted = json.load(open('catalog/wdpa-processing-acceptance.json'))['build']
          execution = json.load(open(sys.argv[1]))
          status = execution['status']
          image = execution['spec']['template']['spec']['containers'][0]['image']
          if (not status.get('completionTime') or int(status.get('succeededCount', 0)) != 1
              or int(status.get('failedCount', 0)) != 0 or image != accepted['cloud_image']):
              raise SystemExit('Only a terminal successful execution of the accepted image may be promoted')
          PY

      - name: Prepare reviewed WDPA publication image
        run: |
          set -euo pipefail

          accepted_image="$(python -c 'import json; print(json.load(open("catalog/wdpa-processing-acceptance.json"))["build"]["cloud_image"])')"
          expected_config="$(python -c 'import json; print(json.load(open("catalog/wdpa-processing-acceptance.json"))["build"]["image_digest"])')"
          docker pull --platform linux/amd64 "${accepted_image}"
          actual_config="$(docker image inspect "${accepted_image}" --format '{{.Id}}')"
          if [[ "${actual_config}" != "${expected_config}" ]]; then
            echo "Accepted WDPA image configuration digest does not match the registry image." >&2
            exit 1
          fi
          expected_source="$(python -c 'import json; print(json.load(open("catalog/wdpa-processing-acceptance.json"))["build"]["source_tree_sha256"])')"
          actual_source="$(docker run --platform linux/amd64 --rm "${accepted_image}" python scripts/wdpa_processing_gate.py --print-source-digest)"
          if [[ "${actual_source}" != "${expected_source}" ]]; then
            echo "Accepted WDPA image does not match the reviewed producer fingerprint." >&2
            exit 1
          fi
          image_tag="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker build --platform linux/amd64 \
            --file ingestion/wdpa_monthly/Dockerfile.promotion \
            --build-arg "ACCEPTED_IMAGE=${accepted_image}" \
            --build-arg "ACCEPTED_BUILD_SOURCE_SHA256=${expected_source}" \
            --build-arg "SHARED_DATASETS_EXECUTOR_SHA=${GITHUB_SHA}" \
            --tag "${image_tag}" .
          echo "WDPA_MONTHLY_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"

      - name: Smoke-test native tools in image
        run: |
          set -euo pipefail

          docker run --platform linux/amd64 --rm "${WDPA_MONTHLY_IMAGE_TAG}" sh -c \
            'ogrinfo --version && ogr2ogr --version && tippecanoe --version && pmtiles version'

      - name: Smoke-test job import closure in image
        run: |
          set -euo pipefail

          docker run --platform linux/amd64 --rm "${WDPA_MONTHLY_IMAGE_TAG}" python -c \
            'from osgeo import gdal; assert gdal.VersionInfo("RELEASE_NAME") == "3.6.2"; import ingestion.wdpa_monthly.execution_observer; import ingestion.wdpa_monthly.run; import ingestion.wdpa_monthly.publication_only; import scripts.feature_metadata_localization, scripts.translation_local_io, scripts.pmtiles_zoom, scripts.release_feature_model, scripts.slack_notify, scripts.vector_asset; print("wdpa-monthly imports ok")'

      - name: Push wdpa-monthly image
        run: |
          set -euo pipefail

          docker push "${WDPA_MONTHLY_IMAGE_TAG}"
          image_digest="$(docker buildx imagetools inspect "${WDPA_MONTHLY_IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          if [[ -z "${image_digest}" || "${image_digest}" == "<no value>" ]]; then
            image_digest="$(docker buildx imagetools inspect "${WDPA_MONTHLY_IMAGE_TAG}" | awk '/^Digest:/ {print $2; exit}')"
          fi
          if [[ -z "${image_digest}" || "${image_digest}" != sha256:* ]]; then
            echo "Could not resolve immutable image digest for ${WDPA_MONTHLY_IMAGE_TAG}" >&2
            exit 1
          fi
          image_ref="${REGION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/${ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}@${image_digest}"
          echo "WDPA_MONTHLY_IMAGE=${image_ref}" >> "${GITHUB_ENV}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform -chdir=terraform/envs/prod init -input=false

      - name: Terraform plan
        run: |
          set -euo pipefail

          bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod plan \
            -input=false \
            -out="${RUNNER_TEMP}/wdpa-monthly.tfplan" \
            -target=module.wdpa_monthly_job.google_cloud_run_v2_job.this \
            -target="module.wdpa_observer_service_account.google_service_account.this" \
            -target="google_project_iam_custom_role.wdpa_execution_reader" \
            -target="google_cloud_run_v2_job_iam_member.wdpa_observer_execution_reader" \
            -target="google_storage_bucket_iam_member.wdpa_observer_status_writer" \
            -target="google_service_account_iam_member.wdpa_observer_deployer" \
            -target="module.wdpa_execution_observer_job.google_cloud_run_v2_job.this" \
            -target="google_cloud_run_v2_job_iam_member.wdpa_observer_scheduler_invoker" \
            -target="module.wdpa_execution_observer_scheduler.google_cloud_scheduler_job.this" \
            -target="google_iam_deny_policy.canonical_destructive_actions[0]" \
            -var="wdpa_monthly_image=${WDPA_MONTHLY_IMAGE}" \
            -var="eamlis_monthly_image=unused-by-wdpa-monthly-deploy" \
            -var="sea_ice_daily_image=unused-by-wdpa-monthly-deploy"

      - name: Export Terraform plan JSON
        run: terraform -chdir=terraform/envs/prod show -json "${RUNNER_TEMP}/wdpa-monthly.tfplan" > "${RUNNER_TEMP}/wdpa-monthly.tfplan.json"

      - name: Enforce wdpa-monthly resource-change allowlist
        run: |
          set -euo pipefail

          python - "${RUNNER_TEMP}/wdpa-monthly.tfplan.json" "${WDPA_MONTHLY_IMAGE}" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1]))
          expected_image = sys.argv[2]
          allowed_exact = {
              "module.wdpa_monthly_job.google_cloud_run_v2_job.this",
              "module.wdpa_observer_service_account.google_service_account.this",
              "google_project_iam_custom_role.wdpa_execution_reader",
              "google_cloud_run_v2_job_iam_member.wdpa_observer_execution_reader",
              "google_storage_bucket_iam_member.wdpa_observer_status_writer",
              "google_service_account_iam_member.wdpa_observer_deployer",
              "module.wdpa_execution_observer_job.google_cloud_run_v2_job.this",
              "google_cloud_run_v2_job_iam_member.wdpa_observer_scheduler_invoker",
              "module.wdpa_execution_observer_scheduler.google_cloud_scheduler_job.this",
              "google_iam_deny_policy.canonical_destructive_actions[0]",
          }

          blocked = []
          for resource in plan.get("resource_changes", []):
              actions = resource.get("change", {}).get("actions", [])
              if actions in ([], ["no-op"], ["read"]):
                  continue
              address = resource.get("address", "")
              if address not in allowed_exact:
                  blocked.append(f"{'/'.join(actions)} {address}")
                  continue
              permitted = (["update"],) if address in {
                  "module.wdpa_monthly_job.google_cloud_run_v2_job.this",
                  "google_iam_deny_policy.canonical_destructive_actions[0]",
              } else (["create"], ["update"])
              if actions not in permitted:
                  blocked.append(f"{'/'.join(actions)} {address}")
                  continue
              if address not in {"module.wdpa_monthly_job.google_cloud_run_v2_job.this",
                                  "module.wdpa_execution_observer_job.google_cloud_run_v2_job.this"}:
                  continue
              after = resource.get("change", {}).get("after", {})
              containers = (
                  after.get("template", [{}])[0]
                  .get("template", [{}])[0]
                  .get("containers", [{}])
              )
              image = containers[0].get("image") if containers else None
              if image != expected_image:
                  blocked.append(f"unexpected image for {address}: {image!r}")
              task = after.get("template", [{}])[0].get("template", [{}])[0]
              limits = containers[0].get("resources", [{}])[0].get("limits", {}) if containers else {}
              worker = address == "module.wdpa_monthly_job.google_cloud_run_v2_job.this"
              expected_limits = {"cpu": "4", "memory": "8Gi"} if worker else {"cpu": "1", "memory": "512Mi"}
              if limits != expected_limits or task.get("timeout") != ("86400s" if worker else "120s"):
                  blocked.append(f"unexpected processing limits for {address}")
              if worker:
                  volume = next((v for v in task.get("volumes", []) if v.get("name") == "work"), {})
                  disk = volume.get("empty_dir", [{}])[0] if volume.get("empty_dir") else {}
                  mounts = containers[0].get("volume_mounts", [])
                  env = {e.get("name"): e.get("value") for e in containers[0].get("env", [])}
                  if disk.get("medium") != "DISK" or disk.get("size_limit") != "100Gi" or not any(m.get("name") == "work" and m.get("mount_path") == "/work" for m in mounts):
                      blocked.append("WDPA requires the 100 GiB disk at /work")
                  if env.get("TMPDIR") != "/work/tmp" or env.get("SHARED_DATASETS_WORKDIR") != "/work/shared-datasets-1":
                      blocked.append("WDPA scratch paths must use /work")

          if blocked:
              print("Refusing wdpa-monthly deploy because the Terraform plan changes non-allowlisted resources:")
              for item in blocked:
                  print(f"- {item}")
              raise SystemExit(1)
          PY

      - name: Terraform apply
        run: bash "${GITHUB_WORKSPACE}/scripts/terraform_retry.sh" -chdir=terraform/envs/prod apply -input=false "${RUNNER_TEMP}/wdpa-monthly.tfplan"

      - name: Confirm deployed digest
        run: |
          set -euo pipefail

          deployed_image="$(gcloud run jobs describe "${JOB_NAME}" --region="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          echo "Deployed image: ${deployed_image}"
          if [[ "${deployed_image}" != "${WDPA_MONTHLY_IMAGE}" ]]; then
            echo "Cloud Run job image does not match expected digest." >&2
            exit 1
          fi

      - name: Resolve in-flight canary
        id: inflight
        env:
          CANCEL_RUNNING_CANARY: ${{ inputs.cancel_running_canary }}
          CANARY_RUN_DATE: ${{ inputs.canary_run_date }}
        run: |
          set -euo pipefail

          schedule_state="$(gcloud scheduler jobs describe "${JOB_NAME}" \
            --location="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" --format='value(state)')"
          if [[ "${schedule_state}" == PAUSED && -z "${CANARY_RUN_DATE}" ]]; then
            echo "run_canary=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Schedule is paused; deploy only. Use canary_run_date for a deliberate rollout execution."
            exit 0
          fi

          # Never start another publication alongside an existing execution.
          # Cancelling a known-bad execution does not release its durable claim.
          running="$(gcloud run jobs executions list \
            --job="${JOB_NAME}" --region="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" \
            --format='value(metadata.name,status.runningCount)' 2>/dev/null \
            | awk '$2 != "" && $2 != "0" {print $1; exit}')"

          if [[ -z "${running}" ]]; then
            echo "run_canary=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${CANCEL_RUNNING_CANARY}" == "true" ]]; then
            echo "Cancelling in-flight execution ${running} before the replacement canary."
            gcloud run jobs executions cancel "${running}" \
              --region="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" --quiet
            echo "run_canary=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "run_canary=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::Skipping canary: execution ${running} is already running for ${JOB_NAME}. Re-run with cancel_running_canary=true to replace it."

      - name: Verify failure visibility before dataset writes
        if: ${{ steps.inflight.outputs.run_canary == 'true' }}
        env:
          VERIFIED_EXECUTION: ${{ inputs.failure_alert_verified_execution }}
        run: |
          set -euo pipefail
          if [[ -z "${VERIFIED_EXECUTION}" ]]; then
            probe="$(gcloud run jobs execute "${JOB_NAME}" --region="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" \
              --update-env-vars=WDPA_FAIL_BEFORE_WRITES=true --async --format='value(metadata.name)')"
            echo "Controlled failure probe: ${probe}"
            for _ in $(seq 1 20); do
              failed="$(gcloud run jobs executions describe "${probe}" --region="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" --format='value(status.failedCount)')"
              if [[ "${failed}" == 1 ]]; then
                echo "::error::Verify actual alert delivery for ${probe}, then dispatch with failure_alert_verified_execution=${probe}. No dataset canary has started."
                exit 1
              fi
              sleep 15
            done
            echo "Controlled failure did not reach terminal failure within five minutes." >&2
            exit 1
          fi
          if [[ ! "${VERIFIED_EXECUTION}" =~ ^wdpa-monthly-[a-z0-9-]+$ ]]; then
            echo "Expected a WDPA execution ID" >&2
            exit 1
          fi
          gcloud run jobs executions describe "${VERIFIED_EXECUTION}" --region="${REGION}" --project="${GOOGLE_CLOUD_PROJECT}" \
            --format=json > "${RUNNER_TEMP}/wdpa-verified-failure.json"
          python - "${RUNNER_TEMP}/wdpa-verified-failure.json" <<'PY'
          import json, sys
          execution = json.load(open(sys.argv[1]))
          flags = {item["name"]: item.get("value") for item in execution["spec"]["template"]["spec"]["containers"][0].get("env", [])}
          if flags.get("WDPA_FAIL_BEFORE_WRITES") != "true" or int(execution["status"].get("failedCount", 0)) != 1:
              raise SystemExit("Alert-delivery evidence must name a failed controlled probe before dataset writes")
          PY

      - name: Execute wdpa-monthly canary
        if: ${{ steps.inflight.outputs.run_canary == 'true' }}
        env:
          CANARY_RUN_DATE: ${{ inputs.canary_run_date }}
        run: |
          set -euo pipefail

          execute_args=(
            "${JOB_NAME}"
            --region="${REGION}"
            --project="${GOOGLE_CLOUD_PROJECT}"
            --async
            "--format=value(metadata.name)"
          )
          if [[ -n "${CANARY_RUN_DATE}" ]]; then
            if [[ ! "${CANARY_RUN_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "canary_run_date must be YYYY-MM-DD, got: ${CANARY_RUN_DATE}" >&2
              exit 1
            fi
          fi
          bundle="$(python -c 'import json; print(json.dumps(json.load(open("catalog/wdpa-processing-acceptance.json"))["build"]["artifact_bundle"], separators=(",", ":")))')"
          build_date="$(python -c 'import json; print(json.load(open("catalog/wdpa-processing-acceptance.json"))["build"]["run_date"])')"
          if [[ -n "${CANARY_RUN_DATE}" && "${CANARY_RUN_DATE}" != "$build_date" ]]; then
            echo "Promotion must use the captured build date; changing RUN_DATE cannot bypass ownership." >&2
            exit 1
          fi
          execute_args+=(--update-env-vars="^|^WDPA_PROMOTION_BUNDLE=${bundle}|RUN_DATE=${build_date}")
          execution_name="$(gcloud run jobs execute "${execute_args[@]}")"
          echo "Canary execution: ${execution_name}"
          echo "WDPA_CANARY_EXECUTION=${execution_name}" >> "${GITHUB_ENV}"

      - name: Watch wdpa-monthly canary
        if: ${{ steps.inflight.outputs.run_canary == 'true' }}
        run: |
          set -euo pipefail

          # A full WDPA publish is a known multi-hour batch run, so this step
          # only rejects fast failures. A canary still running after the watch
          # window is reported and left to Cloud Run job failure alerting.
          for _ in $(seq 1 20); do
            state="$(gcloud run jobs executions describe "${WDPA_CANARY_EXECUTION}" \
              --region="${REGION}" \
              --project="${GOOGLE_CLOUD_PROJECT}" \
              --format='value(status.succeededCount,status.failedCount)')"
            succeeded="$(cut -f1 <<<"${state}")"
            failed="$(cut -f2 <<<"${state}")"
            if [[ -n "${failed}" && "${failed}" != "0" ]]; then
              echo "Canary execution ${WDPA_CANARY_EXECUTION} failed." >&2
              exit 1
            fi
            if [[ -n "${succeeded}" && "${succeeded}" != "0" ]]; then
              echo "Canary execution ${WDPA_CANARY_EXECUTION} succeeded."
              exit 0
            fi
            sleep 30
          done
          echo "Canary execution ${WDPA_CANARY_EXECUTION} is still running after the watch window."
          echo "Monitor it with: gcloud run jobs executions describe ${WDPA_CANARY_EXECUTION} --region=${REGION} --project=${GOOGLE_CLOUD_PROJECT}"
