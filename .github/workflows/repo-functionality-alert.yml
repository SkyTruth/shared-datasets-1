name: Repo functionality alert

on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      executor_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted main caller
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_EVENT_NAME" != push ||
                "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" ]]; then
            echo "Repository announcements require the validated main-push pipeline." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.executor_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Sync pinned dependencies
        run: uv sync --locked --no-dev

      - name: Send fenced repo alerts
        env:
          SHARED_DATASETS_SLACK_WEBHOOK_URL: ${{ secrets.SHARED_DATASETS_SLACK_WEBHOOK_URL }}
          BASE_SHA: ${{ inputs.base_sha }}
          EXECUTOR_SHA: ${{ inputs.executor_sha }}
        run: |
          set -euo pipefail
          test "$EXECUTOR_SHA" = "$GITHUB_SHA"
          uv run python scripts/repo_alerts.py send-from-git-range --base "$BASE_SHA" --head "$EXECUTOR_SHA"
