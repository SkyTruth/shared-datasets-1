name: Retire metadata serving infrastructure

on:
  workflow_dispatch:
    inputs:
      retire_metadata_stack:
        description: "Remove the retired standalone service and its IAM; preserve Firestore data."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  GOOGLE_CLOUD_PROJECT: shared-datasets-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TERRAFORM_VERSION: "1.8.5"
  TERRAFORM_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
  TERRAFORM_SERVICE_ACCOUNT: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

jobs:
  retire:
    if: ${{ inputs.retire_metadata_stack }}
    runs-on: ubuntu-latest
    environment: shared-datasets-production
    concurrency:
      group: prod-terraform-state
      queue: max
      cancel-in-progress: false
    steps:
      - name: Validate main ref and auth configuration
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Metadata retirement must run from main after reviewed changes have landed." >&2
            exit 1
          fi
          test -n "${TERRAFORM_WORKLOAD_IDENTITY_PROVIDER}"
          test -n "${TERRAFORM_SERVICE_ACCOUNT}"

      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform init
        run: terraform -chdir=terraform/envs/prod init -input=false

      - name: Plan metadata retirement
        run: |
          set -euo pipefail
          args=(-input=false -out="${RUNNER_TEMP}/metadata-retirement.tfplan")
          while IFS= read -r address; do
            args+=("-target=${address}")
          done < <(python - <<'PY'
          from scripts.metadata_retirement_plan import DATABASE_ADDRESS, DELETE_ADDRESSES, UPDATE_ADDRESSES
          for address in sorted(DELETE_ADDRESSES | UPDATE_ADDRESSES | {DATABASE_ADDRESS}):
              print(address)
          # Target every prior IAP accessor instance; the plan check restricts
          # these to delete-only changes on the retired standalone service.
          print("google_iap_web_cloud_run_service_iam_member.metadata_service_accessors")
          PY
          )
          bash scripts/terraform_retry.sh -chdir=terraform/envs/prod plan "${args[@]}"

      - name: Export and validate retirement plan
        run: |
          set -euo pipefail
          terraform -chdir=terraform/envs/prod show -json "${RUNNER_TEMP}/metadata-retirement.tfplan" > "${RUNNER_TEMP}/metadata-retirement.tfplan.json"
          python scripts/metadata_retirement_plan.py "${RUNNER_TEMP}/metadata-retirement.tfplan.json"

      - name: Apply approved retirement plan
        run: bash scripts/terraform_retry.sh -chdir=terraform/envs/prod apply -input=false "${RUNNER_TEMP}/metadata-retirement.tfplan"
