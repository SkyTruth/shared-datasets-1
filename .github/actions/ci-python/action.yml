name: Pinned validation Python
description: Install uv and the validation interpreter independently of project environments
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: '0.11.8'
        python-version: '3.12.12'
        enable-cache: true
    - name: Install the pinned default Python
      shell: bash
      env:
        UV_PYTHON_BIN_DIR: ${{ runner.temp }}/ci-python/bin
      run: |
        uv python install --default 3.12.12
        echo "$UV_PYTHON_BIN_DIR" >> "$GITHUB_PATH"
