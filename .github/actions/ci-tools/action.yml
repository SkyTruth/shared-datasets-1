name: Pinned validation tools
description: Install the repository validation toolchain without production credentials
inputs:
  node:
    description: Node major used by this suite; empty skips Node setup
    default: '22'
  binaries:
    description: Official pinned release binaries to install
    default: 'actionlint terraform gitleaks shellcheck'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/ci-python
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.node != ''
      with:
        node-version: ${{ inputs.node == '24' && '24.13.1' || '22.12.0' }}
        cache: npm
        cache-dependency-path: api/typescript/package-lock.json
    - name: Install verified release binaries
      shell: bash
      env:
        BINARIES: ${{ inputs.binaries }}
      run: |
        set -euo pipefail
        python scripts/ci_install_tools.py --destination "$RUNNER_TEMP/ci-tools" $BINARIES
        echo "$RUNNER_TEMP/ci-tools/bin" >> "$GITHUB_PATH"
        # Old local amd64 emulators can corrupt Go's asynchronous preemption.
        # Use the same runtime setting in CI; validation rules are unchanged.
        echo "GODEBUG=asyncpreemptoff=1" >> "$GITHUB_ENV"
