[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "skytruth-shared-datasets"
dynamic = ["version"]
description = "Tiny resolver SDK for SkyTruth shared dataset catalog entries."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2.19.0"]

[project.scripts]
skytruth-datasets = "skytruth_shared_datasets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skytruth_shared_datasets = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "skytruth_shared_datasets._version.__version__"}
