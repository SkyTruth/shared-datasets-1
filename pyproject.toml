[project]
name = "shared-datasets-1"
version = "0.1.0"
description = "Control-plane tooling for SkyTruth shared datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-cloud-storage>=2.19.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0",
  "flatgeobuf==0.3.1",
]

[project.optional-dependencies]
# Match Debian Bookworm's native GDAL in the WDPA deployment image.
wdpa-native = ["GDAL==3.6.2", "numpy==1.26.4"]

[tool.uv.extra-build-dependencies]
# Build the GDAL array extension too; native CI also exercises sea-ice CLIs.
gdal = ["numpy==1.26.4"]

[dependency-groups]
dev = [
  "geopandas==1.1.1",
  "pytest>=9.0.0",
  "rasterio==1.4.3",
  "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [
  "_scratch",
  "cache",
  "test-results",
  "web",
]

[tool.ruff.lint]
# Default rules (pycodestyle errors + pyflakes). Broaden deliberately, not by default.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts bootstrap sys.path before importing repo modules.
"scripts/*.py" = ["E402"]
".claude/skills/**/*.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config"
pythonpath = [".", "api/python/src"]
testpaths = ["tests"]
